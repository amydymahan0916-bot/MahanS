<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#070707"
>

<meta
  name="description"
  content="ماهان سنتر ایران"
>

<title>ماهان سنتر ایران</title>


<style>

/* =========================================================
   RESET
========================================================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#070707;
  color:#fff;
  font-family:
    Tahoma,
    Arial,
    sans-serif;

  min-height:100vh;

  overflow-x:hidden;
}

button,
input,
select,
textarea{
  font-family:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}


/* =========================================================
   ROOT
========================================================= */

:root{

  --green:#19d66b;
  --green2:#0fb957;

  --red:#ff3030;
  --red2:#d71919;

  --white:#ffffff;

  --black:#070707;
  --black2:#0d0d0d;
  --black3:#151515;

  --gray:#888;
  --gray2:#aaa;
  --border:rgba(255,255,255,.09);

}


/* =========================================================
   BODY
========================================================= */

body::before{

  content:"";

  position:fixed;

  inset:0;

  pointer-events:none;

  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(25,214,107,.07),
      transparent 35%
    );

  z-index:-1;

}


/* =========================================================
   HEADER
========================================================= */

.header{

  position:sticky;

  top:0;

  z-index:1000;

  background:
    rgba(7,7,7,.94);

  backdrop-filter:blur(15px);

  border-bottom:
    1px solid
    rgba(25,214,107,.13);

}


.header-inner{

  width:min(1200px,94%);

  margin:auto;

  min-height:72px;

  display:flex;

  align-items:center;

  gap:18px;

}


.brand{

  display:flex;

  align-items:center;

  gap:10px;

  min-width:max-content;

}


.logo{

  width:48px;
  height:48px;

  border-radius:50%;

  object-fit:cover;

  border:
    2px solid
    var(--green);

  box-shadow:
    0 0 20px
    rgba(25,214,107,.18);

}


.brand-name{

  font-size:18px;

  font-weight:900;

  white-space:nowrap;

}


.brand-mahan{
  color:var(--green);
}

.brand-center{
  color:#fff;
}

.brand-iran{
  color:var(--red);
}


/* =========================================================
   SEARCH
========================================================= */

.search-box{

  flex:1;

  display:flex;

  max-width:520px;

  margin:auto;

}


.search-box input{

  width:100%;

  height:44px;

  padding:
    0 16px;

  border:
    1px solid
    rgba(255,255,255,.1);

  border-left:0;

  outline:none;

  color:#fff;

  background:#111;

  border-radius:
    0 12px 12px 0;

}


.search-box input:focus{

  border-color:
    var(--green);

}


.search-box button{

  width:48px;

  border:0;

  color:#fff;

  background:
    var(--green);

  border-radius:
    12px 0 0 12px;

  font-size:18px;

}


/* =========================================================
   HEADER ACTIONS
========================================================= */

.header-actions{

  display:flex;

  align-items:center;

  gap:8px;

}


.header-action{

  width:43px;
  height:43px;

  display:flex;

  align-items:center;

  justify-content:center;

  position:relative;

  border:
    1px solid
    rgba(255,255,255,.1);

  border-radius:12px;

  background:#111;

  color:#fff;

  font-size:19px;

  transition:.2s;

}


.header-action:hover{

  border-color:
    var(--green);

  color:
    var(--green);

}


.badge{

  position:absolute;

  top:-5px;
  left:-5px;

  min-width:18px;
  height:18px;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:
    var(--red);

  color:#fff;

  font-size:10px;

  font-weight:bold;

}


/* =========================================================
   NAV
========================================================= */

.nav{

  border-top:
    1px solid
    rgba(255,255,255,.04);

}


.nav-inner{

  width:min(1200px,94%);

  margin:auto;

  display:flex;

  justify-content:center;

  flex-wrap:wrap;

  gap:6px;

  padding:8px 0;

}


.nav a{

  padding:
    9px 14px;

  border-radius:10px;

  color:#aaa;

  font-size:13px;

  transition:.2s;

}


.nav a:hover,
.nav a.active{

  color:#fff;

  background:
    rgba(25,214,107,.1);

}


.nav a.active{

  color:
    var(--green);

}


/* =========================================================
   MAIN
========================================================= */

#app{

  min-height:
    calc(100vh - 160px);

}


.page{

  width:100%;

  padding:
    25px 0 35px;

}


.container{

  width:min(1200px,94%);

  margin:auto;

}


.page-title{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:22px;

}


.page-title h1{

  font-size:27px;

}


.page-title p{

  color:#777;

  font-size:13px;

  margin-top:7px;

}


/* =========================================================
   HOME
========================================================= */

.home-page{

  min-height:
    calc(100vh - 180px);

}


.home-intro{

  width:100%;

  display:flex;

  justify-content:center;

}


.home-box{

  width:100%;

  max-width:950px;

  text-align:center;

  padding:
    38px 28px 25px;

  border:
    1px solid
    rgba(25,214,107,.18);

  border-radius:24px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.035),
      rgba(0,0,0,.25)
    );

  box-shadow:
    0 15px 45px
    rgba(0,0,0,.28);

}


.home-logo-small{

  width:82px;
  height:82px;

  object-fit:cover;

  border-radius:50%;

  margin-bottom:18px;

  border:
    2px solid
    var(--green);

  box-shadow:
    0 0 25px
    rgba(25,214,107,.22);

}


.home-box h1{

  font-size:30px;

  line-height:1.9;

  margin-bottom:15px;

}


.home-description{

  max-width:800px;

  margin:auto;

  color:#bdbdbd;

  line-height:2.1;

  font-size:15px;

}


/* =========================================================
   HOME STATS
========================================================= */

.home-stats{

  width:100%;

  max-width:950px;

  margin:25px auto 0;

  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:16px;

}


.home-stat{

  position:relative;

  min-height:175px;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  padding:25px 15px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.045),
      rgba(255,255,255,.015)
    );

  border:
    1px solid
    rgba(255,255,255,.09);

  border-radius:22px;

  overflow:hidden;

  transition:
    transform .25s ease,
    border-color .25s ease,
    box-shadow .25s ease;

}


.home-stat::before{

  content:"";

  position:absolute;

  top:0;

  left:15%;

  right:15%;

  height:2px;

  background:
    var(--stat-color);

  box-shadow:
    0 0 18px
    var(--stat-color);

}


.home-stat:hover{

  transform:
    translateY(-5px);

  border-color:
    var(--stat-color);

}


.stat-icon{

  width:52px;
  height:52px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:50%;

  font-size:23px;

  color:
    var(--stat-color);

  border:
    1px solid
    var(--stat-color);

  background:
    rgba(0,0,0,.35);

  margin-bottom:12px;

}


.stat-value{

  font-size:34px;

  font-weight:900;

  line-height:1.3;

  color:
    var(--stat-color);

  direction:rtl;

}


.stat-title{

  margin-top:7px;

  font-size:15px;

  font-weight:700;

  color:#aaa;

}


.stat-users{
  --stat-color:#19d66b;
}

.stat-orders{
  --stat-color:#ffffff;
}

.stat-satisfaction{
  --stat-color:#ff3030;
}


/* =========================================================
   CATEGORIES
========================================================= */

.categories{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:16px;

}


.category{

  position:relative;

  height:220px;

  overflow:hidden;

  border-radius:20px;

  border:
    1px solid
    rgba(255,255,255,.08);

}


.category-image{

  width:100%;
  height:100%;

  object-fit:cover;

  transition:
    transform .4s ease;

}


.category:hover
.category-image{

  transform:scale(1.07);

}


.category-overlay{

  position:absolute;

  inset:0;

  background:
    linear-gradient(
      to top,
      rgba(0,0,0,.9),
      rgba(0,0,0,.1)
    );

}


.category-content{

  position:absolute;

  right:18px;

  left:18px;

  bottom:18px;

}


.category-icon{

  font-size:28px;

}


.category-name{

  font-size:20px;

  font-weight:bold;

  margin-top:5px;

}


.category-sub{

  color:#bbb;

  font-size:12px;

  margin-top:6px;

}


/* =========================================================
   PRODUCTS
========================================================= */

.products{

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:16px;

}


.product-card{

  position:relative;

  overflow:hidden;

  background:#101010;

  border:
    1px solid
    rgba(255,255,255,.08);

  border-radius:18px;

  transition:.25s;

}


.product-card:hover{

  transform:
    translateY(-4px);

  border-color:
    rgba(25,214,107,.35);

}


.favorite{

  position:absolute;

  z-index:5;

  top:10px;

  left:10px;

  width:36px;
  height:36px;

  border:0;

  border-radius:50%;

  background:
    rgba(0,0,0,.7);

  color:#fff;

  font-size:21px;

}


.favorite.active{

  color:
    var(--red);

}


.product-image{

  height:230px;

  background:#181818;

  position:relative;

  display:flex;

  align-items:center;

  justify-content:center;

  overflow:hidden;

}


.product-image img{

  width:100%;
  height:100%;

  object-fit:cover;

}


.product-image > span{

  font-size:60px;

}


.image-arrow,
.detail-arrow{

  position:absolute;

  top:50%;

  transform:
    translateY(-50%);

  width:34px;
  height:34px;

  border:0;

  border-radius:50%;

  background:
    rgba(0,0,0,.7);

  color:#fff;

  z-index:4;

  font-size:25px;

}


.image-arrow.right,
.detail-arrow.right{

  right:8px;

}


.image-arrow.left,
.detail-arrow.left{

  left:8px;

}


.image-number{

  position:absolute;

  bottom:8px;

  left:50%;

  transform:
    translateX(-50%);

  padding:
    4px 8px;

  border-radius:8px;

  background:
    rgba(0,0,0,.7);

  color:#ddd;

  font-size:10px;

}


.product-info{

  padding:14px;

}


.product-title{

  font-weight:bold;

  font-size:15px;

  line-height:1.8;

}


.product-desc{

  color:#777;

  font-size:11px;

  line-height:1.8;

  min-height:38px;

}


.product-price{

  color:
    var(--green);

  font-size:18px;

  font-weight:bold;

  margin-top:10px;

}


.product-price small{

  font-size:11px;

  color:#aaa;

}


.discount-label{

  color:
    var(--red);

  font-size:11px;

}


.stock{

  margin-top:8px;

  font-size:11px;

}


.stock.green{
  color:#19d66b;
}

.stock.yellow{
  color:#ffc107;
}

.stock.red{
  color:#ff3030;
}


.product-actions{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:7px;

  padding:
    0 12px 12px;

}


.product-actions button{

  border:
    1px solid
    rgba(255,255,255,.1);

  border-radius:10px;

  background:#151515;

  color:#fff;

  padding:9px 5px;

  font-size:11px;

}


.product-actions button:hover{

  border-color:
    var(--green);

}


.product-actions .buy{

  background:
    var(--green);

  color:#000;

  font-weight:bold;

}


.product-actions button:disabled{

  opacity:.4;

  cursor:not-allowed;

}


/* =========================================================
   SORT
========================================================= */

.sort-area{

  display:flex;

  justify-content:flex-start;

  margin-bottom:18px;

}


.sort-box{

  position:relative;

}


.sort-toggle{

  min-width:180px;

  padding:
    10px 13px;

  display:flex;

  justify-content:space-between;

  gap:20px;

  border:
    1px solid
    rgba(255,255,255,.1);

  border-radius:11px;

  background:#111;

  color:#fff;

}


.sort-menu{

  position:absolute;

  z-index:50;

  top:calc(100% + 5px);

  right:0;

  min-width:180px;

  padding:6px;

  background:#151515;

  border:
    1px solid
    rgba(255,255,255,.1);

  border-radius:12px;

  display:none;

}


.sort-menu.open{

  display:block;

}


.sort-option{

  width:100%;

  padding:9px;

  text-align:right;

  border:0;

  border-radius:8px;

  background:transparent;

  color:#aaa;

}


.sort-option:hover,
.sort-option.active{

  background:
    rgba(25,214,107,.1);

  color:
    var(--green);

}


/* =========================================================
   SUBCATEGORIES
========================================================= */

.subcategories{

  display:flex;

  flex-wrap:wrap;

  gap:8px;

  margin-bottom:18px;

}


.subcategory-btn{

  padding:
    9px 14px;

  border:
    1px solid
    rgba(255,255,255,.09);

  border-radius:10px;

  background:#111;

  color:#aaa;

}


.subcategory-btn.active,
.subcategory-btn:hover{

  color:#000;

  background:
    var(--green);

  border-color:
    var(--green);

}


/* =========================================================
   PRODUCT DETAIL
========================================================= */

.product-detail{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:30px;

}


.detail-gallery{

  position:relative;

  background:#101010;

  border:
    1px solid
    rgba(255,255,255,.08);

  border-radius:20px;

  overflow:hidden;

}


.detail-gallery-main{

  height:500px;

  display:flex;

  align-items:center;

  justify-content:center;

  background:#151515;

}


.detail-gallery-main img{

  width:100%;
  height:100%;

  object-fit:contain;

}


.detail-gallery-main span{

  font-size:100px;

}


.detail-dots{

  position:absolute;

  bottom:15px;

  left:50%;

  transform:
    translateX(-50%);

  display:flex;

  gap:6px;

}


.detail-dot{

  width:8px;
  height:8px;

  border-radius:50%;

  background:#666;

}


.detail-dot.active{

  background:
    var(--green);

}


.detail-info h1{

  font-size:28px;

  margin-bottom:15px;

}


.detail-desc{

  color:#aaa;

  line-height:2;

  white-space:pre-line;

}


.detail-price{

  color:
    var(--green);

  font-size:28px;

  font-weight:bold;

  margin:
    20px 0;

}


.detail-price small{

  font-size:13px;

  color:#aaa;

}


.detail-discount{

  color:
    var(--red);

  line-height:2;

  margin-bottom:15px;

}


.product-specs{

  margin:
    20px 0;

  padding:16px;

  border:
    1px solid
    rgba(255,255,255,.08);

  border-radius:14px;

  background:#111;

}


.product-specs-title{

  font-weight:bold;

  color:
    var(--green);

  margin-bottom:8px;

}


.product-specs-text{

  color:#aaa;

  white-space:pre-line;

  line-height:2;

}


.quantity{

  display:flex;

  align-items:center;

  justify-content:center;

  gap:20px;

  margin:20px 0;

}


.quantity button{

  width:40px;
  height:40px;

  border:0;

  border-radius:10px;

  background:#191919;

  color:#fff;

  font-size:23px;

}


.primary-btn,
.secondary-btn{

  min-height:45px;

  padding:
    0 18px;

  border-radius:11px;

  border:0;

  font-weight:bold;

}


.primary-btn{

  background:
    var(--green);

  color:#000;

}


.secondary-btn{

  background:#171717;

  color:#fff;

  border:
    1px solid
    rgba(255,255,255,.1);

}


/* =========================================================
   CART
========================================================= */

.cart-page{

  max-width:900px;

}


.cart-item{

  display:flex;

  align-items:center;

  gap:14px;

  padding:12px;

  margin-bottom:10px;

  background:#111;

  border:
    1px solid
    rgba(255,255,255,.08);

  border-radius:15px;

}


.cart-icon{

  width:70px;
  height:70px;

  flex-shrink:0;

  border-radius:12px;

  overflow:hidden;

  background:#181818;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:35px;

}


.cart-icon img{

  width:100%;
  height:100%;

  object-fit:cover;

}


.cart-item-info{

  flex:1;

}


.cart-item-info h3{

  font-size:14px;

}


.cart-item-info p{

  color:
    var(--green);

  margin-top:6px;

  font-size:13px;

}


.qty{

  display:flex;

  align-items:center;

  gap:10px;

}


.qty button{

  width:32px;
  height:32px;

  border:0;

  border-radius:8px;

  background:#1c1c1c;

  color:#fff;

}


.remove{

  width:35px;
  height:35px;

  border:0;

  border-radius:8px;

  background:
    rgba(255,48,48,.1);

  color:
    var(--red);

  font-size:22px;

}


.cart-summary{

  margin-top:20px;

  padding:18px;

  border:
    1px solid
    rgba(255,255,255,.08);

  border-radius:15px;

  background:#111;

}


.summary-row{

  display:flex;

  justify-content:space-between;

  padding:8px 0;

  color:#aaa;

}


.summary-row.total{

  border-top:
    1px solid
    rgba(255,255,255,.08);

  margin-top:7px;

  padding-top:14px;

  color:#fff;

}


/* =========================================================
   LAWS / SUPPORT
========================================================= */

.laws-box,
.contact-card{

  background:#111;

  border:
    1px solid
    rgba(255,255,255,.08);

  border-radius:16px;

}


.laws-box{

  padding:20px;

}


.laws-content{

  color:#bbb;

  line-height:2.3;

  white-space:pre-line;

}


.support-page{

  max-width:850px;

}


.support-header{

  text-align:center;

  padding:20px;

  margin-bottom:20px;

}


.support-avatar{

  width:75px;
  height:75px;

  margin:auto;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:50%;

  background:
    rgba(25,214,107,.1);

  border:
    1px solid
    var(--green);

  font-size:35px;

}


.support-header h1{

  margin-top:14px;

  font-size:24px;

}


.support-header p{

  margin-top:8px;

  color:#888;

  line-height:2;

}


.contact-card{

  display:flex;

  align-items:center;

  gap:14px;

  padding:15px;

  margin-bottom:10px;

}


.contact-icon{

  width:48px;
  height:48px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:12px;

  background:#191919;

  font-size:23px;

}


.contact-info{

  flex:1;

}


.contact-info small{

  display:block;

  color:#777;

  margin-bottom:5px;

}


.contact-info strong{

  color:#fff;

  line-height:1.8;

}


.contact-actions{

  display:flex;

  gap:6px;

}


.contact-actions button{

  padding:
    9px 12px;

  border:
    1px solid
    rgba(255,255,255,.1);

  border-radius:9px;

  background:#181818;

  color:#fff;

}


.contact-actions .contact-main{

  background:
    var(--green);

  color:#000;

}


/* =========================================================
   EMPTY
========================================================= */

.no-result{

  min-height:250px;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  text-align:center;

  color:#777;

  gap:12px;

}


.no-result > div{

  font-size:55px;

}


/* =========================================================
   FOOTER
========================================================= */

.footer{

  width:100%;

  padding:
    20px;

  text-align:center;

  color:#666;

  font-size:12px;

  border-top:
    1px solid
    rgba(255,255,255,.06);

}

/* =========================================================

function safeJSON(value,fallback){

  try{

    if(!value)
      return fallback;

    return JSON.parse(value);

  }catch{

    return fallback;

  }

}


function escapeHTML(text){

  return String(text ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function formatNumber(value){

  const num =
    Number(value || 0);

  if(!Number.isFinite(num))
    return "0";

  return num.toLocaleString("fa-IR");

}


function normalizeText(value){

  return String(value ?? "")
    .trim()
    .toLowerCase()
    .replace(/\s+/g," ");

}


/* =========================================================
   IMAGE RESOLVER
========================================================= */

function resolveImage(path){

  if(!path)
    return "";

  let value =
    String(path)
      .trim()
      .replace(/\\/g,"/");

  if(!value)
    return "";


  if(/^https?:\/\//i.test(value))
    return value;


  if(/^data:/i.test(value))
    return value;


  if(/^blob:/i.test(value))
    return value;


  /*
    GitHub Blob
  */

  if(
    /^https?:\/\/github\.com\/amydymahan0916-bot\/MahanS\/blob\/main\//i
      .test(value)
  ){

    return value.replace(
      /^https?:\/\/github\.com\/amydymahan0916-bot\/MahanS\/blob\/main\//i,

      "https://raw.githubusercontent.com/amydymahan0916-bot/MahanS/main/"
    );

  }


  /*
    GitHub عمومی
  */

  if(
    value.includes("github.com/") &&
    value.includes("/blob/")
  ){

    const match =
      value.match(
        /github\.com\/[^/]+\/[^/]+\/blob\/[^/]+\/(.+)/i
      );

    if(match && match[1]){

      const pieces =
        value.split("github.com/")[1];

      return (
        "https://raw.githubusercontent.com/" +
        pieces.replace(
          "/blob/",
          "/"
        )
      );

    }

  }


  value =
    value
      .replace(/^\.\/+/,"")
      .replace(/^\/+/,"");


  if(
    value.startsWith("MahanS/")
  ){

    value =
      value.substring(
        "MahanS/".length
      );

  }


  try{

    return new URL(
      value,
      SITE_BASE
    ).href;

  }catch{

    return value;

  }

}

  imageCandidates[token] = [

    ...new Set(

      (images || [])

        .map(resolveImage)

        .filter(Boolean)

    )

  ];

  return token;

}


window.tryNextImage =
function(img,token){

  if(!img)
    return;

  const list =
    imageCandidates[token] || [];

  let index =
    Number(
      img.dataset.imageIndex || 0
    );

  index++;

  if(index < list.length){

    img.dataset.imageIndex =
      index;

    img.src =
      list[index];

    return;

  }

  img.onerror = null;

  img.src =
    FALLBACK_IMAGE;

};

function getCreatedTime(value){

  if(!value)
    return 0;

  if(typeof value==="number")
    return value;

  if(
    typeof value==="object" &&
    value.seconds!==undefined
  ){

    return Number(value.seconds)*1000;

  }

  if(
    typeof value.toMillis==="function"
  ){

    return value.toMillis();

  }

  const time =
    new Date(value).getTime();

  return Number.isFinite(time)
    ? time
    : 0;

}

function mergeCategories(raw){

  const source =
    Array.isArray(raw)
      ? raw
      : [];


  const map = {};


  DEFAULT_CATEGORIES.forEach(c=>{

    map[String(c.id)] = {

      ...c,

      subcategories:
        Array.isArray(
          c.subcategories
        )
          ? [...c.subcategories]
          : []

    };

  });


  source.forEach((c,index)=>{

    if(!c)
      return;


    const id =
      String(
        c.id ||
        "category_"+index
      );


    if(map[id]){

      map[id] = {

        ...map[id],

        ...c,

        subcategories:
          Array.isArray(
            c.subcategories
          )
            ? [...c.subcategories]
            : map[id].subcategories

      };

    }else{

      map[id] = {

        ...c,

        id,

        name:
          c.name ||
          "دسته‌بندی",

        icon:
          c.icon ||
          "📦",

        image:
          c.image ||
          "",

        subcategories:
          Array.isArray(
            c.subcategories
          )
            ? [...c.subcategories]
            : []

      };

    }

  });


  return map;

}

function inferCategoryImage(category){

    return defaultCategoryImages.mobile;


  if(
    /gold|طلا|جواهر|گردنبند|النگو|انگشتر|پابند|ست/
      .test(text)
  )
    return defaultCategoryImages.gold;


  if(
    /clothes|پوشاک|لباس|پیراهن|مانتو|هودی|شلوار|تی.?شرت/
      .test(text)
  )
    return defaultCategoryImages.clothes;


  if(
    /shoes|کفش|کتانی|اسپرت/
      .test(text)
  )
    return defaultCategoryImages.shoes;


  if(
    /accessories|لوازم.?جانبی|هدفون|هندزفری|قاب|شارژر|کابل|اکسسوری/
      .test(text)
  )
    return defaultCategoryImages.accessories;


  if(
    /watch|watches|ساعت/
      .test(text)
  )
    return defaultCategoryImages.watches;


  if(
    /car|ماشین|خودرو|اتومبیل|موتور/
      .test(text)
  )
    return defaultCategoryImages.car;


  if(
    /animal|animals|حیوان|حیوانات|سگ|گربه/
      .test(text)
  )
    return defaultCategoryImages.animal;


  return defaultCategoryImages.default;

}


/* =========================================================
   PRODUCT NORMALIZER
========================================================= */

function normalizeProduct(docSnap){

  const data =
    docSnap.data() || {};


  let images = [];


  if(
    Array.isArray(data.images)
  ){

    images =
      data.images

        .filter(Boolean)

        .map(
          x=>String(x).trim()
        )

        .filter(Boolean);

  }


  [
    data.image1,
    data.image2,
    data.image3
  ].forEach(img=>{

    if(
      img &&
      !images.includes(img)
    ){

      images.push(img);

    }

  });


  images =
    images

      .map(resolveImage)

      .filter(Boolean)

      .slice(0,3);


  const rawCode =
    data.code ??
    docSnap.id;


  const category =
    data.category ??
    "";


  const name =
    data.name ??
    "محصول بدون نام";


  const description =
    data.description ??
    "";


  const numericCode =
    Number(rawCode);


  const publicId =
    Number.isFinite(numericCode) &&
    String(rawCode).trim()!==""

      ?

      numericCode

      :

      docSnap.id;


  return {

    id:
      publicId,

    docId:
      docSnap.id,

    code:
      String(rawCode),

    name:
      String(name),

    category:
      String(category),

    cat:
      String(category),

    subcategory:
      data.subcategory ||
      data.subCat ||
      data.sub_category ||
      data.childCategory ||
      data.childCat ||
      data.goldCat ||
      "",

    brand:
      data.brand ||
      "",

    goldCat:
      data.goldCat ||
      "",

    search:
      data.search ||
      `${name} ${data.brand || ""} ${category} ${data.subcategory || ""}`,

    price:
      Number(data.price || 0),

    stock:
      Number(data.stock ?? 0),

    status:
      data.status ||
      (
        Number(data.stock || 0)>0
          ? "available"
          : "unavailable"
      ),

    image:
      images[0] || "",

    image2:
      images[1] || "",

    image3:
      images[2] || "",

    images,

    icon:
      data.icon ||
      "🛍️",

    desc:
      String(description),

    description:
      String(description),

    specs:
      data.specs ||
      "",

    discount:
      Number(data.discount || 0),

    createdAt:
      getCreatedTime(
        data.createdAt
      ),

    updatedAt:
      getCreatedTime(
        data.updatedAt
      )

  };

}


/* =========================================================
   CACHE SAVE
========================================================= */

function saveSettingsCache(){

  try{

    localStorage.setItem(
      SETTINGS_CACHE_KEY,
      JSON.stringify(settings)
    );

  }catch(error){

    console.warn(
      "Settings cache error:",
      error
    );

  }

}


function saveProductsCache(){

  try{

    localStorage.setItem(
      PRODUCTS_CACHE_KEY,
      JSON.stringify(products)
    );

  }catch(error){

    console.warn(
      "Products cache error:",
      error
    );

  }

}


/* =========================================================
   CACHE RESTORE
========================================================= */

function restoreCachedData(){

  try{

    const cachedSettings =
      safeJSON(
        localStorage.getItem(
          SETTINGS_CACHE_KEY
        ),
        null
      );


    if(
      cachedSettings &&
      typeof cachedSettings==="object"
    ){

      settings = {

        ...DEFAULT_SETTINGS,

        ...cachedSettings,

        categories:
          Array.isArray(
            cachedSettings.categories
          )

            ?

            cachedSettings.categories

            :

            DEFAULT_CATEGORIES

      };

    }

  }catch(error){

    console.warn(
      "Restore settings error:",
      error
    );

  }


  try{

    const cachedProducts =
      safeJSON(
        localStorage.getItem(
          PRODUCTS_CACHE_KEY
        ),
        null
      );


    if(
      Array.isArray(
        cachedProducts
      )
    ){

      products =
        cachedProducts;

    }

  }catch(error){

    console.warn(
      "Restore products error:",
      error
    );

  }


  categories =
    getCategories();

  applySiteSettings();

}


/* =========================================================
   LOAD SETTINGS
========================================================= */

async function loadSettings(){

  try{

    const snap =
      await getDoc(
        doc(
          db,
          "settings",
          "site"
        )
      );


    if(snap.exists()){

      const data =
        snap.data() || {};


      settings = {

        ...DEFAULT_SETTINGS,

        ...data,

        categories:
          Array.isArray(
            data.categories
          ) &&
          data.categories.length

            ?

            data.categories

            :

            DEFAULT_CATEGORIES

      };

    }else{

      settings = {

        ...DEFAULT_SETTINGS,

        categories:
          DEFAULT_CATEGORIES

      };

    }


    categories =
      getCategories();


    applySiteSettings();


    saveSettingsCache();


    firebaseOnline =
      true;


    return true;

  }catch(error){

    console.error(
      "Settings Firebase error:",
      error
    );


    firebaseOnline =
      false;


    categories =
      getCategories();


    applySiteSettings();


    return false;

  }

}


/* =========================================================
   LOAD PRODUCTS
========================================================= */

async function loadProducts(){

  try{

    const snap =
      await getDocs(
        collection(
          db,
          "products"
        )
      );


    const list =
      snap.docs.map(
        normalizeProduct
      );


    list.sort((a,b)=>{

      const ad =
        getCreatedTime(
          a.createdAt
        );

      const bd =
        getCreatedTime(
          b.createdAt
        );


      if(ad!==bd)
        return bd-ad;


      const an =
        Number(a.code);

      const bn =
        Number(b.code);


      if(
        Number.isFinite(an) &&
        Number.isFinite(bn)
      ){

        return bn-an;

      }


      return String(a.name)
        .localeCompare(
          String(b.name),
          "fa"
        );

    });


    products =
      list;


    saveProductsCache();


    firebaseOnline =
      true;


    console.log(
      "MAHAN CENTER PRODUCTS:",
      products.length
    );


    return true;

  }catch(error){

    console.error(
      "Products Firebase error:",
      error
    );


    showSmallFirebaseError(

      products.length

        ?

        "اتصال فروشگاه قطع است؛ اطلاعات ذخیره‌شده نمایش داده می‌شود."

        :

        "دریافت محصولات از Firebase انجام نشد."

    );


    return false;

  }

}


/* =========================================================
   FIREBASE STATUS
========================================================= */

function showSmallFirebaseError(message){

  let old =
    document.getElementById(
      "firebaseStatus"
    );


  if(!old){

    old =
      document.createElement(
        "div"
      );

    old.id =
      "firebaseStatus";

    old.className =
      "firebase-status";

    document.body.appendChild(
      old
    );

  }


  old.textContent =
    message;


  old.classList.add(
    "error"
  );


  clearTimeout(
    window.firebaseStatusTimer
  );


  window.firebaseStatusTimer =
    setTimeout(()=>{

      if(old)
        old.remove();

    },7000);

}

/* =========================================================
   ROUTER
========================================================= */

function go(path){

  const target =
    String(path || "/");


  const hash =
    "#"+target;


  if(
    location.hash === hash
  ){

    render(target);

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

    return;

  }


  location.hash =
    target;

}


function getRoute(){

  const hash =
    location.hash.substring(1);

  return hash || "/";

}


window.addEventListener(
  "hashchange",
  ()=>{

    render(
      getRoute()
    );

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }
);


/* =========================================================
   RENDER
========================================================= */

function render(route){

  settings =
    settings ||
    DEFAULT_SETTINGS;


  categories =
    getCategories();


  const app =
    document.getElementById(
      "app"
    );


  if(!app)
    return;


  if(route==="/"){

    renderHome();

  }

  else if(
    route==="/categories"
  ){

    renderCategories();

  }

  else if(
    route==="/discount"
  ){

    renderDiscount();

  }

  else if(
    route==="/favorites"
  ){

    renderFavorites();

  }

  else if(
    route==="/cart"
  ){

    renderCart();

  }

  else if(
    route==="/laws"
  ){

    renderLaws();

  }

  else if(
    route==="/support"
  ){

    renderSupport();

  }

  else if(
    route.startsWith(
      "/category/"
    )
  ){

    const parts =
      route
        .split("/")
        .filter(Boolean);


    const cat =
      decodeURIComponent(
        parts[1] || ""
      );


    const sub =
      parts[2]
        ?

        decodeURIComponent(
          parts[2]
        )

        :

        "all";


    renderCategory(
      cat,
      sub
    );

  }

  else if(
    route.startsWith(
      "/product/"
    )
  ){

    renderProduct(

      decodeURIComponent(
        route.split("/")[2] || ""
      )

    );

  }

  else if(
    route.startsWith(
      "/search/"
    )
  ){

    renderSearch(

      decodeURIComponent(
        route.split("/")[2] || ""
      )

    );

  }

  else{

    renderHome();

  }


  updateActiveNav();

}

/* =========================================================
   CATEGORY CARD
========================================================= */

function categoryCard(key){

  const c =
    categories[key];


  if(!c)
    return "";


  const image =
    resolveImage(
      c.image || ""
    ) ||
    inferCategoryImage(c);


  const subs =
    Array.isArray(
      c.subcategories
    )

      ?

      c.subcategories.slice(0,3)

      :

      [];


  const route =
    "/category/" +
    encodeURIComponent(key);


  return `

    <a
      class="category"
      href="#${route}"
      onclick="
        go(${JSON.stringify(route)});
        return false
      "
    >

      <img
        class="category-image"
        src="${escapeHTML(image)}"
        alt="${escapeHTML(c.name)}"
        onerror="
          this.onerror=null;
          this.src='${escapeHTML(
            inferCategoryImage(c)
          )}'
        "
      >


      <div
        class="category-overlay"
      ></div>


      <div
        class="category-content"
      >

        <div class="category-icon">
          ${escapeHTML(
            c.icon || "📦"
          )}
        </div>

        <div class="category-name">
          ${escapeHTML(c.name)}
        </div>

        <div class="category-sub">

          ${
            subs.length

              ?

              escapeHTML(
                subs.join(" • ")
              )

              :

              "مشاهده محصولات"

          }

        </div>

      </div>

    </a>

  `;

}

/* =========================================================
   PRICE
========================================================= */

function getFinalPrice(p){

  const price =
    Number(p.price || 0);


  const discount =
    Number(p.discount || 0);


  return discount > 0

    ?

    Math.round(
      price -
      (
        price *
        discount /
        100
      )
    )

    :

    price;

}


/* =========================================================
   SORT
========================================================= */

function sortProducts(list){

  const arr =
    [...list];


  if(
    currentSort==="newest"
  ){

    arr.sort(
      (a,b)=>
        getCreatedTime(
          b.createdAt
        ) -
        getCreatedTime(
          a.createdAt
        )
    );

  }


  else if(
    currentSort==="oldest"
  ){

    arr.sort(
      (a,b)=>
        getCreatedTime(
          a.createdAt
        ) -
        getCreatedTime(
          b.createdAt
        )
    );

  }


  else if(
    currentSort==="cheap"
  ){

    arr.sort(
      (a,b)=>
        getFinalPrice(a) -
        getFinalPrice(b)
    );

  }


  else if(
    currentSort==="expensive"
  ){

    arr.sort(
      (a,b)=>
        getFinalPrice(b) -
        getFinalPrice(a)
    );

  }


  else if(
    currentSort==="discount"
  ){

    arr.sort(
      (a,b)=>
        Number(b.discount || 0) -
        Number(a.discount || 0)
    );

  }


  return arr;

}

function sortFilters(){

  const items = [

    ["newest","جدیدترین"],

    ["oldest","قدیمی‌ترین"],

    ["cheap","ارزان‌ترین"],

    ["expensive","گران‌ترین"],

function toggleSortMenu(event){

  if(event)
    event.stopPropagation();


  const menu =
    document.getElementById(
      "sortMenu"
    );


  if(menu){

    menu.classList.toggle(
      "open"
    );

  }

}


function changeSort(sort){

  currentSort =
    String(
      sort ||
      "newest"
    );


  render(
    getRoute()
  );

}


/* =========================================================
   CATEGORY HELPERS
========================================================= */

function getProductSubcategory(p){

  return String(

    p.subcategory ||

    p.subCat ||

    p.sub_category ||

    p.childCategory ||

    p.childCat ||

    p.goldCat ||

    ""

  ).trim();

}


function productBelongsToCategory(
  product,
  categoryId
){

  const cat =
    categories[
      String(categoryId)
    ];


  const values = [

    product.category,

    product.cat,

    product.categoryId,

    product.categoryName

  ]

    .map(normalizeText)

    .filter(Boolean);


  const wantedId =
    normalizeText(
      categoryId
    );


  const wantedName =
    normalizeText(
      cat?.name
    );


  return (

    values.includes(
      wantedId
    )

    ||

    (

      wantedName &&

      values.includes(
        wantedName
      )

    )

  );

}


function getCategorySubcategories(
  cat,
  categoryProducts
){

  const configured =
    Array.isArray(
      cat?.subcategories
    )

      ?

      cat.subcategories
        .filter(Boolean)

      :

      [];


  const derived =
    categoryProducts

      .map(
        getProductSubcategory
      )

      .filter(Boolean);


  return [

    ...new Set([

      ...configured,

      ...derived

    ])

  ];

}


function renderSubcategories(
  cat,
  categoryProducts
){

  const list =
    getCategorySubcategories(
      cat,
      categoryProducts
    );


  if(!list.length)
    return "";


  return `

    <div class="subcategories">

      <button
        class="subcategory-btn ${
          currentSubcategory==="all"
            ? "active"
            : ""
        }"
        onclick="
          changeSubcategory('all')
        "
      >
        همه
      </button>


      ${list.map(
        sub=>`

          <button
            class="subcategory-btn ${
              currentSubcategory===sub
                ? "active"
                : ""
            }"
            onclick="
              changeSubcategory(
                ${JSON.stringify(sub)}
              )
            "
          >

            ${escapeHTML(sub)}

          </button>

        `
      ).join("")}

    </div>

  `;

}


function changeSubcategory(sub){

  currentSubcategory =
    String(
      sub ||
      "all"
    );


  const route =
    getRoute();


  const parts =
    route
      .split("/")
      .filter(Boolean);


  const cat =
    decodeURIComponent(
      parts[1] || ""
    );


  if(
    currentSubcategory==="all"
  ){

    go(
      "/category/" +
      encodeURIComponent(cat)
    );

  }else{

    go(

      "/category/" +

      encodeURIComponent(cat) +

      "/" +

      encodeURIComponent(
        currentSubcategory
      )

    );

  }

}


/* =========================================================
   CATEGORY PAGE
========================================================= */

function renderCategory(cat,sub){

  const category =
    categories[
      String(cat)
    ];


  let categoryProducts =
    products.filter(
      p=>
        productBelongsToCategory(
          p,
          cat
        )
    );


  const allProducts =
    [...categoryProducts];


  if(
    sub &&
    sub!=="all"
  ){

    categoryProducts =
      categoryProducts.filter(
        p=>
          getProductSubcategory(p) ===
          String(sub)
      );

  }


  currentSubcategory =
    sub || "all";


  categoryProducts =
    sortProducts(
      categoryProducts
    );


  const categoryName =
    category
      ? category.name
      : "محصولات";


  document.getElementById(
    "app"
  ).innerHTML = `

    <main class="page">

      <div class="container">

        <div class="page-title">

          <div>

            <h1>
              ${escapeHTML(
                categoryName
              )}
            </h1>

            <p>

              ${
                sub && sub!=="all"

                  ?

                  "زیر دسته: " +
                  escapeHTML(sub)

                  :

                  allProducts.length +
                  " محصول"

              }

            </p>

          </div>

        </div>


        ${renderSubcategories(
          category,
          allProducts
        )}


        ${sortFilters()}


        ${
          categoryProducts.length

            ?

            `

              <div class="products">

                ${categoryProducts
                  .map(productCard)
                  .join("")}

              </div>

            `

            :

            emptyResult(

/* =========================================================
   PRODUCT IMAGES
========================================================= */

function getProductImages(p){

  const images = [

    p.image,

    p.image2,

    p.image3,

    ...(

      Array.isArray(p.images)

        ?

        p.images

        :

        []

    )

  ]

    .filter(Boolean)

    .map(resolveImage)

    .filter(Boolean);


  return [

    ...new Set(images)

  ].slice(0,3);

}

========================================================= */

function productImageHTML(p){

  const images =

  const id =

function changeCardImage(
  id,
  amount
){

  const p =
    products.find(
      x=>
        String(x.id)===
        String(id)
    );


  if(!p)
    return;


  const images =
    getProductImages(p);


  if(images.length<=1)
    return;


  if(
    cardImageIndexes[id]===undefined
  ){

    cardImageIndexes[id]=0;

  }


  cardImageIndexes[id] +=
    Number(amount || 0);


  if(
    cardImageIndexes[id]<0
  ){

    cardImageIndexes[id] =
      images.length-1;

  }


  if(
    cardImageIndexes[id]>=
    images.length
  ){

    cardImageIndexes[id]=0;

  }


  const img =
    document.getElementById(
      "cardImg-"+id
    );


  const number =
    document.getElementById(
      "cardImageNumber-"+id
    );


  if(img){

    img.src =
      images[
        cardImageIndexes[id]
      ];


    img.dataset.imageIndex =
      cardImageIndexes[id];

  }


  if(number){

    number.textContent =
      (
        cardImageIndexes[id]+1
      ) +
      " / " +
      images.length;

  }

}

/* =========================================================
   CART
========================================================= */

function addToCart(id,qty){

  qty =
    Number(
      qty || 1
    );


  if(
    !Number.isFinite(qty) ||
    qty<1
  ){

    qty=1;

  }


  const p =
    products.find(
      x=>

        String(x.id)===
        String(id)

        ||

        String(x.docId)===
        String(id)

        ||

        String(x.code)===
        String(id)

    );


  if(!p){

    showToast(
      "محصول پیدا نشد"
    );

    return;

  }


  const stock =
    Number(
      p.stock || 0
    );


  if(stock<=0){

    showToast(
      "این محصول موجود نیست"
    );

    return;

  }


  const item =
    cart.find(
      x=>
        String(x.id)===
        String(id)
    );


  const currentQty =
    item
      ? Number(item.qty || 0)
      : 0;


  if(
    currentQty+qty>stock
  ){

    showToast(
      "تعداد انتخابی بیشتر از موجودی است"
    );

    return;

  }


  if(item){

    item.qty +=
      qty;

  }else{

    cart.push({

      id:
        p.id,

      qty:
        qty

    });

  }


  saveData();


  showToast(
    "محصول به سبد خرید اضافه شد ✓"
  );

}


function cartQty(id,amount){

  const item =
    cart.find(
      x=>
        String(x.id)===
        String(id)
    );


  if(!item)
    return;


  const p =
    products.find(
      x=>

        String(x.id)===
        String(id)

        ||

        String(x.docId)===
        String(id)

        ||

        String(x.code)===
        String(id)

    );


  item.qty +=
    Number(
      amount || 0
    );


  if(p){

    item.qty =
      Math.min(
        item.qty,
        Number(
          p.stock || 0
        )
      );

  }


  if(item.qty<1){

    cart =
      cart.filter(
        x=>
          String(x.id)!==
          String(id)
      );

  }


  saveData();

  renderCart();

}


function removeFromCart(id){

  cart =
    cart.filter(
      x=>
        String(x.id)!==
        String(id)
    );


  saveData();

  renderCart();


  showToast(
    "محصول از سبد حذف شد"
  );

}

        String(x)===
        String(id)
    );


  if(found!==undefined){

    favorites =
      favorites.filter(
        x=>
          String(x)!==
          String(id)
      );


    showToast(
      "از علاقه‌مندی‌ها حذف شد"
    );

  }else{

    favorites.push(
      id
    );


    showToast(
      "به علاقه‌مندی‌ها اضافه شد"
    );

  }


  saveData();

  render(
    getRoute()
  );

}

function normalizeRubika(value){

  let id =

  return id.replace(

}


async function copyText(text){

  const value =
    String(
      text ?? ""
    );


  try{

    if(
      navigator.clipboard &&
      navigator.clipboard.writeText
    ){

      await navigator.clipboard.writeText(
        value
      );

      showToast(
        "کپی شد ✓"
      );

      return;

    }

  }catch(error){

    console.warn(
      "Clipboard error:",
      error
    );

  }


  fallbackCopy(value);

}


function fallbackCopy(text){

  const area =
    document.createElement(
      "textarea"
    );


  area.value =
    text;


  area.style.position =
    "fixed";

  area.style.opacity =
    "0";


  document.body.appendChild(
    area
  );


  area.focus();

  area.select();


  try{

    document.execCommand(
      "copy"
    );

    showToast(
      "کپی شد ✓"
    );

  }catch{

    showToast(
      "کپی خودکار انجام نشد"
    );

  }


  area.remove();

}

/* =========================================================
   TOAST
========================================================= */

function showToast(message){

  const toast =
    document.getElementById(
      "toast"
    );


  if(!toast)
    return;


  toast.textContent =
    String(
      message || ""
    );


  toast.classList.add(
    "show"
  );


  clearTimeout(
    window.mahanToastTimer
  );


  window.mahanToastTimer =
    setTimeout(
      ()=>{

        toast.classList.remove(
          "show"
        );

      },
      2500
    );

}

    );


  const settingsOK =
    await loadSettings();


  const newSettings =
    JSON.stringify(
      settings
    );


  const settingsChanged =
    oldSettings !==
    newSettings;


  /*
    Products
  */

  const oldProducts =
    JSON.stringify(
      products
    );


  const productsOK =
    await loadProducts();


  const newProducts =
    JSON.stringify(
      products
    );


  const productsChanged =
    oldProducts !==
    newProducts;


  categories =
    getCategories();


  applySiteSettings();


  /*
    HOME
  */

  if(
    getRoute()==="/"
  ){

    updateHomeOnly();

  }


  /*
    سایر صفحات
  */
