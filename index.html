<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#070707">

<title>ماهان سنتر ایران</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:
    radial-gradient(
        circle at top right,
        rgba(25,214,107,.035),
        transparent 30%
    ),
    #070707;

    color:#fff;
    line-height:1.7;
    min-height:100vh;
}

/* جلوگیری از نمایش محتوای پیش‌فرض قبل از آماده شدن مسیر واقعی */
#app{visibility:hidden}
#app.ready{visibility:visible}


button,
input,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

button:disabled{
    cursor:not-allowed;
    opacity:.55;
}

a{
    color:inherit;
    text-decoration:none;
}

.container{
    width:92%;
    max-width:1250px;
    margin:auto;
}

/* =========================================================
   COLORS
========================================================= */

:root{
    --green:#19d66b;
    --green2:#0fb957;
    --yellow:#ffc400;
    --red:#e50914;
    --red2:#ff1d2d;
    --bg:#070707;
    --card:#111;
    --card2:#181818;
    --border:#292929;
    --text:#fff;
    --muted:#999;
}

/* =========================================================
   BRAND
========================================================= */

.brand-mahan{
    color:var(--green)!important;
}

.brand-center{
    color:#fff!important;
}

.brand-iran{
    color:var(--red)!important;
}

/* =========================================================
   HEADER
========================================================= */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(7,7,7,.94);
    backdrop-filter:blur(18px);
    border-bottom:1px solid var(--border);
}

.header-main{
    min-height:100px;
    display:flex;
    align-items:center;
    gap:22px;
}

.logo{
    display:flex;
    align-items:center;
    gap:14px;
    min-width:max-content;
}

.logo img{
    width:72px;
    height:72px;
    object-fit:cover;
    border-radius:50%;
    border:3px solid var(--green);
    box-shadow:
    0 0 0 3px rgba(25,214,107,.08),
    0 0 20px rgba(25,214,107,.18);
}

.logo-name{
    font-size:24px;
    font-weight:bold;
}

.search-box{
    flex:1;
    max-width:600px;
    height:50px;
    display:flex;
    background:#161616;
    border:1px solid #333;
    border-radius:15px;
    overflow:hidden;
}

.search-box input{
    flex:1;
    min-width:0;
    border:0;
    outline:0;
    background:none;
    color:#fff;
    padding:0 17px;
    font-size:14px;
}

.search-box button{
    width:60px;
    border:0;
    background:var(--green);
    color:#06120a;
    font-size:23px;
    font-weight:bold;
}

.header-actions{
    display:flex;
    gap:9px;
}

.header-btn{
    height:48px;
    min-width:50px;
    padding:0 13px;
    border-radius:14px;
    border:1px solid #333;
    background:#151515;
    color:#fff;
    position:relative;
    font-size:20px;
    transition:.2s;
}

.header-btn:hover{
    border-color:var(--green);
    transform:translateY(-2px);
}

.cart-count{
    position:absolute;
    top:-7px;
    left:-6px;
    width:21px;
    height:21px;
    border-radius:50%;
    background:var(--red);
    color:#fff;
    font-size:11px;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* =========================================================
   NAV
========================================================= */

.navbar{
    border-top:1px solid #171717;
}

.nav{
    min-height:60px;
    display:flex;
    align-items:center;
    gap:8px;
    overflow-x:auto;
    padding:6px 0;
}

.nav::-webkit-scrollbar{
    display:none;
}

.nav a{
    white-space:nowrap;
    padding:9px 18px;
    border-radius:15px;
    color:#bbb;
    font-size:13px;
    border:1px solid transparent;
    transition:.25s;
    background:
    linear-gradient(
        135deg,
        #151515,
        #0e0e0e
    );
}

.nav a:nth-child(1){
    border-radius:20px 8px 20px 8px;
}

.nav a:nth-child(2){
    border-radius:8px 20px 8px 20px;
}

.nav a:nth-child(3){
    border-radius:20px 8px 20px 8px;
}

.nav a:nth-child(4){
    border-radius:8px 20px 8px 20px;
}

.nav a:nth-child(5){
    border-radius:20px 8px 20px 8px;
}

.nav a:hover,
.nav a.active{
    color:#06120a;
    background:var(--green);
    border-color:var(--green);
    transform:translateY(-2px);
}

/* =========================================================
   APP
========================================================= */

#app{
    min-height:70vh;
}

.page{
    padding:30px 0 50px;
    animation:pageIn .22s ease;
}

@keyframes pageIn{

    from{
        opacity:0;
        transform:translateY(7px);
    }

    to{
        opacity:1;
        transform:none;
    }

}

/* =========================================================
   HOME
   فقط خوش آمد + آمار
========================================================= */

.home-intro{
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px 0 0;
}

.home-box{
    width:100%;
    max-width:900px;
    padding:35px 35px 25px;

    border:1px solid #252525;
    border-radius:35px;

    background:
    radial-gradient(
        circle at 50% 0%,
        rgba(25,214,107,.12),
        transparent 45%
    ),
    linear-gradient(
        145deg,
        #151515,
        #090909
    );

    box-shadow:
    0 25px 80px rgba(0,0,0,.4);
}

.home-logo-small{
    width:90px;
    height:90px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid var(--green);
    margin-bottom:8px;

    box-shadow:
    0 0 30px rgba(25,214,107,.18);
}

.home-box h1{
    font-size:clamp(26px,5vw,48px);
    margin-bottom:10px;
}

.home-description{
    max-width:780px;
    margin:auto;
    color:#aaa;
    font-size:14px;
    line-height:2;
}

/* =========================================================
   STATS
========================================================= */

.stats{
    margin-top:16px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.stat{
    background:#101010;
    border:1px solid #292929;
    border-radius:18px;
    padding:13px;
}

.stat strong{
    display:block;
    font-size:22px;
}

.stat:nth-child(1) strong{
    color:var(--green);
}

.stat:nth-child(2) strong{
    color:#fff;
}

.stat:nth-child(3) strong{
    color:var(--red);
}

.stat span{
    font-size:11px;
    color:#888;
}

/* =========================================================
   SECTION
========================================================= */

.section{
    margin-top:32px;
}

.section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
}

.section-head h2{
    font-size:22px;
}

.section-head span{
    color:#888;
    font-size:12px;
}

/* =========================================================
   CATEGORIES
========================================================= */

.categories{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.category{
    min-height:180px;
    position:relative;
    overflow:hidden;
    background:#111;
    border:1px solid #292929;
    border-radius:24px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    padding:20px;
    transition:.25s;
}

.category:hover{
    transform:translateY(-5px);
    border-color:var(--green);
    box-shadow:0 15px 35px rgba(0,0,0,.35);
}

.category-image{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:.55;
    transition:.3s;
}

.category:hover .category-image{
    transform:scale(1.05);
    opacity:.68;
}

.category-overlay{
    position:absolute;
    inset:0;
    background:
    linear-gradient(
        to top,
        rgba(0,0,0,.94),
        rgba(0,0,0,.15)
    );
}

.category-content{
    position:relative;
    z-index:2;
    text-align:center;
}

.category-icon{
    font-size:38px;
    margin-bottom:3px;
}

.category-name{
    font-size:16px;
    font-weight:bold;
}

.category-sub{
    color:#aaa;
    font-size:10px;
    margin-top:3px;
}

/* =========================================================
   SUBCATEGORIES
========================================================= */

.subcategories{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:5px;
    margin-bottom:18px;
}

.subcategories::-webkit-scrollbar{
    display:none;
}

.subcategory-btn{
    border:1px solid #333;
    background:#151515;
    color:#bbb;
    border-radius:13px;
    padding:8px 14px;
    white-space:nowrap;
    transition:.2s;
}

.subcategory-btn:hover,
.subcategory-btn.active{
    background:var(--green);
    border-color:var(--green);
    color:#06120a;
}

/* =========================================================
   PRODUCTS
========================================================= */

.products{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
}

.product-card{
    position:relative;
    overflow:hidden;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    transition:.25s;
}

.product-card:hover{
    transform:translateY(-5px);
    border-color:#555;
}

.product-image{
    height:220px;
    background:#1a1a1a;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:contain;
    padding:12px;
}

.product-image>span{
    font-size:65px;
}

.image-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:34px;
    height:34px;
    border-radius:50%;
    border:1px solid #555;
    background:rgba(0,0,0,.72);
    color:#fff;
    z-index:5;
    display:flex;
    align-items:center;
    justify-content:center;
}

.image-arrow.right{
    right:8px;
}

.image-arrow.left{
    left:8px;
}

.image-number{
    position:absolute;
    bottom:8px;
    right:50%;
    transform:translateX(50%);
    background:rgba(0,0,0,.7);
    border:1px solid #444;
    border-radius:20px;
    padding:2px 9px;
    font-size:9px;
    color:#ddd;
}

.product-info{
    padding:15px;
}

.product-title{
    font-size:15px;
    margin-bottom:5px;
}

.product-desc{
    color:#888;
    font-size:11px;
    min-height:35px;
}

.product-price{
    font-size:16px;
    font-weight:bold;
    margin-top:10px;
}

.product-price small{
    color:#888;
    font-size:10px;
    font-weight:normal;
}

.discount-label{
    display:inline-block;
    background:var(--red);
    color:#fff;
    border-radius:7px;
    padding:2px 7px;
    font-size:9px;
    margin-right:5px;
}

.stock{
    margin-top:9px;
    font-size:11px;
    font-weight:bold;
}

.stock.green{
    color:#19d66b;
}

.stock.yellow{
    color:#ffc400;
}

.stock.red{
    color:#ff3843;
}

.product-actions{
    display:flex;
    gap:8px;
    margin-top:13px;
    padding:0 15px 15px;
}

.product-actions button{
    flex:1;
    padding:9px;
    border-radius:11px;
    border:1px solid #333;
    background:#1b1b1b;
    color:#fff;
}

.product-actions .buy{
    background:var(--green);
    color:#06120a;
    border-color:var(--green);
    font-weight:bold;
}

.favorite{
    position:absolute;
    top:10px;
    left:10px;
    width:40px;
    height:40px;
    border-radius:50%;
    border:1px solid #444;
    background:rgba(0,0,0,.75);
    color:#fff;
    font-size:19px;
    z-index:8;
}

.favorite.active{
    color:#ff3440;
}

/* =========================================================
   SORT
========================================================= */

.sort-area{
    position:relative;
    display:flex;
    justify-content:flex-start;
    margin-bottom:18px;
}

.sort-box{
    position:relative;
}

.sort-toggle{
    min-width:190px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
    border:1px solid #333;
    background:
    linear-gradient(
        135deg,
        #171717,
        #101010
    );
    color:#fff;
    border-radius:14px;
    padding:10px 15px;
}

.sort-toggle:hover{
    border-color:var(--green);
}

.sort-menu{
    position:absolute;
    top:calc(100% + 7px);
    right:0;
    width:210px;
    padding:7px;
    background:#111;
    border:1px solid #333;
    border-radius:15px;
    box-shadow:0 20px 50px #000;
    z-index:100;
    display:none;
}

.sort-menu.open{
    display:block;
    animation:sortIn .18s ease;
}

@keyframes sortIn{

    from{
        opacity:0;
        transform:translateY(-5px);
    }

    to{
        opacity:1;
        transform:none;
    }

}

.sort-option{
    width:100%;
    display:block;
    text-align:right;
    border:0;
    background:transparent;
    color:#bbb;
    padding:10px 12px;
    border-radius:10px;
}

.sort-option:hover,
.sort-option.active{
    background:var(--green);
    color:#06120a;
}

/* =========================================================
   DETAIL
========================================================= */

.product-detail{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:30px;
    background:#101010;
    border:1px solid var(--border);
    border-radius:26px;
    padding:25px;
}

.detail-gallery{
    min-height:500px;
    position:relative;
    border-radius:20px;
    background:#191919;
    overflow:hidden;
}

.detail-gallery-main{
    width:100%;
    height:100%;
    min-height:500px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.detail-gallery-main img{
    width:100%;
    height:100%;
    max-height:500px;
    object-fit:contain;
    padding:20px;
}

.detail-gallery-main>span{
    font-size:120px;
}

.detail-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:44px;
    height:44px;
    border-radius:50%;
    background:rgba(0,0,0,.72);
    color:#fff;
    border:1px solid #555;
    z-index:5;
    font-size:20px;
}

.detail-arrow.right{
    right:12px;
}

.detail-arrow.left{
    left:12px;
}

.detail-dots{
    position:absolute;
    bottom:14px;
    right:50%;
    transform:translateX(50%);
    display:flex;
    gap:5px;
}

.detail-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#555;
}

.detail-dot.active{
    background:var(--green);
}

.detail-info{
    padding:20px 5px;
}

.detail-info h1{
    font-size:32px;
    margin-bottom:10px;
}

.detail-desc{
    color:#999;
    margin-bottom:25px;
}

.detail-price{
    font-size:26px;
    font-weight:bold;
    margin-bottom:8px;
}

.detail-discount{
    color:#19d66b;
    font-size:13px;
    margin-bottom:20px;
}

.detail-stock{
    padding:12px 15px;
    border-radius:13px;
    background:#151515;
    border:1px solid #292929;
    margin-bottom:20px;
    font-size:13px;
    font-weight:bold;
}

.product-specs{
    margin:20px 0;
    border:1px solid var(--border);
    border-radius:15px;
    overflow:hidden;
}

.product-specs-title{
    padding:13px 15px;
    background:#171717;
    font-weight:bold;
}

.product-specs-text{
    padding:15px;
    color:#aaa;
    font-size:13px;
    line-height:2;
    white-space:pre-line;
}

.quantity{
    display:flex;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
}

.quantity button{
    width:40px;
    height:40px;
    border:1px solid #333;
    background:#191919;
    color:#fff;
    border-radius:9px;
    font-size:18px;
}

.quantity strong{
    min-width:25px;
    text-align:center;
}

/* =========================================================
   BUTTONS
========================================================= */

.primary-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border:0;
    background:var(--green);
    color:#06120a;
    padding:12px 24px;
    border-radius:13px;
    font-weight:bold;
    transition:.2s;
}

.primary-btn:hover{
    background:#25ee78;
    transform:translateY(-2px);
}

.secondary-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border:1px solid #333;
    background:#171717;
    color:#fff;
    padding:11px 20px;
    border-radius:12px;
}

/* =========================================================
   PAGE TITLE
========================================================= */

.page-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:25px;
}

.page-title h1{
    font-size:29px;
}

.page-title p{
    color:#888;
    font-size:12px;
}

/* =========================================================
   CART
========================================================= */

.cart-page{
    max-width:900px;
    margin:auto;
}

.cart-item{
    display:flex;
    align-items:center;
    gap:15px;
    padding:15px;
    margin-bottom:10px;
    border:1px solid var(--border);
    background:var(--card);
    border-radius:15px;
}

.cart-icon{
    width:75px;
    height:75px;
    border-radius:12px;
    background:#202020;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:35px;
    overflow:hidden;
}

.cart-icon img{
    width:100%;
    height:100%;
    object-fit:contain;
    padding:8px;
}

.cart-item-info{
    flex:1;
}

.cart-item-info h3{
    font-size:14px;
}

.cart-item-info p{
    color:#888;
    font-size:11px;
}

.qty{
    display:flex;
    align-items:center;
    gap:7px;
}

.qty button{
    width:31px;
    height:31px;
    border-radius:8px;
    border:1px solid #333;
    background:#1c1c1c;
    color:#fff;
}

.remove{
    border:0;
    background:none;
    color:#888;
    font-size:18px;
}

.cart-summary{
    margin-top:20px;
    padding:22px;
    background:#121212;
    border:1px solid var(--border);
    border-radius:17px;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
}

.summary-row.total{
    padding-top:13px;
    border-top:1px solid #292929;
    font-size:19px;
    font-weight:bold;
}

/* =========================================================
   SUPPORT
========================================================= */

.support-page{
    max-width:850px;
    margin:auto;
}

.support-header{
    text-align:center;
    padding:40px 25px;
    margin-bottom:20px;
    border:1px solid #252525;
    border-radius:30px;

    background:
    radial-gradient(
        circle at 50% 0%,
        rgba(255,196,0,.13),
        transparent 45%
    ),
    radial-gradient(
        circle at bottom right,
        rgba(25,214,107,.08),
        transparent 40%
    ),
    #101010;

    box-shadow:
    0 25px 70px rgba(0,0,0,.35);
}

.support-avatar{
    width:85px;
    height:85px;
    margin:auto auto 15px;
    border-radius:50%;
    background:var(--yellow);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
    box-shadow:
    0 0 30px rgba(255,196,0,.18);
}

.support-header h1{
    font-size:29px;
    margin-bottom:5px;
}

.support-header p{
    color:#888;
    font-size:12px;
    max-width:600px;
    margin:auto;
}

.contact-card{
    display:flex;
    align-items:center;
    gap:15px;
    padding:20px;
    margin-bottom:13px;
    background:
    linear-gradient(
        135deg,
        #151515,
        #0d0d0d
    );
    border:1px solid #292929;
    border-radius:21px;
    transition:.25s;
}

.contact-card:hover{
    transform:translateY(-3px);
    border-color:var(--green);
    box-shadow:0 15px 35px rgba(0,0,0,.3);
}

.contact-icon{
    width:55px;
    height:55px;
    border-radius:16px;
    background:#191919;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    border:1px solid #2b2b2b;
}

.contact-info{
    flex:1;
}

.contact-info small{
    color:#777;
    display:block;
    font-size:10px;
}

.contact-info strong{
    font-size:15px;
}

.contact-actions{
    display:flex;
    gap:7px;
}

.contact-actions button{
    border:1px solid #333;
    background:#191919;
    color:#fff;
    border-radius:11px;
    padding:9px 12px;
}

.contact-actions .contact-main{
    background:var(--green);
    border-color:var(--green);
    color:#06120a;
    font-weight:bold;
}

/* =========================================================
   LAWS
========================================================= */

.laws-box{
    min-height:450px;
    background:#101010;
    border:1px solid #292929;
    border-radius:25px;
    padding:30px;
}

.laws-content{
    color:#aaa;
    font-size:14px;
    line-height:2.2;
    white-space:pre-line;
}

.laws-empty{
    min-height:390px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#555;
    font-size:13px;
}

/* =========================================================
   MODAL
========================================================= */

.modal-backdrop{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.78);
    backdrop-filter:blur(8px);
    z-index:5000;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.law-modal{
    width:100%;
    max-width:500px;
    background:#111;
    border:1px solid #333;
    border-radius:27px;
    padding:30px;
    box-shadow:0 30px 100px #000;
    animation:modalIn .25s ease;
    text-align:center;
}

@keyframes modalIn{

    from{
        opacity:0;
        transform:scale(.92);
    }

    to{
        opacity:1;
        transform:scale(1);
    }

}

.law-modal-icon{
    width:65px;
    height:65px;
    border-radius:50%;
    background:var(--green);
    color:#06120a;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 15px;
    font-size:30px;
}

.law-modal h2{
    margin-bottom:8px;
}

.law-modal p{
    color:#999;
    font-size:13px;
    margin-bottom:22px;
}

.modal-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.accept-btn{
    border:0;
    background:var(--green);
    color:#06120a;
    border-radius:13px;
    padding:12px;
    font-weight:bold;
}

.reject-btn{
    border:0;
    background:#c91420;
    color:#fff;
    border-radius:13px;
    padding:12px;
}

/* =========================================================
   FLOAT SUPPORT
========================================================= */

.floating-support{
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:2500;
    width:62px;
    height:62px;
    border-radius:50%;
    border:3px solid #111;
    background:var(--yellow);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
    transition:.25s;
}

.floating-support:hover{
    transform:scale(1.08) rotate(-3deg);
}

/* =========================================================
   RESULT
========================================================= */

.no-result{
    text-align:center;
    padding:80px 10px;
    color:#888;
}

.no-result div{
    font-size:55px;
    margin-bottom:10px;
}

.loading{
    text-align:center;
    padding:90px 10px;
    color:#aaa;
}

.loading div{
    font-size:50px;
    margin-bottom:10px;
}

/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;
    bottom:25px;
    right:25px;
    z-index:6000;
    background:#171717;
    border:1px solid #333;
    border-right:4px solid var(--green);
    border-radius:13px;
    padding:13px 17px;
    box-shadow:0 15px 40px #000;
    transform:translateY(100px);
    opacity:0;
    transition:.3s;
    pointer-events:none;
}

.toast.show{
    transform:translateY(0);
    opacity:1;
}

/* =========================================================
   FOOTER
========================================================= */

footer{
    margin-top:50px;
    padding:30px 0;
    background:#060606;
    border-top:1px solid var(--border);
}

.copy{
    text-align:center;
    color:#666;
    font-size:11px;
}

/* =========================================================
   FIREBASE STATUS
========================================================= */

.firebase-status{
    margin:12px auto 0;
    max-width:900px;
    font-size:10px;
    color:#666;
    text-align:center;
}

.firebase-status.error{
    color:#ff5964;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:950px){

    .categories{
        grid-template-columns:repeat(3,1fr);
    }

    .products{
        grid-template-columns:repeat(2,1fr);
    }

    .header-main{
        flex-wrap:wrap;
        padding:10px 0;
    }

    .search-box{
        order:3;
        flex-basis:100%;
        max-width:none;
    }

    .product-detail{
        grid-template-columns:1fr;
    }

}

@media(max-width:600px){

    .container{
        width:94%;
    }

    .logo img{
        width:58px;
        height:58px;
    }

    .logo-name{
        font-size:18px;
    }

    .header-actions{
        margin-right:auto;
    }

    .header-btn{
        min-width:43px;
        padding:0 8px;
    }

    .home-box{
        padding:30px 18px 20px;
        border-radius:25px;
    }

    .home-logo-small{
        width:75px;
        height:75px;
    }

    .home-description{
        font-size:12px;
        line-height:2;
    }

    .stats{
        gap:6px;
        margin-top:12px;
    }

    .stat{
        padding:10px 4px;
    }

    .stat strong{
        font-size:16px;
    }

    .stat span{
        font-size:8px;
    }

    .categories{
        grid-template-columns:repeat(3,1fr);
        gap:8px;
    }

    .category{
        min-height:125px;
        border-radius:17px;
        padding:10px;
    }

    .category-icon{
        font-size:28px;
    }

    .category-name{
        font-size:11px;
    }

    .products{
        gap:9px;
    }

    .product-image{
        height:155px;
    }

    .product-info{
        padding:10px;
    }

    .product-title{
        font-size:13px;
    }

    .product-desc{
        font-size:9px;
    }

    .product-price{
        font-size:13px;
    }

    .product-actions{
        flex-direction:column;
    }

    .detail-gallery,
    .detail-gallery-main{
        min-height:280px;
    }

    .detail-info h1{
        font-size:24px;
    }

    .cart-item{
        flex-wrap:wrap;
    }

    .cart-item-info{
        min-width:calc(100% - 95px);
    }

    .contact-card{
        flex-wrap:wrap;
    }

    .contact-info{
        min-width:calc(100% - 70px);
    }

    .contact-actions{
        width:100%;
    }

    .contact-actions button{
        flex:1;
    }

    .floating-support{
        width:56px;
        height:56px;
        right:14px;
        bottom:14px;
    }

    .sort-toggle{
        width:100%;
    }

    .sort-box{
        width:100%;
    }

    .sort-menu{
        width:100%;
    }

}

const WORKER_URL =
    "https://curly-cherry-da35.amydypiam064.workers.dev";

async function workerFetch(path){

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 8000);

    try{
        const response = await fetch(
            WORKER_URL + path,
            {
                method:"GET",
                cache:"no-store",
                signal: controller.signal,
                headers:{
                    "Accept":"application/json"
                }
            }
        );

        const data = await response.json().catch(() => ({}));

        if(!response.ok)
            throw new Error(
                data?.error?.message ||
                data?.error ||
                `HTTP ${response.status}`
            );

        return data;
    }catch(error){
        if(error?.name === "AbortError")
            throw new Error("اتصال به سرور بیش از ۸ ثانیه طول کشید.");
        throw error;
    }finally{
        clearTimeout(timeout);
    }

}

/* =========================================================
   HELPERS
========================================================= */

function safeJSON(value,fallback){

    try{

        if(!value)
            return fallback;

        const parsed =
            JSON.parse(value);

        return parsed;

    }catch{

        return fallback;

    }

}


function escapeHTML(text){

    return String(text ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function formatNumber(value){

    const num =
        Number(value || 0);

    if(!Number.isFinite(num))
        return "0";

    return num.toLocaleString("fa-IR");

}


function normalizeText(value){

    return String(value ?? "")
        .trim()
        .toLowerCase()
        .replace(/\u200c/g,"")
        .replace(/\s+/g," ")
        .replace(/[يى]/g,"ی")
        .replace(/ك/g,"ک")
        .replace(/ۀ/g,"ه")
        .replace(/ة/g,"ه")
        .replace(/[أإٱ]/g,"ا")
        .replace(/ؤ/g,"و")
        .replace(/ئ/g,"ی");

}

function normalizeSubcategoryText(value){
    return normalizeText(value);
}

function getProductSubcategoryValues(p){
    return [
        p?.subcategory,
        p?.subCat,
        p?.sub_category,
        p?.childCategory,
        p?.childCat,
        p?.goldCat
    ].filter(v => String(v ?? "").trim() !== "");
}

function getProductSubcategory(p){
    return String(getProductSubcategoryValues(p)[0] || "").trim();
}

function productSearchText(p){
    return normalizeSubcategoryText([
        p?.name, p?.brand, p?.subcategory, p?.subCat,
        p?.sub_category, p?.childCategory, p?.childCat,
        p?.goldCat, p?.search, p?.description
    ].filter(Boolean).join(" "));
}

function productMatchesSubcategory(p, selected){
    const wanted = normalizeSubcategoryText(selected);
    if(!wanted || wanted === "همه" || wanted === "all") return true;

    const explicit = getProductSubcategoryValues(p)
        .map(normalizeSubcategoryText);
    if(explicit.includes(wanted)) return true;

    const aliases = {
        "ایفون":["ایفون","iphone","apple"],
        "آیفون":["ایفون","iphone","apple"],
        "سامسونگ":["سامسونگ","samsung"],
        "شیائومی":["شیائومی","شیومی","xiaomi"],
        "نوکیا":["نوکیا","nokia"],
        "گردنبند":["گردنبند","necklace"],
        "پابند":["پابند","anklet"],
        "النگو":["النگو","bangle"],
        "انگشتر":["انگشتر","ring"],
        "ست":["ست","set"],
        "اسپرت":["اسپرت","sport"],
        "مجلسی":["مجلسی","formal"],
        "مردانه":["مردانه","men","male"],
        "زنانه":["زنانه","women","female"],
        "لباس مجلسی":["لباس مجلسی","مجلسی","formal"]
    };

    const text = productSearchText(p);
    return (aliases[wanted] || [wanted]).some(x =>
        text.includes(normalizeSubcategoryText(x))
    );
}


function getCreatedTime(value){

    if(!value)
        return 0;

    if(typeof value === "number")
        return value;

    if(
        typeof value === "object" &&
        value.seconds !== undefined
    ){

        return Number(value.seconds) * 1000;

    }

    if(
        typeof value.toMillis === "function"
    ){

        return value.toMillis();

    }

    const time =
        new Date(value).getTime();

    return Number.isFinite(time)
        ? time
        : 0;

}


/* =========================================================
   IMAGE RESOLVER
========================================================= */

function resolveImage(path){

    if(path === null || path === undefined)
        return "";

    let value =
        String(path).trim();

    if(!value)
        return "";

    /* data URL */
    if(/^data:/i.test(value))
        return value;

    /* http / https */
    if(/^https?:\/\//i.test(value))
        return value;

    /*
       Firebase Storage URL
    */
    if(/^gs:\/\//i.test(value))
        return value;

    /*
       حذف ./ اول مسیر
    */
    value =
        value.replace(/^\.\/+/,"");

    /*
       حذف / اول مسیر
    */
    value =
        value.replace(/^\/+/,"");

    /*
       اگر پنل products/filename.jpg ذخیره کرده
       و فایل در GitHub Pages کنار سایت است،
       این روش آن را درست می‌سازد.
    */
    try{

        return new URL(
            value,
            window.location.origin +
            window.location.pathname
                .replace(/\/[^\/]*$/,"/")
        ).href;

    }catch{

        return value;

    }

}


/*
   این تابع مخصوص مسیرهایی است که پنل ادمین
   در فیلد عکس ذخیره کرده است.
*/
function getImageCandidates(path){

    if(!path)
        return [];

    const raw =
        String(path).trim();

    if(!raw)
        return [];

    const result = [];

    if(/^https?:\/\//i.test(raw))
        result.push(raw);

    if(/^data:/i.test(raw))
        result.push(raw);

    if(!/^https?:\/\//i.test(raw) &&
       !/^data:/i.test(raw)){

        const clean =
            raw
                .replace(/^\.\/+/,"")
                .replace(/^\/+/,"");

        result.push(
            resolveImage(clean)
        );

        /*
           اگر فقط نام فایل ذخیره شده باشد
           مثل iphone.jpg
        */
        result.push(
            resolveImage(
                "products/" + clean
            )
        );

        result.push(
            resolveImage(clean)
        );

    }

    return [
        ...new Set(
            result.filter(Boolean)
        )
    ];

}

function mergeCategories(raw){

    const source =
        Array.isArray(raw)
            ? raw
            : [];

    const map = {};

    DEFAULT_CATEGORIES.forEach(c => {

        map[String(c.id)] = {

            ...c,

            subcategories:
            Array.isArray(c.subcategories)
                ? [...c.subcategories]
                : []

        };

    });


    source.forEach((c,index) => {

        if(!c)
            return;

        const id =
            String(
                c.id ||
                "category_" + index
            );

        if(map[id]){

            map[id] = {

                ...map[id],
                ...c,

                subcategories:
                Array.isArray(c.subcategories)
                    ? [...c.subcategories]
                    : map[id].subcategories

            };

        }else{

            map[id] = {

                ...c,

                id:id,

                name:
                    c.name ||
                    "دسته‌بندی",

                icon:
                    c.icon ||
                    "📦",

                image:
                    c.image ||
                    "",

                subcategories:
                Array.isArray(c.subcategories)
                    ? [...c.subcategories]
                    : []

            };

        }

    });

    return map;

}


function getCategories(){

    return mergeCategories(

        settings &&
        Array.isArray(settings.categories)

            ? settings.categories

            : DEFAULT_CATEGORIES

    );

}

/* =========================================================
   PRODUCT NORMALIZER
========================================================= */

function normalizeProduct(docSnap){

    const data =
        typeof docSnap?.data === "function"
            ? (docSnap.data() || {})
            : (docSnap || {});


    let images = [];


    /*
       حالت اول:
       images: []
    */
    if(Array.isArray(data.images)){

        images.push(
            ...data.images
        );

    }


    /*
       حالت دوم:
       image1 / image2 / image3
    */
    [
        data.image1,
        data.image2,
        data.image3
    ].forEach(img => {

        if(img)
            images.push(img);

    });


    /*
       حالت‌های احتمالی دیگر
    */
    [
        data.image,
        data.photo,
        data.photoUrl,
        data.imageUrl,
        data.img
    ].forEach(img => {

        if(img)
            images.push(img);

    });


    /*
       حذف موارد تکراری
    */
    images =
        [
            ...new Set(
                images
                    .filter(Boolean)
                    .map(
                        x =>
                        String(x).trim()
                    )
                    .filter(Boolean)
            )
        ]
        .slice(0,3);


    /*
       نام محصول
    */
    const name =
        data.name ??
        data.title ??
        "محصول بدون نام";


    const category =
        data.category ??
        data.categoryId ??
        "";


    const description =
        data.description ??
        data.desc ??
        "";


    const rawCode =
        data.code ??
        docSnap?.id ??
        "";


    const numericCode =
        Number(rawCode);


    const publicId =
        Number.isFinite(numericCode) &&
        String(rawCode).trim() !== ""
            ? numericCode
            : docSnap.id;


    const imageUrls =
        images
            .flatMap(
                img =>
                getImageCandidates(img)
            )
            .filter(Boolean);


    const uniqueImageUrls =
        [
            ...new Set(imageUrls)
        ].slice(0,3);


    return {

        id:publicId,

        docId:docSnap?.id || data.code || "",

        code:String(rawCode),

        name:String(name),

        category:String(category),

        cat:String(category),

        subcategory:
            data.subcategory ||
            data.subCat ||
            data.sub_category ||
            data.childCategory ||
            data.childCat ||
            data.goldCat ||
            "",

        brand:
            data.brand ||
            "",

        goldCat:
            data.goldCat ||
            "",

        search:
            `${name} ${
                data.brand || ""
            } ${
                category
            } ${
                data.subcategory || ""
            }`,

        price:
            Number(data.price || 0),

        stock:
            Number(data.stock ?? 0),

        status:
            data.status ||
            (
                Number(data.stock || 0) > 0
                    ? "available"
                    : "unavailable"
            ),

        image:
            uniqueImageUrls[0] || "",

        image2:
            uniqueImageUrls[1] || "",

        image3:
            uniqueImageUrls[2] || "",

        images:
            uniqueImageUrls,

        /*
           مسیرهای اصلی را هم نگه می‌داریم
           برای خطایابی و حالت‌های مختلف پنل
        */
        originalImages:
            images,

        icon:
            data.icon ||
            "🛍️",

        desc:
            String(description),

        description:
            String(description),

        specs:
            data.specs ||
            "",

        discount:
            Number(data.discount || 0),

        createdAt:
            data.createdAt ||
            null,

        updatedAt:
            data.updatedAt ||
            null

    };

}

        );

        return false;
    }

}


/* =========================================================
   PRODUCTS LOAD
========================================================= */

async function loadProducts(){

    try{

        const data = await workerFetch("/products");
        const raw = Array.isArray(data)
            ? data
            : (Array.isArray(data?.products)
                ? data.products
                : (Array.isArray(data?.documents) ? data.documents : []));

        const list = raw.map(normalizeProduct);

        list.sort((a,b) => {
            const ad = getCreatedTime(a.createdAt);
            const bd = getCreatedTime(b.createdAt);
            if(ad !== bd) return bd - ad;
            const an = Number(a.code);
            const bn = Number(b.code);
            if(Number.isFinite(an) && Number.isFinite(bn)) return bn - an;
            return String(a.name).localeCompare(String(b.name), "fa");
        });

        products = list;
        console.log("MAHAN CENTER PRODUCTS:", products.length);
        return true;

    }catch(error){

        console.error("Products Worker error:", error);
        showSmallFirebaseError(
            "دریافت محصولات از سرور فروشگاه انجام نشد."
        );
        return false;

    }

}


/* =========================================================
   FIREBASE ERROR
========================================================= */

function showSmallFirebaseError(message){

    let old =
        document.getElementById(
            "firebaseStatus"
        );


    if(!old){

        old =
            document.createElement(
                "div"
            );

        old.id =
            "firebaseStatus";

        old.className =
            "firebase-status";

        document.body.appendChild(
            old
        );

    }


    old.textContent =
        message;

    old.classList.add(
        "error"
    );


    clearTimeout(
        window.firebaseErrorTimer
    );


    window.firebaseErrorTimer =
        setTimeout(
            () => {

                if(old)
                    old.remove();

            },
            7000
        );

}

function go(path){
    const target = String(path || "/");
    const hash = "#" + target;

    if(location.hash === hash){
        render(target);
        window.scrollTo({top:0,behavior:"smooth"});
        return;
    }

    // فقط تغییر مسیر؛ رندر را hashchange یک بار انجام می‌دهد.
    location.hash = hash;
}


function getRoute(){

    const hash =
        location.hash.substring(1);


    if(!hash)
        return "/";


    return hash;

}


window.addEventListener(
    "hashchange",
    () => {

        render(
            getRoute()
        );

    }
);

    categories =

    const app =
        document.getElementById(
            "app"
        );


    if(!app)
        return;


    if(route === "/")
        renderHome();

    else if(
        route === "/categories"
    )
        renderCategories();

    else if(
        route === "/discount"
    )
        renderDiscount();

    else if(route === "/account")
        renderAccount();

    else if(
        route === "/favorites"
    )
        renderFavorites();

    else if(
        route === "/cart"
    )
        renderCart();

    else if(
        route === "/laws"
    )
        renderLaws();

    else if(
        route === "/support"
    )
        renderSupport();

    else if(
        route.startsWith(
            "/category/"
        )
    ){

        const parts =
            route
                .split("/")
                .filter(Boolean);


        const cat =
            decodeURIComponent(
                parts[1] || ""
            );


        const sub =
            parts[2]
                ? decodeURIComponent(
                    parts[2]
                  )
                : "all";


        renderCategory(
            cat,
            sub
        );

    }

    else if(
        route.startsWith(
            "/product/"
        )
    ){

        renderProduct(
            decodeURIComponent(
                route.split("/")[2] || ""
            )
        );

    }

    else if(
        route.startsWith(
            "/search/"
        )
    ){

        renderSearch(
            decodeURIComponent(
                route.split("/")[2] || ""
            )
        );

    }

    else{

        renderHome();

    }


    updateActiveNav();

}

/* =========================================================
   SORT
========================================================= */

function getFinalPrice(p){

    const price =
        Number(
            p.price || 0
        );


    const discount =
        Number(
            p.discount || 0
        );


    return discount > 0
        ? Math.round(
            price -
            (
                price *
                discount /
                100
            )
          )
        : price;

}


function sortProducts(list){

    const arr =
        [...list];


    if(
        currentSort ===
        "newest"
    ){

        arr.sort(
            (a,b) => {

                const at =
                    getCreatedTime(
                        a.createdAt
                    );

                const bt =
                    getCreatedTime(
                        b.createdAt
                    );


                if(at !== bt)
                    return bt - at;


                return Number(
                    b.code || 0
                )
                -
                Number(
                    a.code || 0
                );

            }
        );

    }


    else if(
        currentSort ===
        "oldest"
    ){

        arr.sort(
            (a,b) => {

                const at =
                    getCreatedTime(
                        a.createdAt
                    );

                const bt =
                    getCreatedTime(
                        b.createdAt
                    );


                if(at !== bt)
                    return at - bt;


                return Number(
                    a.code || 0
                )
                -
                Number(
                    b.code || 0
                );

            }
        );

    }


    else if(
        currentSort ===
        "cheap"
    ){

        arr.sort(
            (a,b) =>
                getFinalPrice(a) -
                getFinalPrice(b)
        );

    }


    else if(
        currentSort ===
        "expensive"
    ){

        arr.sort(
            (a,b) =>
                getFinalPrice(b) -
                getFinalPrice(a)
        );

    }


    else if(
        currentSort ===
        "discount"
    ){

        arr.sort(
            (a,b) =>
                Number(
                    b.discount || 0
                )
                -
                Number(
                    a.discount || 0
                )
        );

    }


    return arr;

}


function getSortName(){

    const names = {

        newest:"جدیدترین",

        oldest:"قدیمی‌ترین",

        cheap:"ارزان‌ترین",

        expensive:"گران‌ترین",

    };


    return (

}

/* =========================================================
   CATEGORY HELPERS
========================================================= */

function productBelongsToCategory(
    product,
    categoryId
){

    const cat =
        categories[
            String(categoryId)
        ];


    const values = [

        product.category,

        product.cat,

        product.categoryId,

        product.categoryName

    ]
    .map(normalizeText)
    .filter(Boolean);


    const wantedId =
        normalizeText(
            categoryId
        );


    const wantedName =
        normalizeText(
            cat?.name
        );


    return (

        values.includes(
            wantedId
        )

        ||

        (
            wantedName &&
            values.includes(
                wantedName
            )
        )

    );

}


function getCategorySubcategories(
    cat,
    categoryProducts
){

    const configured =
        Array.isArray(
            cat?.subcategories
        )
            ? cat.subcategories.filter(
                Boolean
              )
            : [];


    const derived =
        categoryProducts
            .map(
                getProductSubcategory
            )
            .filter(Boolean);


    return [
        ...new Set([
            ...configured,
            ...derived
        ])
    ];

}


function renderSubcategories(
    cat,
    categoryProducts
){

    const list =
        getCategorySubcategories(
            cat,
            categoryProducts
        );


    if(!list.length)
        return "";


    return `

        <div class="subcategories">

            <button
                class="subcategory-btn ${
                    currentSubcategory === "all"
                        ? "active"
                        : ""
                }"
                onclick="changeSubcategory('all')"
            >
                همه
            </button>


            ${
                list
                    .map(
                        sub =>
                        `

                        <button
                            class="subcategory-btn ${
                                normalizeSubcategoryText(currentSubcategory) ===
                                    normalizeSubcategoryText(sub)
                                    ? "active"
                                    : ""
                            }"
                            onclick='changeSubcategory(${JSON.stringify(sub)})'
                        >
                            ${escapeHTML(sub)}
                        </button>

                        `
                    )
                    .join("")
            }

        </div>

    `;

}


function changeSubcategory(sub){

    currentSubcategory =
        String(
            sub ||
            "all"
        );


    const route =
        getRoute();


    const parts =
        route
            .split("/")
            .filter(Boolean);


    const cat =
        decodeURIComponent(
            parts[1] || ""
        );


    if(
        currentSubcategory ===
        "all"
    ){

        go(
            "/category/" +
            encodeURIComponent(cat)
        );

    }else{

        go(
            "/category/" +
            encodeURIComponent(cat) +
            "/" +
            encodeURIComponent(
                currentSubcategory
            )
        );

    }

}

function productImageHTML(p){

    const images =
        getProductImages(p);


    const first =

    if(!first){

                <span>
                    ${escapeHTML(
                        p.icon ||
                        "🛍️"
                    )}
                </span>

        `;

    }


    const arrows =
        images.length > 1

            ?

            `

            <button
                class="image-arrow right"
                onclick='event.preventDefault();event.stopPropagation();changeCardImage(${JSON.stringify(String(p.id))},1)'
            >
                ›
            </button>


            <button
                class="image-arrow left"
                onclick='event.preventDefault();event.stopPropagation();changeCardImage(${JSON.stringify(String(p.id))},-1)'
            >
                ‹
            </button>


            <div
                class="image-number"

            >

            </div>

            `

            : "";


    return `

        <div
            class="product-image"
            id="productImage-${id}"
        >

            <img
                id="cardImg-${id}"
                src="${escapeHTML(first)}"
                alt="${escapeHTML(p.name)}"

                    this.onerror=null;
                    this.style.display='none';
                "
            >

    `;

}


function changeCardImage(
    id,
    amount
){

    const p =
        products.find(
            x =>
                String(x.id) ===
                String(id)
        );


    if(!p)
        return;


    const images =
        getProductImages(p);


    if(images.length <= 1)
        return;


    if(
        cardImageIndexes[id] ===
        undefined
    ){

        cardImageIndexes[id] =
            0;

    }


    cardImageIndexes[id] +=
        Number(
            amount || 0
        );


    if(
        cardImageIndexes[id] < 0
    ){

        cardImageIndexes[id] =
            images.length - 1;

    }


    if(
        cardImageIndexes[id] >=
        images.length
    ){

        cardImageIndexes[id] =
            0;

    }


    const img =
        document.getElementById(
            "cardImg-" + id
        );


    const number =
        document.getElementById(
            "cardImageNumber-" + id
        );


    if(img){

        img.src =
            images[
                cardImageIndexes[id]
            ];

    }


    if(number){

        number.textContent =
            (
                cardImageIndexes[id] + 1
            ) +
            " / " +
            images.length;

    }

}

function changeDetailImage(
    id,
    amount
){

    const p =
        products.find(
            x =>
                String(x.id) ===
                String(id)
        );


    if(!p)
        return;


    const images =
        getProductImages(p);


    if(images.length <= 1)
        return;


    if(
        detailImageIndexes[id] ===
        undefined
    ){

        detailImageIndexes[id] =
            0;

    }


    detailImageIndexes[id] +=
        Number(
            amount || 0
        );


    if(
        detailImageIndexes[id] < 0
    ){

        detailImageIndexes[id] =
            images.length - 1;

    }


    if(
        detailImageIndexes[id] >=
        images.length
    ){

        detailImageIndexes[id] =
            0;

    }


    const img =
        document.getElementById(
            "detailMainImage"
        );


    if(img){

        img.src =
            images[
                detailImageIndexes[id]
            ];

    }


    document
        .querySelectorAll(
            ".detail-dot"
        )
        .forEach(
            (dot,index) => {

                dot.classList.toggle(
                    "active",
                    index ===
                    detailImageIndexes[id]
                );

            }
        );

}


function changeTempQty(amount){

    tempQty +=
        Number(
            amount || 0
        );


    if(tempQty < 1)
        tempQty = 1;


    if(tempQty > 99)
        tempQty = 99;


    window.tempQty =
        tempQty;


    const el =
        document.getElementById(
            "tempQty"
        );


    if(el)
        el.textContent =
            tempQty;

}

   CART
========================================================= */

function addToCart(
    id,
    qty
){

    qty =
        Number(
            qty || 1
        );


    if(
        !Number.isFinite(qty) ||
        qty < 1
    ){

        qty = 1;

    }


    const p =
        products.find(
            x =>
                String(x.id) ===
                    String(id)

                ||

                String(x.docId) ===
                    String(id)

                ||

                String(x.code) ===
                    String(id)
        );


    if(!p){

        showToast(
            "محصول پیدا نشد"
        );

        return;

    }


    const stock =
        Number(
            p.stock || 0
        );


    if(stock <= 0){

        showToast(
            "این محصول موجود نیست"
        );

        return;

    }


    const item =
        cart.find(
            x =>
                String(x.id) ===
                String(id)
        );


    const currentQty =
        item
            ? Number(
                item.qty || 0
              )
            : 0;


    if(
        currentQty + qty >
        stock
    ){

        showToast(
            "تعداد انتخابی بیشتر از موجودی است"
        );

        return;

    }


    if(item){

        item.qty += qty;

    }else{

        cart.push({

            id:p.id,

            qty:qty

        });

    }


    saveData();


    showToast(
        "محصول به سبد خرید اضافه شد ✓"
    );

}


function cartQty(
    id,
    amount
){

    const item =
        cart.find(
            x =>
                String(x.id) ===
                String(id)
        );


    if(!item)
        return;


    const p =
        products.find(
            x =>
                String(x.id) ===
                String(id)
                ||
                String(x.docId) ===
                String(id)
                ||
                String(x.code) ===
                String(id)
        );


    item.qty +=
        Number(
            amount || 0
        );


    if(p){

        item.qty =
            Math.min(
                item.qty,
                Number(
                    p.stock || 0
                )
            );

    }


    if(item.qty < 1){

        cart =
            cart.filter(
                x =>
                    String(x.id) !==
                    String(id)
            );

    }


    saveData();


    renderCart();

}


function removeFromCart(id){

    cart =
        cart.filter(
            x =>
                String(x.id) !==
                String(id)
        );


    saveData();


    renderCart();


    showToast(
        "محصول از سبد حذف شد"
    );

}

async function submitOrder(customer){

 if(!items.length)return showToast("محصولات سبد خرید دیگر در دسترس نیستند");
 const total=items.reduce((s,x)=>s+x.unitPrice*x.qty,0);

 try{
   const r=await fetch(WORKER_URL+"/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(order)});
   const d=await r.json().catch(()=>({}));
   if(!r.ok || d.success===false)throw new Error(d?.message||d?.error?.message||d?.error||`HTTP ${r.status}`);
   const saved=d.order||{...order,orderId:"ORD-"+Date.now()};
   const localOrders=safeJSON(localStorage.getItem("mahanOrders"),[]);
   localOrders.unshift(saved);
   localStorage.setItem("mahanOrders",JSON.stringify(localOrders.slice(0,50)));
   cart=[];
   saveData();
   updateCartCount();
   showOrderSuccess(saved);
 }catch(e){
   console.error(e);
   showToast("ثبت سفارش انجام نشد: "+(e?.message||"خطای نامشخص"));
 }
}

async function copyText(text){

    const value =
        String(
            text ?? ""
        );


    try{

        if(
            navigator.clipboard &&
            navigator.clipboard.writeText
        ){

            await navigator.clipboard.writeText(
                value
            );


            showToast(
                "کپی شد ✓"
            );


            return;

        }

    }catch(error){

        console.warn(
            "Clipboard error:",
            error
        );

    }


    fallbackCopy(
        value
    );

}


function fallbackCopy(text){

    const area =
        document.createElement(
            "textarea"
        );


    area.value =
        text;


    area.style.position =
        "fixed";


    area.style.opacity =
        "0";


    document.body.appendChild(
        area
    );


    area.focus();

    area.select();


    try{

        document.execCommand(
            "copy"
        );


        showToast(
            "کپی شد ✓"
        );

    }catch{

        showToast(
            "کپی خودکار انجام نشد"
        );

    }


    area.remove();

}

function showToast(
    message
){

    const toast =
        document.getElementById(
            "toast"
        );


    if(!toast)
        return;


    toast.textContent =
        String(
            message || ""
        );


    toast.classList.add(
        "show"
    );


    clearTimeout(
        window.mahanToastTimer
    );


    window.mahanToastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );

}

 const steps=['new','review','processing','ready','shipped','delivered']; const current=steps.indexOf(order.status); const item=order.items?.[Number(itemIndex)||0];
 const modal=document.createElement('div'); modal.className='order-track-backdrop'; modal.id='orderTrackModal';

function initialRender(){
    updateCartCount();
    applySiteSettings();

    if(!location.hash){
        history.replaceState({},"","#/");
    }

    // رندر اولیه قبل از دریافت اطلاعات انجام نمی‌شود؛
    // تا صفحات دسته‌بندی یک‌بار با داده خالی و بار دوم با محصولات ساخته نشوند.
}

/* =========================================================
   INITIALIZE STORE
   رندر اولیه فوری + همگام‌سازی بی‌صدا
========================================================= */

let storeInitialized = false;

async function initializeStore(){
    if(storeInitialized) return;
    storeInitialized = true;

    initialRender();

    // هر دو درخواست را با هم انجام می‌دهیم؛ اگر Worker قطع باشد
    // صفحه نباید برای همیشه سفید بماند.
    const results = await Promise.allSettled([
        loadSettings(),
        loadProducts()
    ]);

    const settingsOK = results[0].status === "fulfilled" && results[0].value === true;
    const productsOK = results[1].status === "fulfilled" && results[1].value === true;

    categories = getCategories();
    applySiteSettings();
    render(getRoute());

    // حتی در حالت خطای سرور، محتوای صفحه را از حالت visibility:hidden خارج کن.
    const app = document.getElementById("app");
    if(app) app.classList.add("ready");

    // اگر اطلاعات اصلی فروشگاه از Worker نیامد، صفحه نگهداری نمایش داده می‌شود.
    if(!settingsOK || !productsOK){
        setTimeout(showMaintenancePage, 100);
        return;
    }

    setTimeout(showFirstVisitLaw, 700);
}


/* =========================================================
   AUTO SYNC
   هر 60 ثانیه فقط داده‌ها را می‌گیرد.
   اگر چیزی واقعاً لازم باشد صفحه را یک بار رندر می‌کند.
========================================================= */

let syncing = false;


setInterval(
    async () => {

        if(syncing)
            return;


        syncing = true;


        try{

            const oldProductSignature =
                products
                    .map(
                        p =>
                            [
                                p.docId,
                                p.updatedAt,
                                p.price,
                                p.stock,
                                p.image,
                                p.image2,
                                p.image3
                            ].join("|")
                    )
                    .join("||");


            const oldStoreName =
                settings.storeName;


            await loadSettings();


            await loadProducts();


            categories =
                getCategories();


            applySiteSettings();


            const newProductSignature =
                products
                    .map(
                        p =>
                            [
                                p.docId,
                                p.updatedAt,
                                p.price,
                                p.stock,
                                p.image,
                                p.image2,
                                p.image3
                            ].join("|")
                    )
                    .join("||");


            const changed =
                oldProductSignature !==
                    newProductSignature
                ||
                oldStoreName !==
                    settings.storeName;


            /*
               فقط وقتی اطلاعات واقعاً تغییر کرده
               صفحه دوباره رندر می‌شود.
            */

            if(changed){

                render(
                    getRoute()
                );

            }

        }catch(error){

            console.error(
                "Auto sync error:",
                error
            );

        }finally{

            syncing = false;

        }

    },
    60000
);
