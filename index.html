<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ماهان سنتر ایران</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Tahoma,Arial,sans-serif;
  background:#f5f6f8;
  color:#171717;
}

button,input{
  font-family:inherit;
}

button{
  cursor:pointer;
  border:0;
}

a{
  text-decoration:none;
  color:inherit;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:#fff;
  border-bottom:1px solid #eee;
  box-shadow:0 2px 12px #00000008;
}

.header{
  max-width:1250px;
  margin:auto;
  min-height:82px;
  display:flex;
  align-items:center;
  gap:22px;
  padding:10px 18px;
}

.logoBox{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:235px;
  cursor:pointer;
}

.logoBox img{
  width:65px;
  height:65px;
  object-fit:contain;
  border-radius:50%;
}

.logoText{
  font-size:22px;
  font-weight:900;
  white-space:nowrap;
}

.search{
  flex:1;
  position:relative;
}

.search input{
  width:100%;
  height:48px;
  border:1px solid #ddd;
  border-radius:14px;
  padding:0 48px 0 15px;
  outline:none;
  background:#f7f7f8;
  font-size:14px;
}

.search input:focus{
  border-color:#222;
  background:#fff;
}

.searchIcon{
  position:absolute;
  right:16px;
  top:13px;
  font-size:20px;
}

.headerBtns{
  display:flex;
  gap:9px;
}

.headerBtn{
  background:#f5f5f6;
  width:48px;
  height:48px;
  border-radius:13px;
  font-size:20px;
  position:relative;
}

.badge{
  position:absolute;
  top:-5px;
  left:-5px;
  background:#e53935;
  color:white;
  font-size:10px;
  min-width:18px;
  height:18px;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* MAIN */

#app{
  min-height:calc(100vh - 82px);
}

.page{
  max-width:1250px;
  margin:auto;
  padding:30px 18px 60px;
}

/* HOME */

.hero{
  background:linear-gradient(135deg,#111,#292929);
  color:white;
  border-radius:25px;
  min-height:330px;
  padding:55px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  overflow:hidden;
}

.heroText{
  max-width:650px;
}

.hero h1{
  font-size:42px;
  margin-bottom:18px;
}

.hero p{
  color:#ccc;
  line-height:2;
  font-size:16px;
}

.heroBtn{
  margin-top:25px;
  background:white;
  color:#111;
  padding:13px 25px;
  border-radius:12px;
  font-weight:bold;
}

.homeTitle{
  text-align:center;
  margin:42px 0 22px;
  font-size:26px;
}

.categories{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
}

.category{
  background:white;
  border-radius:20px;
  padding:28px 15px;
  text-align:center;
  border:1px solid #eee;
  transition:.2s;
}

.category:hover{
  transform:translateY(-4px);
  box-shadow:0 12px 30px #00000010;
}

.categoryIcon{
  font-size:40px;
  margin-bottom:12px;
}

.category h3{
  font-size:16px;
}

.category p{
  margin-top:7px;
  color:#888;
  font-size:12px;
}

/* PAGE TITLE */

.pageHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.pageHead h1{
  font-size:28px;
}

.backBtn{
  background:white;
  border:1px solid #ddd;
  padding:10px 18px;
  border-radius:11px;
}

/* PRODUCTS */

.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.product{
  background:white;
  border-radius:18px;
  overflow:hidden;
  border:1px solid #eee;
  transition:.2s;
}

.product:hover{
  transform:translateY(-4px);
  box-shadow:0 15px 35px #00000012;
}

.productImg{
  height:210px;
  background:#f3f3f3;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:70px;
}

.productBody{
  padding:16px;
}

.productName{
  font-size:15px;
  font-weight:bold;
  line-height:1.8;
}

.productDesc{
  color:#888;
  font-size:12px;
  margin:7px 0;
}

.price{
  font-size:16px;
  font-weight:bold;
  margin-top:12px;
}

.productActions{
  display:flex;
  gap:8px;
  margin-top:13px;
}

.addCart{
  flex:1;
  background:#111;
  color:#fff;
  border-radius:10px;
  padding:11px;
}

.fav{
  width:42px;
  border-radius:10px;
  background:#f1f1f1;
  font-size:18px;
}

/* PRODUCT DETAIL */

.detail{
  background:white;
  border-radius:22px;
  padding:30px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:40px;
}

.detailImg{
  min-height:430px;
  background:#f4f4f4;
  border-radius:20px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:120px;
}

.detailInfo h1{
  font-size:30px;
  margin-bottom:15px;
}

.detailInfo p{
  color:#777;
  line-height:2;
}

.detailPrice{
  font-size:25px;
  font-weight:bold;
  margin:25px 0;
}

.quantity{
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}

.quantity button{
  width:38px;
  height:38px;
  border-radius:10px;
  background:#eee;
  font-size:20px;
}

/* CART */

.cartList{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.cartItem{
  background:white;
  border-radius:15px;
  padding:18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.cartInfo{
  flex:1;
}

.cartQty{
  display:flex;
  align-items:center;
  gap:10px;
}

.cartQty button{
  width:32px;
  height:32px;
  border-radius:8px;
  background:#eee;
}

.remove{
  background:#ffe9e9;
  color:#d22;
  padding:9px 12px;
  border-radius:9px;
}

.cartBottom{
  margin-top:20px;
  background:white;
  border-radius:18px;
  padding:22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.checkout{
  background:#111;
  color:#fff;
  padding:13px 25px;
  border-radius:11px;
}

/* EMPTY */

.empty{
  background:white;
  border-radius:20px;
  padding:70px 20px;
  text-align:center;
}

.emptyIcon{
  font-size:55px;
  margin-bottom:15px;
}

.empty p{
  color:#888;
  margin-top:8px;
}

/* FOOTER */

footer{
  background:#111;
  color:#fff;
  padding:35px 18px;
}

.footerInner{
  max-width:1250px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  gap:20px;
}

footer p{
  color:#aaa;
  margin-top:10px;
  line-height:1.9;
}

/* TOAST */

.toast{
  position:fixed;
  bottom:25px;
  right:25px;
  background:#111;
  color:#fff;
  padding:14px 20px;
  border-radius:12px;
  opacity:0;
  transform:translateY(20px);
  pointer-events:none;
  transition:.3s;
  z-index:5000;
}

.toast.show{
  opacity:1;
  transform:translateY(0);
}

/* MOBILE */

@media(max-width:900px){

  .header{
    flex-wrap:wrap;
  }

  .logoBox{
    min-width:auto;
  }

  .logoText{
    font-size:18px;
  }

  .search{
    order:3;
    flex-basis:100%;
  }

  .categories{
    grid-template-columns:repeat(2,1fr);
  }

  .products{
    grid-template-columns:repeat(2,1fr);
  }

  .hero{
    padding:30px;
    min-height:280px;
  }

  .hero h1{
    font-size:28px;
  }

  .detail{
    grid-template-columns:1fr;
  }

}

@media(max-width:550px){

  .header{
    padding:8px 12px;
  }

  .logoBox img{
    width:52px;
    height:52px;
  }

  .headerBtns{
    margin-right:auto;
  }

  .headerBtn{
    width:42px;
    height:42px;
  }

  .page{
    padding:20px 12px 45px;
  }

  .products{
    gap:10px;
  }

  .productImg{
    height:160px;
  }

  .hero{
    border-radius:18px;
    padding:25px;
  }

  .hero h1{
    font-size:24px;
  }

  .cartItem{
    flex-wrap:wrap;
  }

  .footerInner{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<header>
  <div class="header">

    <div class="logoBox" onclick="go('/')">
      <img src="logo.jpg" alt="ماهان سنتر ایران">
      <div class="logoText">ماهان سنتر ایران</div>
    </div>

    <div class="search">
      <span class="searchIcon">⌕</span>
      <input
        id="searchInput"
        type="text"
        placeholder="جستجوی محصول، برند یا کد کالا..."
        onkeydown="searchKey(event)"
      >
    </div>

    <div class="headerBtns">
      <button class="headerBtn" onclick="go('/favorites')">
        ♡
        <span id="favBadge" class="badge">0</span>
      </button>

      <button class="headerBtn" onclick="go('/cart')">
        🛒
        <span id="cartBadge" class="badge">0</span>
      </button>
    </div>

  </div>
</header>

<main id="app"></main>

<footer>
  <div class="footerInner">
    <div>
      <h3>ماهان سنتر ایران</h3>
      <p>
        فروشگاه اینترنتی ماهان سنتر ایران
        <br>
        تجربه‌ای ساده، سریع و حرفه‌ای
      </p>
    </div>

    <div>
      <h3>دسترسی سریع</h3>
      <p onclick="go('/')">خانه</p>
      <p onclick="go('/categories')">دسته‌بندی‌ها</p>
      <p onclick="go('/discount')">تخفیف‌ها</p>
    </div>

    <div>
      <h3>خدمات مشتریان</h3>
      <p>پشتیبانی</p>
      <p>قوانین و مقررات</p>
    </div>
  </div>
</footer>

<div id="toast" class="toast"></div>

<script>

/* =========================
   DATA
========================= */

const products = [

 {
  id:1,
  category:"mobile",
  name:"Samsung Galaxy A17",
  search:"A17 سامسونگ گلکسی ای 17",
  icon:"📱",
  price:0,
  desc:"گوشی موبایل سامسونگ Galaxy A17"
 },

 {
  id:2,
  category:"mobile",
  name:"Samsung Galaxy A16",
  search:"A16 سامسونگ گلکسی ای 16",
  icon:"📱",
  price:0,
  desc:"گوشی موبایل سامسونگ Galaxy A16"
 },

 {
  id:3,
  category:"mobile",
  name:"Samsung Galaxy S24",
  search:"S24 سامسونگ",
  icon:"📱",
  price:0,
  desc:"پرچمدار سامسونگ"
 },

 {
  id:4,
  category:"mobile",
  name:"iPhone 15",
  search:"آیفون 15 iphone 15",
  icon:"📱",
  price:0,
  desc:"گوشی موبایل اپل"
 },

 {
  id:5,
  category:"gold",
  name:"انگشتر طلا",
  search:"انگشتر طلا",
  icon:"💍",
  price:0,
  desc:"انگشتر طلای زیبا و ظریف"
 },

 {
  id:6,
  category:"gold",
  name:"گردنبند طلا",
  search:"گردنبند طلا",
  icon:"📿",
  price:0,
  desc:"گردنبند طلا"
 },

 {
  id:7,
  category:"clothes",
  name:"تیشرت مردانه",
  search:"تیشرت لباس مردانه",
  icon:"👕",
  price:0,
  desc:"تیشرت مردانه اسپرت"
 },

 {
  id:8,
  category:"clothes",
  name:"هودی اسپرت",
  search:"هودی لباس",
  icon:"🧥",
  price:0,
  desc:"هودی اسپرت"
 },

 {
  id:9,
  category:"accessories",
  name:"هدفون بی‌سیم",
  search:"هدفون هندزفری",
  icon:"🎧",
  price:0,
  desc:"هدفون بی‌سیم"
 },

 {
  id:10,
  category:"accessories",
  name:"شارژر موبایل",
  search:"شارژر کابل",
  icon:"🔌",
  price:0,
  desc:"شارژر موبایل"
 },

 {
  id:11,
  category:"digital",
  name:"لپ‌تاپ",
  search:"لپ تاپ کامپیوتر",
  icon:"💻",
  price:0,
  desc:"لپ‌تاپ"
 },

 {
  id:12,
  category:"shoes",
  name:"کتونی اسپرت",
  search:"کفش کتونی",
  icon:"👟",
  price:0,
  desc:"کتونی اسپرت"
 },

 {
  id:13,
  category:"watches",
  name:"ساعت مچی",
  search:"ساعت",
  icon:"⌚",
  price:0,
  desc:"ساعت مچی"
 }

];


/* =========================
   CATEGORIES
========================= */

const categories = {

 mobile:{
  title:"موبایل",
  icon:"📱",
  desc:"گوشی‌های موبایل"
 },

 gold:{
  title:"طلا",
  icon:"💍",
  desc:"انواع طلا و زیورآلات"
 },

 clothes:{
  title:"پوشاک",
  icon:"👕",
  desc:"پوشاک زنانه و مردانه"
 },

 accessories:{
  title:"لوازم جانبی",
  icon:"🎧",
  desc:"لوازم جانبی دیجیتال"
 },

 digital:{
  title:"کالای دیجیتال",
  icon:"💻",
  desc:"محصولات دیجیتال"
 },

 shoes:{
  title:"کفش",
  icon:"👟",
  desc:"انواع کفش"
 },

 watches:{
  title:"ساعت",
  icon:"⌚",
  desc:"انواع ساعت"
 }

};


/* =========================
   STORAGE
========================= */

let cart = JSON.parse(localStorage.getItem("mahanCart") || "[]");
let favorites = JSON.parse(localStorage.getItem("mahanFavorites") || "[]");

let tempQty = 1;


/* =========================
   ROUTER
========================= */

function currentPath(){

  let hash = location.hash;

  if(!hash || hash === "#"){
    return "/";
  }

  return decodeURIComponent(hash.substring(1));

}


function go(path){

  if(location.hash === "#" + path){
    render(path);
    return;
  }

  history.pushState({}, "", "#" + path);

  render(path);

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


window.addEventListener("hashchange",()=>{

  render(currentPath());

});


window.addEventListener("popstate",()=>{

  render(currentPath());

});


/* =========================
   HOME
========================= */

function renderHome(){

 return `

 <section class="page">

   <div class="hero">

     <div class="heroText">

       <h1>ماهان سنتر ایران</h1>

       <p>
         یک فروشگاه اینترنتی حرفه‌ای برای خرید
         موبایل، طلا، پوشاک، لوازم جانبی و کالاهای دیجیتال.
       </p>

       <button class="heroBtn" onclick="go('/categories')">
         مشاهده دسته‌بندی‌ها
       </button>

     </div>

   </div>


   <h2 class="homeTitle">
     دسته‌بندی‌های فروشگاه
   </h2>


   <div class="categories">

     ${Object.entries(categories).map(([key,c])=>`

       <div class="category" onclick="go('/category/${key}')">

         <div class="categoryIcon">
           ${c.icon}
         </div>

         <h3>${c.title}</h3>

         <p>${c.desc}</p>

       </div>

     `).join("")}

   </div>

 </section>

 `;

}


/* =========================
   CATEGORIES PAGE
========================= */

function renderCategories(){

 return `

 <section class="page">

   <div class="pageHead">

     <h1>دسته‌بندی محصولات</h1>

   </div>

   <div class="categories">

     ${Object.entries(categories).map(([key,c])=>`

       <div class="category"
            onclick="go('/category/${key}')">

         <div class="categoryIcon">
           ${c.icon}
         </div>

         <h3>${c.title}</h3>

         <p>${c.desc}</p>

       </div>

     `).join("")}

   </div>

 </section>

 `;

}


/* =========================
   PRODUCT CARD
========================= */

function productCard(p){

 const liked = favorites.includes(p.id);

 return `

 <div class="product">

   <div
     class="productImg"
     onclick="go('/product/${p.id}')"
     style="cursor:pointer"
   >
     ${p.icon}
   </div>

   <div class="productBody">

     <div
       class="productName"
       onclick="go('/product/${p.id}')"
       style="cursor:pointer"
     >
       ${p.name}
     </div>

     <div class="productDesc">
       ${p.desc}
     </div>

     <div class="price">

       ${
         p.price
         ? p.price.toLocaleString("fa-IR")+" تومان"
         : "تماس بگیرید"
       }

     </div>

     <div class="productActions">

       <button
         class="addCart"
         onclick="addToCart(${p.id})"
       >
         افزودن به سبد
       </button>

       <button
         class="fav"
         onclick="toggleFavorite(${p.id})"
       >
         ${liked ? "♥" : "♡"}
       </button>

     </div>

   </div>

 </div>

 `;

}


/* =========================
   CATEGORY
========================= */

function renderCategory(key){

 const cat = categories[key];

 if(!cat){
   return renderHome();
 }

 const list = products.filter(p=>p.category === key);

 return `

 <section class="page">

   <div class="pageHead">

     <div>
       <h1>${cat.icon} ${cat.title}</h1>
     </div>

     <button class="backBtn" onclick="go('/categories')">
       ← دسته‌بندی‌ها
     </button>

   </div>


   ${
     list.length

     ? `

       <div class="products">

         ${list.map(productCard).join("")}

       </div>

       `

     : empty("📦","هنوز محصولی در این دسته قرار نگرفته است.")
   }

 </section>

 `;

}


/* =========================
   SEARCH
========================= */

function renderSearch(query){

 const q = query.trim().toLowerCase();

 const result = products.filter(p=>

   p.name.toLowerCase().includes(q) ||
   p.search.toLowerCase().includes(q) ||
   p.desc.toLowerCase().includes(q)

 );

 return `

 <section class="page">

   <div class="pageHead">

     <h1>
       نتایج جستجو برای «${escapeHTML(query)}»
     </h1>

   </div>


   ${
     result.length

     ? `

       <div class="products">

         ${result.map(productCard).join("")}

       </div>

       `

     : empty("🔍","محصولی با این عبارت پیدا نشد.")
   }

 </section>

 `;

}


/* =========================
   PRODUCT
========================= */

function renderProduct(id){

 const p = products.find(x=>x.id == id);

 if(!p){

   return empty("❌","محصول پیدا نشد.");

 }

 tempQty = 1;

 return `

 <section class="page">

   <button class="backBtn"
           onclick="history.back()">
     ← بازگشت
   </button>

   <br><br>

   <div class="detail">

     <div class="detailImg">
       ${p.icon}
     </div>

     <div class="detailInfo">

       <h1>${p.name}</h1>

       <p>${p.desc}</p>

       <div class="detailPrice">

         ${
           p.price
           ? p.price.toLocaleString("fa-IR")+" تومان"
           : "تماس بگیرید"
         }

       </div>


       <div class="quantity">

         <button onclick="changeTempQty(-1)">
           −
         </button>

         <strong id="tempQty">
           1
         </strong>

         <button onclick="changeTempQty(1)">
           +
         </button>

       </div>


       <button
         class="checkout"
         onclick="addToCart(${p.id},tempQty)"
       >
         افزودن به سبد خرید
       </button>

     </div>

   </div>

 </section>

 `;

}


/* =========================
   FAVORITES
========================= */

function renderFavorites(){

 const list = products.filter(p =>
   favorites.includes(p.id)
 );

 return `

 <section class="page">

   <div class="pageHead">
     <h1>❤️ علاقه‌مندی‌ها</h1>
   </div>

   ${
     list.length

     ? `

       <div class="products">
         ${list.map(productCard).join("")}
       </div>

       `

     : empty("♡","هنوز محصولی به علاقه‌مندی‌ها اضافه نکرده‌اید.")
   }

 </section>

 `;

}


/* =========================
   CART
========================= */

function renderCart(){

 if(!cart.length){

   return `

   <section class="page">

     <div class="pageHead">
       <h1>🛒 سبد خرید</h1>
     </div>

     ${empty("🛒","سبد خرید شما خالی است.")}

   </section>

   `;

 }


 let total = 0;


 const list = cart.map(item=>{

   const p = products.find(x=>x.id == item.id);

   if(!p) return "";

   total += (p.price || 0) * item.qty;

   return `

   <div class="cartItem">

     <div class="productImg"
          style="width:80px;height:80px;font-size:35px;border-radius:12px">
       ${p.icon}
     </div>

     <div class="cartInfo">

       <strong>${p.name}</strong>

       <p>
         ${
           p.price
           ? (p.price * item.qty).toLocaleString("fa-IR")+" تومان"
           : "تماس بگیرید"
         }
       </p>

     </div>


     <div class="cartQty">

       <button onclick="changeCart(${p.id},1)">
         +
       </button>

       <strong>${item.qty}</strong>

       <button onclick="changeCart(${p.id},-1)">
         −
       </button>

     </div>


     <button
       class="remove"
       onclick="removeCart(${p.id})"
     >
       حذف
     </button>

   </div>

   `;

 }).join("");


 return `

 <section class="page">

   <div class="pageHead">

     <h1>🛒 سبد خرید</h1>

   </div>


   <div class="cartList">

     ${list}

   </div>


   <div class="cartBottom">

     <div>

       <small>مبلغ کل</small>

       <h2>
         ${
           total
           ? total.toLocaleString("fa-IR")+" تومان"
           : "تماس بگیرید"
         }
       </h2>

     </div>

     <button
       class="checkout"
       onclick="checkout()"
     >
       ادامه خرید و پرداخت
     </button>

   </div>

 </section>

 `;

}

   DISCOUNT
========================= */

 <section class="page">

   <div class="pageHead">

     <h1>🔥 تخفیف‌های ویژه</h1>

/* =========================
   EMPTY
========================= */

function empty(icon,text){

 return `

 <div class="empty">

   <div class="emptyIcon">
     ${icon}
   </div>

   <h3>${text}</h3>

   <p>
     از بخش دسته‌بندی‌ها می‌توانید محصولات را مشاهده کنید.
   </p>

   <br>

   <button
     class="checkout"
     onclick="go('/categories')"
   >
     مشاهده دسته‌بندی‌ها
   </button>

 </div>

 `;

}


/* =========================
   MAIN RENDER
========================= */

function render(path){

 let html = "";


 if(path === "/"){

   html = renderHome();

 }


 else if(path === "/categories"){

   html = renderCategories();

 }


 else if(path.startsWith("/category/")){

   const key = path.split("/")[2];

   html = renderCategory(key);

 }


 else if(path.startsWith("/product/")){

   const id = path.split("/")[2];

   html = renderProduct(id);

 }


 else if(path.startsWith("/search/")){

   const query = path.substring("/search/".length);

   html = renderSearch(query);

 }


 else if(path === "/favorites"){

   html = renderFavorites();

 }


 else if(path === "/cart"){

   html = renderCart();

 }


 else if(path === "/discount"){

   html = renderDiscount();

 }


 else{

   html = renderHome();

 }


 document.getElementById("app").innerHTML = html;

 updateBadges();

}


/* =========================
   SEARCH
========================= */

function searchKey(e){

 if(e.key !== "Enter") return;

 const value = e.target.value.trim();

 if(!value) return;

 go("/search/" + encodeURIComponent(value));

}


/* =========================
   FAVORITES
========================= */

function toggleFavorite(id){

 if(favorites.includes(id)){

   favorites = favorites.filter(x=>x !== id);

   toast("از علاقه‌مندی‌ها حذف شد");

 }else{

   favorites.push(id);

   toast("به علاقه‌مندی‌ها اضافه شد");

 }

 localStorage.setItem(
   "mahanFavorites",
   JSON.stringify(favorites)
 );

 render(currentPath());

}


/* =========================
   CART
========================= */

function addToCart(id,qty=1){

 qty = Number(qty) || 1;

 const item = cart.find(x=>x.id === id);

 if(item){

   item.qty += qty;

 }else{

   cart.push({
     id:id,
     qty:qty
   });

 }

 localStorage.setItem(
   "mahanCart",
   JSON.stringify(cart)
 );

 updateBadges();

 toast("محصول به سبد خرید اضافه شد");

}


function changeCart(id,change){

 const item = cart.find(x=>x.id === id);

 if(!item) return;

 item.qty += change;

 if(item.qty <= 0){

   cart = cart.filter(x=>x.id !== id);

 }

 localStorage.setItem(
   "mahanCart",
   JSON.stringify(cart)
 );

 render("/cart");

}


function removeCart(id){

 cart = cart.filter(x=>x.id !== id);

 localStorage.setItem(
   "mahanCart",
   JSON.stringify(cart)
 );

 render("/cart");

 toast("محصول حذف شد");

}


/* =========================
   DETAIL QUANTITY
========================= */

function changeTempQty(change){

 tempQty += change;

 if(tempQty < 1){
   tempQty = 1;
 }

 const el = document.getElementById("tempQty");

 if(el){
   el.textContent = tempQty;
 }

}


/* =========================
   BADGES
========================= */

function updateBadges(){

 const cartCount = cart.reduce(
   (sum,item)=>sum + item.qty,
   0
 );

 const cartBadge =
   document.getElementById("cartBadge");

 const favBadge =
   document.getElementById("favBadge");

 if(cartBadge){
   cartBadge.textContent = cartCount;
 }

 if(favBadge){
   favBadge.textContent = favorites.length;
 }

}


/* =========================
   TOAST
========================= */

let toastTimer;

function toast(text){

 const el =
   document.getElementById("toast");

 el.textContent = text;

 el.classList.add("show");

 clearTimeout(toastTimer);

 toastTimer = setTimeout(()=>{

   el.classList.remove("show");

 },2500);

}


/* =========================
   CHECKOUT
========================= */

function checkout(){

 alert(
   "بخش پرداخت در مرحله بعدی به سیستم سفارش و پرداخت متصل می‌شود."
 );

}


/* =========================
   SECURITY / TEXT
========================= */

function escapeHTML(text){

 return String(text)
   .replaceAll("&","&amp;")
   .replaceAll("<","&lt;")
   .replaceAll(">","&gt;")
   .replaceAll('"',"&quot;")
   .replaceAll("'","&#039;");

}


/* =========================
   START
========================= */

render(currentPath());

</script>
