<script>

async function loadProducts(){

  try{

    const response = await fetch(
      "https://curly-cherry-da35.amydypiam064.workers.dev/products",
      {
        cache: "no-store"
      }
    );

    if(!response.ok){
      throw new Error("خطای Worker: " + response.status);
    }

    const result = await response.json();

    const firebaseProducts = (result.documents || [])
      .map(doc => {

        const f = doc.fields || {};

        const value = (name, fallback = "") => {

          if(!f[name]){
            return fallback;
          }

          return (
            f[name].stringValue ??
            f[name].integerValue ??
            f[name].doubleValue ??
            f[name].booleanValue ??
            fallback
          );

        };

        const docId =
          doc.name?.split("/").pop() || "";

        return {

          id:
            Number(
              value("code", docId)
            ) || 0,

          cat:
            value("category", "digital"),

          brand:
            value("brand", ""),

          goldCat:
            value("goldCat", ""),

          name:
            value(
              "name",
              "محصول بدون نام"
            ),

          search:
            value(
              "search",
              value("name", "")
            ),

          price:
            Number(
              value("price", 0)
            ) || 0,

          image:
            value("image", ""),

          icon:
            value("icon", "🛍️"),

          desc:
            value("description", ""),

          specs:
            value("specs", ""),

          stock:
            Number(
              value("stock", 0)
            ) || 0,

          discount:
            Number(
              value("discount", 0)
            ) || 0

        };

      });

    firebaseProducts.sort(
      (a,b) => a.id - b.id
    );

    window.products =
      firebaseProducts;

    console.log(
      "تعداد محصولات:",
      firebaseProducts.length
    );

    window.dispatchEvent(
      new Event(
        "firebaseProductsLoaded"
      )
    );

  }catch(error){

    console.error(
      "Products error:",
      error
    );

    window.products = [];

    window.dispatchEvent(
      new CustomEvent(
        "firebaseProductsError",
        {
          detail: error
        }
      )
    );

  }

}

loadProducts();

                  </script>

/* NAV */  
  
function updateActiveNav(){  
  
var route=  
getRoute();  
  
  
document  
.querySelectorAll(".nav a")  
.forEach(a=>{  
  
var r=  
a.dataset.route;  
  
  
a.classList.toggle(  
"active",  
  
r===route ||  
  
(  
r==="/categories" &&  
route.startsWith("/category/")  
)  
  
);  
  
});  
  
}  
  
  
/* HELPERS */  
  
function emptyResult(  
icon,  
text  
){  
  
return `  
  
<div class="no-result">  
  
<div>  
${icon}  
</div>  
  
${escapeHTML(text)}  
  
</div>  
  
`;  
  
}  
  
  
function showToast(message){  
  
var toast=  
document.getElementById(  
"toast"  
);  
  
  
toast.textContent=  
message;  
  
  
toast.classList.add(  
"show"  
);  
  
  
clearTimeout(  
window.toastTimer  
);  
  
  
window.toastTimer=  
setTimeout(  
()=>{  
  
toast.classList.remove(  
"show"  
);  
  
},  
2500  
);  
  
}  
  
  
function escapeHTML(text){  
  
return String(  
text ?? ""  
)  
  
.replace(  
/&/g,  
"&amp;"  
)  
  
.replace(  
/</g,  
"&lt;"  
)  
  
.replace(  
/>/g,  
"&gt;"  
)  
  
.replace(  
/"/g,  
"&quot;"  
)  
  
.replace(  
/'/g,  
"&#039;"  
);  
  
}
