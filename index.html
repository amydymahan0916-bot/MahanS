<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ماهان سنتر ایران</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --red:#e50914;
  --red2:#ff1d2d;
  --bg:#080808;
  --card:#121212;
  --card2:#181818;
  --border:#292929;
  --text:#fff;
  --muted:#999;
}

body{
  font-family:Tahoma,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.7;
}

button,input{
  font-family:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

.container{
  width:92%;
  max-width:1250px;
  margin:auto;
}

/* ================= HEADER ================= */

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(8,8,8,.94);
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--border);
}

.header-main{
  min-height:100px;
  display:flex;
  align-items:center;
  gap:22px;
}

.logo{
  display:flex;
  align-items:center;
  gap:14px;
  min-width:max-content;
}

.logo img{
  width:72px;
  height:72px;
  object-fit:cover;
  border-radius:50%;
  border:2px solid #777;
}

.logo-name{
  font-size:24px;
  font-weight:bold;
}

.logo-name span{
  color:var(--red);
}

.search-box{
  flex:1;
  max-width:600px;
  height:50px;
  display:flex;
  background:#161616;
  border:1px solid #333;
  border-radius:14px;
  overflow:hidden;
}

.search-box input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  background:none;
  color:white;
  padding:0 17px;
  font-size:14px;
}

.search-box button{
  width:60px;
  border:0;
  background:var(--red);
  color:white;
  font-size:23px;
}

.header-actions{
  display:flex;
  gap:9px;
}

.header-btn{
  height:48px;
  min-width:48px;
  padding:0 13px;
  border-radius:13px;
  border:1px solid #333;
  background:#161616;
  color:white;
  position:relative;
}

.header-btn:hover{
  border-color:var(--red);
}

.cart-count{
  position:absolute;
  top:-7px;
  left:-6px;
  width:21px;
  height:21px;
  border-radius:50%;
  background:var(--red);
  color:white;
  font-size:11px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* NAV */

.navbar{
  border-top:1px solid #171717;
}

.nav{
  min-height:50px;
  display:flex;
  align-items:center;
  gap:7px;
  overflow-x:auto;
}

.nav::-webkit-scrollbar{
  display:none;
}

.nav a{
  white-space:nowrap;
  padding:7px 16px;
  border-radius:9px;
  color:#bbb;
  font-size:13px;
}

.nav a:hover,
.nav a.active{
  color:white;
  background:var(--red);
}

/* ================= APP ================= */

#app{
  min-height:70vh;
}

.page{
  padding:30px 0 50px;
  animation:pageIn .2s ease;
}

@keyframes pageIn{
  from{
    opacity:0;
    transform:translateY(7px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

/* ================= HERO ================= */

.hero{
  min-height:370px;
  border:1px solid var(--border);
  border-radius:28px;
  padding:50px;
  display:flex;
  align-items:center;
  overflow:hidden;
  position:relative;
  background:
  radial-gradient(
    circle at 10% 50%,
    rgba(229,9,20,.38),
    transparent 35%
  ),
  linear-gradient(135deg,#191919,#070707);
}

.hero-content{
  position:relative;
  z-index:2;
  max-width:700px;
}

.badge{
  display:inline-block;
  padding:5px 14px;
  background:var(--red);
  border-radius:30px;
  font-size:11px;
  margin-bottom:14px;
}

.hero h1{
  font-size:clamp(32px,5vw,60px);
  line-height:1.3;
  margin-bottom:13px;
}

.hero h1 span{
  color:var(--red);
}

.hero p{
  color:#aaa;
  max-width:600px;
  margin-bottom:15px;
}

.primary-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:0;
  background:var(--red);
  color:white;
  padding:12px 24px;
  border-radius:12px;
  font-weight:bold;
  transition:.2s;
}

.primary-btn:hover{
  background:var(--red2);
  transform:translateY(-2px);
}

.secondary-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:1px solid #333;
  background:#171717;
  color:white;
  padding:11px 20px;
  border-radius:12px;
}

/* ================= SECTION ================= */

.section{
  margin-top:35px;
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.section-head h2{
  font-size:22px;
}

.section-head span{
  color:#888;
  font-size:12px;
}

/* ================= CATEGORIES ================= */

.categories{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:11px;
}

.category{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:17px;
  min-height:125px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:7px;
  transition:.2s;
}

.category:hover{
  border-color:var(--red);
  transform:translateY(-4px);
}

.category-icon{
  font-size:34px;
}

.category-name{
  font-size:12px;
  color:#ddd;
}

/* ================= PRODUCTS ================= */

.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
}

.product-card{
  position:relative;
  overflow:hidden;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  transition:.25s;
}

.product-card:hover{
  transform:translateY(-5px);
  border-color:#555;
}

.product-image{
  height:220px;
  background:#1d1d1d;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:75px;
  overflow:hidden;
}

.product-image img{
  width:100%;
  height:100%;
  object-fit:contain;
  padding:12px;
}

.product-info{
  padding:15px;
}

.product-title{
  font-size:15px;
  margin-bottom:5px;
}

.product-desc{
  color:#888;
  font-size:11px;
  min-height:35px;
}

.product-price{
  font-size:16px;
  font-weight:bold;
  margin-top:10px;
}

.product-price small{
  color:#888;
  font-size:10px;
  font-weight:normal;
}

.product-actions{
  display:flex;
  gap:8px;
  margin-top:13px;
}

.product-actions button{
  flex:1;
  padding:9px;
  border-radius:10px;
  border:1px solid #333;
  background:#1b1b1b;
  color:white;
}

.product-actions .buy{
  background:var(--red);
  border-color:var(--red);
}

.favorite{
  position:absolute;
  top:10px;
  left:10px;
  width:38px;
  height:38px;
  border-radius:50%;
  border:1px solid #333;
  background:rgba(0,0,0,.7);
  color:white;
  font-size:17px;
  z-index:2;
}

.favorite.active{
  color:#ff3440;
}

/* ================= OFFER ================= */

.offer{
  margin-top:35px;
  padding:28px;
  border:1px solid #63151a;
  border-radius:20px;
  background:
  linear-gradient(
    100deg,
    #280306,
    #151515
  );
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.offer h2{
  margin-bottom:5px;
}

.offer p{
  color:#999;
  font-size:13px;
}

/* ================= PAGE TITLE ================= */

.page-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:25px;
}

.page-title h1{
  font-size:29px;
}

.page-title p{
  color:#888;
  font-size:12px;
}

/* ================= FILTER ================= */

.filters{
  display:flex;
  gap:9px;
  margin-bottom:20px;
  overflow-x:auto;
}

.filters::-webkit-scrollbar{
  display:none;
}

.filter{
  border:1px solid #333;
  background:#151515;
  color:#bbb;
  border-radius:10px;
  padding:8px 15px;
  white-space:nowrap;
}

.filter.active,
.filter:hover{
  background:var(--red);
  border-color:var(--red);
  color:white;
}

/* ================= PRODUCT PAGE ================= */

.product-detail{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:30px;
  background:#101010;
  border:1px solid var(--border);
  border-radius:24px;
  padding:25px;
}

.detail-image{
  min-height:430px;
  border-radius:18px;
  background:#1b1b1b;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:150px;
  overflow:hidden;
}

.detail-image img{
  width:100%;
  height:100%;
  max-height:500px;
  object-fit:contain;
  padding:20px;
}

.detail-info{
  padding:20px 5px;
}

.detail-info h1{
  font-size:32px;
  margin-bottom:10px;
}

.detail-desc{
  color:#999;
  margin-bottom:25px;
}

.detail-price{
  font-size:26px;
  font-weight:bold;
  margin-bottom:20px;
}

.detail-price small{
  font-size:12px;
  color:#888;
}

.product-specs{
  margin:20px 0;
  border:1px solid var(--border);
  border-radius:15px;
  overflow:hidden;
}

.product-specs-title{
  padding:13px 15px;
  background:#171717;
  font-weight:bold;
}

.product-specs-text{
  padding:15px;
  color:#aaa;
  font-size:13px;
  line-height:2;
}

.quantity{
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}

.quantity button{
  width:40px;
  height:40px;
  border:1px solid #333;
  background:#191919;
  color:white;
  border-radius:9px;
  font-size:18px;
}

.quantity strong{
  min-width:25px;
  text-align:center;
}

/* ================= CART ================= */

.cart-page{
  max-width:900px;
  margin:auto;
}

.cart-item{
  display:flex;
  align-items:center;
  gap:15px;
  padding:15px;
  margin-bottom:10px;
  border:1px solid var(--border);
  background:var(--card);
  border-radius:15px;
}

.cart-icon{
  width:75px;
  height:75px;
  border-radius:12px;
  background:#202020;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:35px;
  overflow:hidden;
}

.cart-icon img{
  width:100%;
  height:100%;
  object-fit:contain;
  padding:8px;
}

.cart-item-info{
  flex:1;
}

.cart-item-info h3{
  font-size:14px;
}

.cart-item-info p{
  color:#888;
  font-size:11px;
}

.qty{
  display:flex;
  align-items:center;
  gap:7px;
}

.qty button{
  width:31px;
  height:31px;
  border-radius:8px;
  border:1px solid #333;
  background:#1c1c1c;
  color:white;
}

.remove{
  border:0;
  background:none;
  color:#888;
  font-size:18px;
}

.cart-summary{
  margin-top:20px;
  padding:22px;
  background:#121212;
  border:1px solid var(--border);
  border-radius:17px;
}

.summary-row{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
}

.summary-row.total{
  padding-top:13px;
  border-top:1px solid #292929;
  font-size:19px;
  font-weight:bold;
}

/* ================= SEARCH ================= */

.search-results{
  margin-top:10px;
}

.no-result{
  text-align:center;
  padding:80px 10px;
  color:#888;
}

.no-result div{
  font-size:55px;
  margin-bottom:10px;
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  bottom:25px;
  right:25px;
  z-index:3000;
  background:#171717;
  border:1px solid #333;
  border-right:4px solid var(--red);
  border-radius:13px;
  padding:13px 17px;
  box-shadow:0 15px 40px #000;
  transform:translateY(100px);
  opacity:0;
  transition:.3s;
  pointer-events:none;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

/* ================= FOOTER ================= */

footer{
  margin-top:50px;
  padding:35px 0;
  background:#060606;
  border-top:1px solid var(--border);
}

.footer-grid{
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  gap:30px;
}

footer h3{
  margin-bottom:10px;
}

footer p,
footer a{
  color:#888;
  font-size:12px;
}

.copy{
  margin-top:25px;
  padding-top:18px;
  text-align:center;
  border-top:1px solid #202020;
  color:#666;
  font-size:11px;
}

/* ================= MOBILE ================= */

@media(max-width:950px){

  .categories{
    grid-template-columns:repeat(4,1fr);
  }

  .products{
    grid-template-columns:repeat(2,1fr);
  }

  .header-main{
    flex-wrap:wrap;
    padding:10px 0;
  }

  .search-box{
    order:3;
    flex-basis:100%;
    max-width:none;
  }

  .product-detail{
    grid-template-columns:1fr;
  }
}

@media(max-width:600px){

  .container{
    width:94%;
  }

  .logo img{
    width:58px;
    height:58px;
  }

  .logo-name{
    font-size:18px;
  }

  .header-actions{
    margin-right:auto;
  }

  .header-btn{
    min-width:43px;
    padding:0 8px;
  }

  .hero{
    min-height:310px;
    padding:30px 22px;
  }

  .hero h1{
    font-size:33px;
  }

  .categories{
    grid-template-columns:repeat(4,1fr);
    gap:7px;
  }

  .category{
    min-height:100px;
  }

  .category-icon{
    font-size:25px;
  }

  .category-name{
    font-size:9px;
  }

  .products{
    gap:9px;
  }

  .product-image{
    height:155px;
    font-size:52px;
  }

  .product-info{
    padding:10px;
  }

  .product-title{
    font-size:13px;
  }

  .product-desc{
    font-size:9px;
  }

  .product-price{
    font-size:13px;
  }

  .product-actions{
    flex-direction:column;
  }

  .offer{
    flex-direction:column;
    align-items:flex-start;
  }

  .footer-grid{
    grid-template-columns:1fr;
  }

  .detail-image{
    min-height:270px;
    font-size:100px;
  }

  .detail-info h1{
    font-size:24px;
  }

  .cart-item{
    flex-wrap:wrap;
  }

  .cart-item-info{
    min-width:calc(100% - 95px);
  }

}
</style>
</head>

</div>

</header>

<div id="app"></div>

<div id="toast" class="toast"></div>

<footer>

);

updateCartCount();

/* =====================================================
   ROUTER
===================================================== */

function go(path){

history.pushState(
{},
"",
"#"+path
);

render(path);

window.scrollTo({
top:0,
behavior:"smooth"
});

}

window.addEventListener(
"popstate",
()=>{
render(getRoute());
}
);

window.addEventListener(
"hashchange",
()=>{
render(getRoute());
}
);

function getRoute(){

let hash=
location.hash.substring(1);

if(!hash){
return "/";
}

return hash;

}


/* =====================================================
   RENDER
===================================================== */

function render(route){

if(!route){
route="/";
}

if(route==="/"){

renderHome();

}

else if(route==="/categories"){

renderCategories();

}

else if(route==="/discount"){

renderDiscount();

}

else if(route==="/favorites"){

renderFavorites();

}

else if(route==="/cart"){

renderCart();

}

else if(route.startsWith("/category/")){

let cat=
route.split("/")[2];

renderCategory(cat);

}

else if(route.startsWith("/product/")){

let id=
Number(route.split("/")[2]);

renderProduct(id);

}

else if(route.startsWith("/search/")){

let q=
decodeURIComponent(
route.split("/search/")[1]
);

renderSearch(q);

}

updateActiveNav();

}

function addToCart(id,qty=1){

let p=
products.find(
x=>x.id===id
);

if(!p){
return;
}

let item=
cart.find(
x=>x.id===id
);

if(item){

item.qty+=qty;

}else{

cart.push({
id:id,
qty:qty
});

}

saveData();

showToast(
p.name+" به سبد خرید اضافه شد 🛒"
);

}

0
);

}

}

function cartQty(id,amount){

let item=
cart.find(
x=>x.id===id
);

if(!item){
return;
}

item.qty+=amount;

if(item.qty<=0){

cart=
cart.filter(
x=>x.id!==id
);

}

saveData();

renderCart();

}


function removeFromCart(id){

cart=
cart.filter(
x=>x.id!==id
);

saveData();

renderCart();

showToast("محصول از سبد حذف شد");

}

a.dataset.route===route
);

/* =====================================================
   TOAST
===================================================== */

let toastTimer;

function showToast(message){

let toast=
document.getElementById("toast");

toast.innerText=message;

toast.classList.add("show");

clearTimeout(toastTimer);

toastTimer=
setTimeout(
()=>{
toast.classList.remove("show");
},
2500
);

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(text){

return String(text)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}
