<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ماهان سنتر ایران</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --green:#19d66b;
    --green2:#0fb957;
    --red:#e50914;
    --red2:#ff1d2d;
    --redDark:#b90710;
    --yellow:#ffc400;
    --bg:#070707;
    --card:#111111;
    --card2:#181818;
    --border:#292929;
    --text:#fff;
    --muted:#999;
}

html{
    scroll-behavior:smooth;
    min-height:100%;
    overflow-y:auto;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:
        radial-gradient(circle at top right,rgba(25,214,107,.035),transparent 30%),
        radial-gradient(circle at bottom left,rgba(229,9,20,.025),transparent 28%),
        var(--bg);
    color:var(--text);
    line-height:1.7;
    min-height:100vh;
    height:auto;
    overflow-x:hidden;
    overflow-y:auto;
}

button,input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

a{
    color:inherit;
    text-decoration:none;
}

.container{
    width:92%;
    max-width:1250px;
    margin:auto;
}

/* =========================
HEADER
========================= */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(7,7,7,.96);
    backdrop-filter:blur(18px);
    border-bottom:1px solid var(--border);
}

.header-main{
    min-height:100px;
    display:flex;
    align-items:center;
    gap:22px;
}

.logo{
    display:flex;
    align-items:center;
    gap:14px;
    min-width:max-content;
}

.logo img{
    width:72px;
    height:72px;
    object-fit:cover;
    border-radius:50%;
    border:3px solid var(--green);
    box-shadow:
        0 0 0 3px rgba(25,214,107,.08),
        0 0 20px rgba(25,214,107,.18);
}

.logo-name{
    font-size:24px;
    font-weight:bold;
}

.logo-name span{
    color:var(--red);
}

.search-box{
    flex:1;
    max-width:600px;
    height:50px;
    display:flex;
    background:#161616;
    border:1px solid #333;
    border-radius:15px;
    overflow:hidden;
    transition:.25s;
}

.search-box:focus-within{
    border-color:var(--red);
    box-shadow:0 0 0 3px rgba(229,9,20,.08);
}

.search-box input{
    flex:1;
    min-width:0;
    border:0;
    outline:0;
    background:none;
    color:white;
    padding:0 17px;
    font-size:14px;
}

.search-box button{
    width:60px;
    border:0;
    background:var(--red);
    color:white;
    font-size:26px;
    font-weight:bold;
    transition:.2s;
}

.search-box button:hover{
    background:var(--red2);
}

.header-actions{
    display:flex;
    gap:9px;
}

.header-btn{
    height:48px;
    min-width:50px;
    padding:0 13px;
    border-radius:14px;
    border:1px solid #333;
    background:#151515;
    color:white;
    position:relative;
    font-size:20px;
    transition:.2s;
}

.header-btn:hover{
    border-color:var(--red);
    color:var(--red);
    transform:translateY(-2px);
}

.cart-count{
    position:absolute;
    top:-7px;
    left:-6px;
    width:21px;
    height:21px;
    border-radius:50%;
    background:var(--red);
    color:white;
    font-size:11px;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* =========================
NAV
========================= */

.navbar{
    border-top:1px solid #171717;
}

.nav{
    min-height:60px;
    display:flex;
    align-items:center;
    gap:8px;
    overflow-x:auto;
    padding:6px 0;
}

.nav::-webkit-scrollbar{
    display:none;
}

.nav a{
    white-space:nowrap;
    padding:9px 18px;
    border-radius:15px;
    color:#bbb;
    font-size:13px;
    border:1px solid transparent;
    transition:.25s;
    background:linear-gradient(135deg,#151515,#0e0e0e);
}

.nav a:nth-child(1){
    border-radius:20px 8px 20px 8px;
}

.nav a:nth-child(2){
    border-radius:8px 20px 8px 20px;
}

.nav a:nth-child(3){
    border-radius:20px 8px 20px 8px;
}

.nav a:nth-child(4){
    border-radius:8px 20px 8px 20px;
}

.nav a:nth-child(5){
    border-radius:20px 8px 20px 8px;
}

.nav a:hover{
    color:white;
    background:var(--red);
    border-color:var(--red);
    transform:translateY(-2px);
}

.nav a.active{
    color:white;
    background:linear-gradient(135deg,var(--green),var(--green2));
    border-color:var(--green);
}

/* =========================
APP
========================= */

#app{
    min-height:70vh;
}

.page{
    padding:30px 0 50px;
    animation:pageIn .22s ease;
}

@keyframes pageIn{
    from{
        opacity:0;
        transform:translateY(7px);
    }
    to{
        opacity:1;
        transform:none;
    }
}

/* =========================
HOME
========================= */

.home-intro{
    min-height:calc(100vh - 180px);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.home-box{
    width:100%;
    max-width:850px;
    padding:38px 40px;
    border:1px solid #252525;
    border-radius:30px;
    background:
        radial-gradient(circle at 50% 0%,rgba(25,214,107,.10),transparent 45%),
        radial-gradient(circle at 100% 100%,rgba(229,9,20,.07),transparent 35%),
        linear-gradient(145deg,#151515,#090909);
    box-shadow:0 25px 80px rgba(0,0,0,.4);
}

.home-logo-small{
    width:78px;
    height:78px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid var(--green);
    margin-bottom:12px;
    box-shadow:0 0 30px rgba(25,214,107,.18);
}

.home-box h1{
    font-size:clamp(26px,5vw,43px);
    margin-bottom:12px;
}

.home-box h1 span{
    color:var(--green);
}

.home-box h1 span::after{
    content:"";
}

.home-description{
    max-width:720px;
    margin:auto;
    color:#aaa;
    font-size:14px;
    line-height:2;
}

.stats{
    margin:20px auto 0;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
    max-width:650px;
}

.stat{
    background:linear-gradient(145deg,#131313,#0b0b0b);
    border:1px solid #292929;
    border-radius:15px;
    padding:10px 8px;
    position:relative;
    overflow:hidden;
}

.stat::before{
    content:"";
    position:absolute;
    top:0;
    right:0;
    left:0;
    height:2px;
    background:linear-gradient(90deg,var(--green),var(--red));
}

.stat strong{
    display:block;
    font-size:20px;
    color:var(--green);
    line-height:1.3;
}

.stat:nth-child(2) strong{
    color:var(--red);
}

.stat:nth-child(3) strong{
    color:#fff;
}

.stat span{
    font-size:10px;
    color:#888;
}

/* =========================
SECTION
========================= */

.section{
    margin-top:35px;
}

.section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
}

.section-head h2{
    font-size:22px;
}

.section-head span{
    color:#888;
    font-size:12px;
}

/* =========================
CATEGORIES
========================= */

.categories{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.category{
    min-height:180px;
    position:relative;
    overflow:hidden;
    background:#111;
    border:1px solid #292929;
    border-radius:24px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    padding:20px;
    transition:.25s;
}

.category:hover{
    transform:translateY(-5px);
    border-color:var(--green);
    box-shadow:0 15px 35px rgba(0,0,0,.35);
}

.category-image{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:.55;
    transition:.3s;
}

.category:hover .category-image{
    transform:scale(1.05);
    opacity:.68;
}

.category-overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(to top,rgba(0,0,0,.92),rgba(0,0,0,.15));
}

.category-content{
    position:relative;
    z-index:2;
    text-align:center;
}

.category-icon{
    font-size:38px;
    margin-bottom:3px;
}

.category-name{
    font-size:16px;
    font-weight:bold;
}

.category-sub{
    color:#aaa;
    font-size:10px;
}

/* =========================
PRODUCTS - ADVANCED
========================= */

.products{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.product-card{
    position:relative;
    overflow:hidden;
    background:
        linear-gradient(145deg,#151515,#0c0c0c);
    border:1px solid #292929;
    border-radius:23px;
    transition:.3s;
    box-shadow:0 10px 25px rgba(0,0,0,.18);
}

.product-card::before{
    content:"";
    position:absolute;
    top:0;
    right:12%;
    left:12%;
    height:2px;
    background:linear-gradient(
        90deg,
        transparent,
        var(--green),
        var(--red),
        transparent
    );
    opacity:.45;
    z-index:2;
}

.product-card:hover{
    transform:translateY(-8px);
    border-color:#444;
    box-shadow:
        0 20px 45px rgba(0,0,0,.45),
        0 0 25px rgba(25,214,107,.05);
}

.product-image{
    height:235px;
    background:
        radial-gradient(circle at center,rgba(255,255,255,.04),transparent 55%),
        #101010;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    border-bottom:1px solid #242424;
}

.product-image::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
        to bottom,
        transparent 55%,
        rgba(0,0,0,.22)
    );
    pointer-events:none;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:contain;
    padding:14px;
    transition:.35s;
}

.product-card:hover .product-image img{
    transform:scale(1.06);
}

.product-image > span{
    font-size:75px;
    opacity:.8;
}

.image-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:35px;
    height:35px;
    border-radius:50%;
    border:1px solid #555;
    background:rgba(0,0,0,.78);
    color:white;
    z-index:8;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.2s;
}

.image-arrow:hover{
    background:var(--red);
    border-color:var(--red);
}

.image-arrow.right{
    right:9px;
}

.image-arrow.left{
    left:9px;
}

.image-number{
    position:absolute;
    bottom:9px;
    right:50%;
    transform:translateX(50%);
    background:rgba(0,0,0,.8);
    border:1px solid #444;
    border-radius:20px;
    padding:2px 9px;
    font-size:9px;
    color:#ddd;
    z-index:10;
}

.favorite{
    position:absolute;
    top:11px;
    left:11px;
    width:40px;
    height:40px;
    border-radius:50%;
    border:1px solid #444;
    background:rgba(0,0,0,.8);
    color:white;
    font-size:19px;
    z-index:20;
    transition:.2s;
}

.favorite:hover{
    border-color:var(--red);
    color:var(--red);
    transform:scale(1.08);
}

.favorite.active{
    color:var(--red2);
    border-color:var(--red);
}

.product-info{
    padding:14px 15px 8px;
}

.product-title{
    font-size:15px;
    font-weight:bold;
    margin-bottom:5px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.product-desc{
    color:#777;
    font-size:10px;
    min-height:32px;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.price-area{
    margin-top:11px;
}

.old-price{
    color:#666;
    font-size:10px;
    text-decoration:line-through;
}

.final-price{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:5px;
    margin-top:3px;
}

.final-price strong{
    font-size:17px;
    color:#fff;
}

.final-price small{
    color:#888;
    font-size:9px;
}

.discount-label{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,var(--red),var(--red2));
    color:white;
    border-radius:8px;
    padding:3px 7px;
    font-size:9px;
    font-weight:bold;
    box-shadow:0 5px 15px rgba(229,9,20,.16);
}

.stock-badge{
    display:inline-flex;
    align-items:center;
    margin-top:9px;
    padding:4px 8px;
    border-radius:8px;
    font-size:9px;
    font-weight:bold;
    background:#151515;
    border:1px solid #292929;
}

.stock-badge.green{
    color:var(--green);
    border-color:rgba(25,214,107,.22);
}

.stock-badge.yellow{
    color:var(--yellow);
    border-color:rgba(255,196,0,.22);
}

.stock-badge.red{
    color:var(--red2);
    border-color:rgba(229,9,20,.3);
}

.product-actions{
    display:grid;
    grid-template-columns:.8fr 1.5fr;
    gap:8px;
    margin-top:8px;
    padding:0 15px 15px;
}

.product-actions button{
    padding:10px 7px;
    border-radius:11px;
    border:1px solid #333;
    background:#1b1b1b;
    color:white;
    transition:.2s;
    font-size:11px;
}

.product-actions button:first-child:hover{
    border-color:var(--green);
    color:var(--green);
}

.product-actions .buy{
    background:linear-gradient(
        135deg,
        var(--red),
        var(--red2)
    );
    color:white;
    border-color:var(--red);
    font-weight:bold;
    box-shadow:0 7px 18px rgba(229,9,20,.14);
}

.product-actions .buy:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 22px rgba(229,9,20,.25);
}

.product-actions .buy:disabled{
    background:#292929;
    border-color:#333;
    color:#777;
    box-shadow:none;
    cursor:not-allowed;
}

/* =========================
FILTER
========================= */

.filters{
    display:flex;
    gap:9px;
    margin-bottom:20px;
    overflow-x:auto;
}

.filters::-webkit-scrollbar{
    display:none;
}

.filter{
    border:1px solid #333;
    background:#151515;
    color:#bbb;
    border-radius:12px;
    padding:9px 15px;
    white-space:nowrap;
    transition:.2s;
}

.filter.active,
.filter:hover{
    background:var(--green);
    border-color:var(--green);
    color:#06120a;
}

/* =========================
PRODUCT DETAIL
========================= */

.product-detail{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:30px;
    background:#101010;
    border:1px solid var(--border);
    border-radius:26px;
    padding:25px;
}

.detail-gallery{
    min-height:500px;
    position:relative;
    border-radius:20px;
    background:
        radial-gradient(circle,rgba(255,255,255,.04),transparent 60%),
        #151515;
    overflow:hidden;
}

.detail-gallery-main{
    width:100%;
    height:100%;
    min-height:500px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.detail-gallery-main img{
    width:100%;
    height:100%;
    max-height:500px;
    object-fit:contain;
    padding:20px;
}

.detail-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:44px;
    height:44px;
    border-radius:50%;
    background:rgba(0,0,0,.78);
    color:white;
    border:1px solid #555;
    z-index:5;
    font-size:20px;
}

.detail-arrow:hover{
    background:var(--red);
    border-color:var(--red);
}

.detail-arrow.right{
    right:12px;
}

.detail-arrow.left{
    left:12px;
}

.detail-dots{
    position:absolute;
    bottom:14px;
    right:50%;
    transform:translateX(50%);
    display:flex;
    gap:5px;
}

.detail-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#555;
}

.detail-dot.active{
    background:var(--red);
}

.detail-info{
    padding:20px 5px;
}

.detail-info h1{
    font-size:32px;
    margin-bottom:10px;
}

.detail-desc{
    color:#999;
    margin-bottom:25px;
}

.detail-price{
    font-size:26px;
    font-weight:bold;
    margin-bottom:8px;
}

.detail-discount{
    color:var(--red2);
    font-size:13px;
    margin-bottom:20px;
}

.detail-stock{
    padding:12px 15px;
    border-radius:13px;
    background:#151515;
    border:1px solid #292929;
    margin-bottom:20px;
    font-size:13px;
    font-weight:bold;
}

.product-specs{
    margin:20px 0;
    border:1px solid var(--border);
    border-radius:15px;
    overflow:hidden;
}

.product-specs-title{
    padding:13px 15px;
    background:#171717;
    font-weight:bold;
    border-right:3px solid var(--green);
}

.product-specs-text{
    padding:15px;
    color:#aaa;
    font-size:13px;
    line-height:2;
}

.quantity{
    display:flex;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
}

.quantity button{
    width:40px;
    height:40px;
    border:1px solid #333;
    background:#191919;
    color:white;
    border-radius:9px;
    font-size:18px;
}

.quantity button:hover{
    border-color:var(--red);
    color:var(--red);
}

.quantity strong{
    min-width:25px;
    text-align:center;
}

/* =========================
BUTTONS
========================= */

.primary-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border:0;
    background:linear-gradient(135deg,var(--red),var(--red2));
    color:white;
    padding:12px 24px;
    border-radius:13px;
    font-weight:bold;
    transition:.2s;
    box-shadow:0 8px 22px rgba(229,9,20,.15);
}

.primary-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 27px rgba(229,9,20,.25);
}

.primary-btn:disabled{
    background:#292929;
    color:#777;
    box-shadow:none;
    cursor:not-allowed;
}

.secondary-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border:1px solid #333;
    background:#171717;
    color:white;
    padding:11px 20px;
    border-radius:12px;
}

.secondary-btn:hover{
    border-color:var(--green);
    color:var(--green);
}

/* =========================
OFFER
========================= */

.offer{
    margin-top:35px;
    padding:28px;
    border:1px solid #194d31;
    border-radius:20px;
    background:
        linear-gradient(100deg,#071b10,#151515);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.offer h2{
    margin-bottom:5px;
}

.offer p{
    color:#999;
    font-size:13px;
}

/* =========================
PAGE TITLE
========================= */

.page-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:25px;
}

.page-title h1{
    font-size:29px;
}

.page-title p{
    color:#888;
    font-size:12px;
}

/* =========================
CART
========================= */

.cart-page{
    max-width:900px;
    margin:auto;
}

.cart-item{
    display:flex;
    align-items:center;
    gap:15px;
    padding:15px;
    margin-bottom:10px;
    border:1px solid var(--border);
    background:var(--card);
    border-radius:15px;
}

.cart-icon{
    width:75px;
    height:75px;
    border-radius:12px;
    background:#202020;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:35px;
    overflow:hidden;
}

.cart-icon img{
    width:100%;
    height:100%;
    object-fit:contain;
    padding:8px;
}

.cart-item-info{
    flex:1;
}

.cart-item-info h3{
    font-size:14px;
}

.cart-item-info p{
    color:var(--green);
    font-size:11px;
}

.qty{
    display:flex;
    align-items:center;
    gap:7px;
}

.qty button{
    width:31px;
    height:31px;
    border-radius:8px;
    border:1px solid #333;
    background:#1c1c1c;
    color:white;
}

.qty button:hover{
    border-color:var(--red);
    color:var(--red);
}

.remove{
    border:0;
    background:none;
    color:#888;

async function loadProducts(){

try{

const response=await fetch(
"https://curly-cherry-da35.amydypiam064.workers.dev/products",
{
cache:"no-store"
}
);

if(!response.ok){
throw new Error("خطای Worker: "+response.status);
}

const result=await response.json();

const firebaseProducts=(result.documents||[]).map(doc=>{

const f=doc.fields||{};

const value=(name,fallback="")=>{

if(!f[name]) return fallback;

return(
f[name].stringValue ??
f[name].integerValue ??
f[name].doubleValue ??
f[name].booleanValue ??
fallback
);

};

const docId=doc.name?.split("/").pop()||"";

return{

id:Number(value("code",docId))||0,

cat:value("category","digital"),

brand:value("brand",""),

goldCat:value("goldCat",""),

name:value("name","محصول بدون نام"),

search:value("search",value("name","")),

price:Number(value("price",0))||0,

image:value("image",""),

image2:value("image2",""),

image3:value("image3",""),

icon:value("icon","🛍️"),

desc:value("description",""),

specs:value("specs",""),

stock:Number(value("stock",0))||0,

discount:Number(value("discount",0))||0,

createdAt:value("createdAt","")

};

});

firebaseProducts.sort((a,b)=>a.id-b.id);

window.products=firebaseProducts;

console.log(
"تعداد محصولات:",
firebaseProducts.length
);

window.dispatchEvent(
new Event("firebaseProductsLoaded")
);

}catch(error){

console.error("Products error:",error);

window.products=[];

window.dispatchEvent(
new CustomEvent(
"firebaseProductsError",
{detail:error}
)
);

}

}

loadProducts();

</script>

/* =========================

function sortProducts(list){

var arr=[...list];

if(currentSort==="newest"){
arr.sort((a,b)=>b.id-a.id);
}

else if(currentSort==="oldest"){
arr.sort((a,b)=>a.id-b.id);
}

else if(currentSort==="cheap"){
arr.sort(
(a,b)=>getFinalPrice(a)-getFinalPrice(b)
);
}

else if(currentSort==="expensive"){
arr.sort(
(a,b)=>getFinalPrice(b)-getFinalPrice(a)
);
}

else if(currentSort==="discount"){
arr.sort(
(a,b)=>Number(b.discount||0)-Number(a.discount||0)
);
}

return arr;

}

function getFinalPrice(p){

var price=Number(p.price||0);
var discount=Number(p.discount||0);

return discount>0
?
Math.round(
price-(price*discount/100)
)
:
price;

}

/* =========================

========================= */

function getProductImages(p){

var images=[
p.image,
p.image2,
p.image3
].filter(Boolean);

if(!images.length)
return [""];

return images.slice(0,3);

}

function productImageHTML(p){

var images=getProductImages(p);
var first=images[0];

if(!first){

return `

<div class="product-image">

<span>
${escapeHTML(p.icon||"🛍️")}
</span>

</div>

`;

}

var arrows=
images.length>1
?
`

<button
class="image-arrow right"
onclick="event.preventDefault();event.stopPropagation();changeCardImage(${p.id},1)"
>
›
</button>

<button
class="image-arrow left"
onclick="event.preventDefault();event.stopPropagation();changeCardImage(${p.id},-1)"
>
‹
</button>

<div
class="image-number"
id="cardImageNumber-${p.id}"
>
1 / ${images.length}
</div>

`
:
"";

return `

<div
class="product-image"
id="productImage-${p.id}"
>

<img
id="cardImg-${p.id}"
src="${escapeHTML(first)}"
alt="${escapeHTML(p.name)}"
onerror="
this.style.display='none';
this.parentElement.innerHTML='<span>${escapeHTML(
p.icon||"🛍️"
)}</span>'
"
>

${arrows}

</div>

`;

}

var cardImageIndexes={};

function changeCardImage(id,amount){

var p=products.find(x=>x.id===id);

if(!p)
return;

var images=getProductImages(p);

if(images.length<=1)
return;

if(cardImageIndexes[id]===undefined)
cardImageIndexes[id]=0;

cardImageIndexes[id]+=amount;

if(cardImageIndexes[id]<0)
cardImageIndexes[id]=images.length-1;

if(cardImageIndexes[id]>=images.length)
cardImageIndexes[id]=0;

var img=document.getElementById(
"cardImg-"+id
);

var number=document.getElementById(
"cardImageNumber-"+id
);

if(img){
img.src=
images[cardImageIndexes[id]];
}

if(number){

number.textContent=
(cardImageIndexes[id]+1)+
" / "+
images.length;

}

}

function addToCart(id,qty){

qty=Number(qty||1);

var p=products.find(x=>x.id===id);

if(!p)
return;

if(Number(p.stock||0)<=0){

showToast(
"این محصول موجود نیست"
);

return;

}

var item=cart.find(x=>x.id===id);

var currentQty=
item
?
Number(item.qty||0)
:
0;

if(
currentQty+qty>
Number(p.stock||0)
){

showToast(
"تعداد انتخابی بیشتر از موجودی است"
);

return;

}

if(item){

item.qty+=qty;

}else{

cart.push({
id:id,
qty:qty
});

}

saveData();

showToast(
"محصول به سبد خرید اضافه شد"
);

}

function updateCartCount(){

var count=cart.reduce(
(sum,item)=>
sum+Number(item.qty||0),
0
);

var el=document.getElementById(
"cartCount"
);

if(el)
el.textContent=count;

var floating=document.getElementById(
"floatingCartCount"
);

if(floating)
floating.textContent=count;

}

function cartQty(id,amount){

var item=cart.find(
x=>x.id===id
);

if(!item)
return;

var p=products.find(
x=>x.id===id
);

item.qty+=amount;

if(p){

if(
item.qty>
Number(p.stock||0)
){

item.qty=
Number(p.stock||0);

}

}

if(item.qty<1){

cart=cart.filter(
x=>x.id!==id
);

}

saveData();

renderCart();

}

function removeFromCart(id){

cart=cart.filter(
x=>x.id!==id
);

saveData();

renderCart();

showToast(
"محصول از سبد حذف شد"
);

}

navigator.clipboard.writeText(
text
).then(()=>{

showToast(
"کپی شد ✓"
);

}).catch(()=>{

fallbackCopy(text);

});

}else{

fallbackCopy(text);

}

}

function fallbackCopy(text){

var area=document.createElement(
"textarea"
);

area.value=text;

document.body.appendChild(area);

area.select();

document.execCommand("copy");

area.remove();

showToast(
"کپی شد ✓"
);

}

/* =========================
NAV
========================= */

function updateActiveNav(){

var route=getRoute();

document
.querySelectorAll(".nav a")
.forEach(a=>{

var r=a.dataset.route;

a.classList.toggle(
"active",

r===route||

(
r==="/categories"&&
route.startsWith("/category/")
)

);

});

}

/* =========================
HELPERS
========================= */

function emptyResult(icon,text){

return `

<div class="no-result">

<div>
${icon}
</div>

${escapeHTML(text)}

</div>

`;

}

function showToast(message){

var toast=document.getElementById(
"toast"
);

if(!toast)
return;

toast.textContent=message;

toast.classList.add("show");

clearTimeout(
window.toastTimer
);

window.toastTimer=setTimeout(
()=>{
toast.classList.remove("show");
},
2500
);

}

function escapeHTML(text){

return String(text??"")

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}
