<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>ماهان سنتر ایران</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#050505;
    --card:#0c0c0c;
    --card2:#111;
    --green:#19d66b;
    --red:#ff3030;
    --gold:#ffd43b;
    --text:#fff;
    --muted:#aaa;
    --border:rgba(255,255,255,.08);
}

html{
    scroll-behavior:smooth;
    min-height:100%;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:
        radial-gradient(circle at top right,rgba(25,214,107,.035),transparent 30%),
        var(--bg);
    color:var(--text);
    line-height:1.7;
    min-height:100vh;
    overflow-x:hidden;
}

button,
input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

a{
    color:inherit;
    text-decoration:none;
}

.container{
    width:min(1200px,94%);
    margin:auto;
}

/* HEADER */
header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(5,5,5,.94);
    backdrop-filter:blur(15px);
    border-bottom:1px solid var(--border);
}

.header-main{
    min-height:78px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:max-content;
}

.logo{
    width:52px;
    height:52px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid var(--green);
    box-shadow:0 0 18px rgba(25,214,107,.25);
}

.brand-name{
    font-size:20px;
    font-weight:900;
    white-space:nowrap;
}

.brand-green{
    color:var(--green);
}

.brand-red{
    color:var(--red);
}

.search-box{
    flex:1;
    max-width:500px;
    position:relative;
}

.search-box input{
    width:100%;
    height:45px;
    border:1px solid var(--border);
    border-radius:14px;
    background:#0d0d0d;
    color:#fff;
    outline:none;
    padding:0 45px 0 15px;
    transition:.25s;
}

.search-box input:focus{
    border-color:var(--green);
    box-shadow:0 0 15px rgba(25,214,107,.1);
}

.search-icon{
    position:absolute;
    right:15px;
    top:8px;
    font-size:23px;
    color:var(--green);
}

.header-actions{
    display:flex;
    align-items:center;
    gap:8px;
}

.header-btn{
    position:relative;
    width:45px;
    height:45px;
    border:1px solid var(--border);
    background:#101010;
    color:#fff;
    border-radius:13px;
    font-size:20px;
    transition:.25s;
}

.header-btn:hover{
    border-color:var(--green);
    transform:translateY(-2px);
}

.count{
    position:absolute;
    top:-6px;
    left:-5px;
    min-width:19px;
    height:19px;
    padding:0 4px;
    border-radius:20px;
    background:var(--red);
    color:#fff;
    font-size:10px;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* NAV */
nav{
    border-top:1px solid rgba(255,255,255,.04);
    overflow-x:auto;
    scrollbar-width:none;
}

nav::-webkit-scrollbar{
    display:none;
}

.nav-inner{
    display:flex;
    gap:8px;
    padding:8px 0;
    min-width:max-content;
}

.nav-link{
    border:1px solid var(--border);
    background:#0d0d0d;
    color:#ddd;
    padding:7px 15px;
    border-radius:14px 8px 14px 8px;
    white-space:nowrap;
    transition:.25s;
    font-size:13px;
}

.nav-link:nth-child(even){
    border-radius:8px 14px 8px 14px;
}

.nav-link:hover,
.nav-link.active{
    background:rgba(25,214,107,.08);
    border-color:var(--green);
    color:var(--green);
}

/* APP */
#app{
    min-height:calc(100vh - 140px);
    padding-top:4px;
}

/* HOME */
.home{
    min-height:calc(100vh - 150px);
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    align-items:center;
    text-align:center;
    padding-top:5px;
}

.home-box{
    width:min(850px,94%);
    margin-top:0;
    padding:20px 18px 10px;
}

.home-title{
    font-size:clamp(27px,6vw,52px);
    font-weight:1000;
    line-height:1.3;
    margin-bottom:7px;
}

.home-subtitle{
    color:#ddd;
    font-size:15px;
    line-height:2;
    max-width:760px;
    margin:auto;
}

.home-subtitle strong{
    color:var(--green);
}

.home-subtitle .iran{
    color:var(--red);
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:13px;
}

.stat{
    background:linear-gradient(145deg,#111,#090909);
    border:1px solid var(--border);
    border-radius:16px;
    padding:12px 8px;
}

.stat-number{
    color:var(--green);
    font-size:22px;
    font-weight:900;
}

.stat-label{
    color:#999;
    font-size:12px;
}

/* PAGE */
.page{
    padding:22px 0 40px;
}

.page-title{
    font-size:25px;
    font-weight:900;
    margin-bottom:15px;
}

.page-title span{
    color:var(--green);
}

/* CATEGORY */
.category-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
}

.category-card{
    position:relative;
    overflow:hidden;
    min-height:170px;
    border:1px solid var(--border);
    border-radius:20px;
    background:#0d0d0d;
    transition:.3s;
}

.category-card:hover{
    transform:translateY(-4px);
    border-color:var(--green);
}

.category-card img{
    width:100%;
    height:170px;
    object-fit:cover;
    opacity:.55;
}

.category-overlay{
    position:absolute;
    inset:0;
    display:flex;
    align-items:flex-end;
    padding:18px;
    background:linear-gradient(transparent,rgba(0,0,0,.9));
}

.category-name{
    font-size:20px;
    font-weight:900;
}

/* PRODUCTS */
.products-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
}

.sort-select{
    background:#101010;
    color:#fff;
    border:1px solid var(--border);
    border-radius:12px;
    padding:9px 12px;
    outline:none;
}

.products-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
}

.product-card{
    background:linear-gradient(145deg,#101010,#080808);
    border:1px solid var(--border);
    border-radius:18px;
    overflow:hidden;
    transition:.3s;
    position:relative;
}

.product-card:hover{
    transform:translateY(-4px);
    border-color:rgba(25,214,107,.45);
}

.product-image-wrap{
    position:relative;
    background:#111;
}

.product-image{
    width:100%;
    height:235px;
    object-fit:cover;
    display:block;
}

.image-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:31px;
    height:31px;
    border:none;
    border-radius:50%;
    background:rgba(0,0,0,.7);
    color:#fff;
    z-index:3;
}

.image-arrow.left{
    left:7px;
}

.image-arrow.right{
    right:7px;
}

.image-number{
    position:absolute;
    bottom:7px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,.7);
    padding:2px 8px;
    border-radius:20px;
    font-size:10px;
}

.discount-badge{
    position:absolute;
    top:8px;
    right:8px;
    background:var(--red);
    color:#fff;
    padding:3px 8px;
    border-radius:10px;
    font-size:11px;
    font-weight:bold;
}

.favorite-small{
    position:absolute;
    top:8px;
    left:8px;
    width:34px;
    height:34px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:50%;
    background:rgba(0,0,0,.7);
    color:#fff;
    font-size:17px;
    z-index:5;
}

.favorite-small.active{
    color:var(--red);
}

.product-info{
    padding:12px;
}

.product-name{
    font-size:14px;
    font-weight:900;
    min-height:45px;
}

.product-brand{
    color:#888;
    font-size:11px;
    margin-bottom:5px;
}

.price-old{
    color:#777;
    text-decoration:line-through;
    font-size:11px;
}

.price{
    color:var(--green);
    font-size:17px;
    font-weight:900;
}

.stock{
    margin-top:5px;
    font-size:11px;
}

.product-bottom{
    display:flex;
    gap:7px;
    margin-top:10px;
}

.details-btn,
.add-btn{
    flex:1;
    border:1px solid var(--border);
    border-radius:10px;
    padding:8px 5px;
    font-size:11px;
}

.details-btn{
    background:#151515;
    color:#fff;
}

.add-btn{
    background:var(--green);
    color:#001b0b;
    font-weight:900;
}

/* PRODUCT DETAIL */
.detail{
    max-width:1050px;
    margin:auto;
}

.detail-box{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
    background:#0b0b0b;
    border:1px solid var(--border);
    border-radius:22px;
    padding:18px;
}

.detail-gallery{
    position:relative;
    background:#111;
    border-radius:17px;
    overflow:hidden;
}

.detail-gallery img{
    width:100%;
    height:450px;
    object-fit:cover;
}

.detail-info h1{
    font-size:28px;
    margin-bottom:8px;
}

.detail-brand{
    color:#999;
    margin-bottom:15px;
}

.detail-desc{
    color:#ccc;
    margin:15px 0;
    white-space:pre-line;
}

.detail-price{
    font-size:25px;
    color:var(--green);
    font-weight:900;
}

.detail-old{
    color:#777;
    text-decoration:line-through;
}

.specs{
    margin-top:15px;
    background:#111;
    border-radius:14px;
    padding:13px;
    color:#bbb;
    white-space:pre-line;
    font-size:13px;
}

.quantity{
    display:flex;
    align-items:center;
    gap:12px;
    margin:18px 0;
}

.quantity button{
    width:35px;
    height:35px;
    border:none;
    border-radius:10px;
    background:#181818;
    color:#fff;
    font-size:20px;
}

.quantity span{
    min-width:30px;
    text-align:center;
}

.detail-add{
    width:100%;
    border:none;
    border-radius:13px;
    padding:13px;
    background:var(--green);
    color:#001b0b;
    font-weight:900;
}

/* SUPPORT */
.support-box{
    max-width:650px;
    margin:20px auto;
    background:#0c0c0c;
    border:1px solid var(--border);
    border-radius:22px;
    padding:22px;
}

.contact-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    background:#111;
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px;
    margin-top:10px;
}

.contact-value{
    direction:ltr;
    color:var(--green);
    font-weight:bold;
}

.contact-buttons{
    display:flex;
    gap:5px;
}

.contact-btn{
    border:1px solid var(--border);
    background:#181818;
    color:#fff;
    border-radius:9px;
    padding:7px 10px;
    font-size:11px;
}

/* CART */
.cart-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.cart-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px;
    background:#0d0d0d;
    border:1px solid var(--border);
    border-radius:15px;
}

.cart-item img{
    width:70px;
    height:70px;
    object-fit:cover;
    border-radius:10px;
}

.cart-item-info{
    flex:1;
}

.remove-btn{
    background:#190707;
    border:1px solid #441111;
    color:#ff5555;
    border-radius:9px;
    padding:7px 10px;
}

.cart-total{
    margin-top:18px;
    padding:15px;
    border:1px solid var(--border);
    border-radius:15px;
    background:#0d0d0d;
    text-align:center;
}

.empty{
    text-align:center;
    color:#777;
    padding:60px 15px;
}

/* SUPPORT FLOAT */
.support-float{
    position:fixed;
    right:18px;
    bottom:18px;
    width:58px;
    height:58px;
    border-radius:50%;
    border:2px solid #8e7900;
    background:#ffd92f;
    color:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
    z-index:900;
    box-shadow:0 5px 25px rgba(255,217,47,.2);
    transition:.25s;
}

.support-float:hover{
    transform:scale(1.08);
}

/* MODAL */
.modal{
    position:fixed;
    inset:0;
    z-index:3000;
    background:rgba(0,0,0,.8);
    backdrop-filter:blur(7px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.hidden{
    display:none;
}

.modal-box{
    width:min(450px,100%);
    background:#101010;
    border:1px solid rgba(25,214,107,.25);
    border-radius:22px;
    padding:25px;
    text-align:center;
    box-shadow:0 20px 70px rgba(0,0,0,.5);
}

.modal-box h2{
    color:var(--green);
    margin-bottom:12px;
}

.modal-box p{
    color:#ccc;
    margin-bottom:20px;
}

.modal-actions{
    display:flex;
    gap:10px;
}

.modal-actions button{
    flex:1;
    border:none;
    border-radius:12px;
    padding:11px;
    font-weight:bold;
}

.accept{
    background:var(--green);
    color:#001b0b;
}

.reject{
    background:#301010;
    color:#ff5555;
}

/* TOAST */
.toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translate(-50%,120px);
    background:#171717;
    border:1px solid var(--green);
    color:#fff;
    padding:10px 18px;
    border-radius:12px;
    z-index:5000;
    opacity:0;
    transition:.3s;
}

.toast.show{
    transform:translate(-50%,0);
    opacity:1;
}

/* FOOTER */
footer{
    border-top:1px solid var(--border);
    margin-top:30px;
    padding:18px 0;
    color:#777;
    text-align:center;
    font-size:11px;
}

/* RESPONSIVE */
@media(max-width:900px){
    .products-grid{
        grid-template-columns:repeat(3,1fr);
    }

    .detail-box{
        grid-template-columns:1fr;
    }

    .detail-gallery img{
        height:400px;
    }
}

@media(max-width:650px){
    .header-main{
        flex-wrap:wrap;
        padding:8px 0;
    }

    .brand{
        flex:1;
    }

    .brand-name{
        font-size:16px;
    }

    .logo{
        width:43px;
        height:43px;
    }

    .search-box{
        order:3;
        max-width:none;
        flex-basis:100%;
    }

    .header-actions{
        gap:5px;
    }

    .header-btn{
        width:40px;
        height:40px;
    }

    .products-grid{
        grid-template-columns:repeat(2,1fr);
        gap:9px;
    }

    .product-image{
        height:190px;
    }

    .category-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .category-card{
        min-height:135px;
    }

    .category-card img{
        height:135px;
    }

    .home-box{
        padding-top:4px;
    }

    .home-title{
        font-size:27px;
    }

    .home-subtitle{
        font-size:13px;
        line-height:1.9;
    }

    .stats{
        gap:6px;
    }

    .stat-number{
        font-size:18px;
    }

    .detail-gallery img{
        height:320px;
    }
}

@media(max-width:400px){
    .products-grid{
        grid-template-columns:1fr 1fr;
    }

    .product-image{
        height:165px;
    }

    .product-name{
        font-size:12px;
    }

    .price{
        font-size:14px;
    }
}
</style>
</head>

<body>

<header>
    <div class="container header-main">

        <a href="#/" class="brand" onclick="go('/')">
            <img src="logo.jpg" class="logo" alt="ماهان سنتر ایران">
            <div class="brand-name">
                <span class="brand-green">ماهان سنتر</span>
                <span class="brand-red"> ایران</span>
            </div>
        </a>

        <div class="search-box">
            <span class="search-icon">⌕</span>
            <input
                id="searchInput"
                type="text"
                placeholder="جستجوی محصول..."
                autocomplete="off"
            >
        </div>

        <div class="header-actions">

            <button class="header-btn" onclick="go('/favorites')" title="علاقه‌مندی‌ها">
                ❤
                <span id="favoriteCount" class="count">0</span>
            </button>

            <button class="header-btn" onclick="go('/cart')" title="سبد خرید">
                🛒
                <span id="cartCount" class="count">0</span>
            </button>

        </div>
    </div>

    <nav>
        <div class="container nav-inner">

            <a class="nav-link" href="#/" onclick="go('/')">
                🏠 خانه
            </a>

            <a class="nav-link" href="#/categories" onclick="go('/categories')">
                📦 دسته‌بندی‌ها
            </a>

            <a class="nav-link" href="#/discount" onclick="go('/discount')">
                🔥 تخفیف‌ها
            </a>

            <a class="nav-link" href="#/laws" onclick="go('/laws')">
                📜 قوانین
            </a>

            <a class="nav-link" href="#/support" onclick="go('/support')">
                💬 پشتیبانی
            </a>

        </div>
    </nav>
</header>

<main id="app">
    <div class="empty">در حال بارگذاری...</div>
</main>

<!-- فقط پشتیبانی شناور -->
<button class="support-float" onclick="go('/support')" title="پشتیبانی">
    👨🏻‍💻
</button>

<div id="toast" class="toast"></div>

<!-- قانون اولین ورود -->
<div id="lawModal" class="modal hidden">
    <div class="modal-box">

        <h2>دوست عزیز</h2>

        <p>
            قبل از خرید قوانین سایت را کامل مطالعه بفرمایید.
        </p>

        <div class="modal-actions">

            <button class="accept" onclick="acceptLaw()">
                پذیرش و خواندن قوانین
            </button>

            <button class="reject" onclick="rejectLaw()">
                رد کردن
            </button>

        </div>

    </div>
</div>

<footer>
    <div class="container">
        تمامی اطلاعات محفوظ است.
    </div>
</footer>

<script>
/* =========================
   DATA
========================= */

const categories={
    mobile:{
        name:"گوشی",
        icon:"📱",
        image:""
    },

    gold:{
        name:"طلا",
        icon:"💎",
        image:""
    },

    clothes:{
        name:"پوشاک",
        icon:"👕",
        image:""
    },

    accessories:{
        name:"لوازم جانبی",
        icon:"🎧",
        image:""
    },

    shoes:{
        name:"کفش",
        icon:"👟",
        image:""
    },

    watches:{
        name:"ساعت",
        icon:"⌚",
        image:""
    }
};

const fallbackImages={
    mobile:"https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=900&q=80",

    gold:"https://images.unsplash.com/photo-1611652022419-a9419f74343d?auto=format&fit=crop&w=900&q=80",

    clothes:"https://images.unsplash.com/photo-1445205170230-053b83016050?auto=format&fit=crop&w=900&q=80",

    accessories:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=900&q=80",

    shoes:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=900&q=80",

    watches:"https://images.unsplash.com/photo-1524805444758-089113d48a6d?auto=format&fit=crop&w=900&q=80"
};

let products=[];
let currentSort="newest";

let cart=JSON.parse(localStorage.getItem("mahanCart")||"[]");
let favorites=JSON.parse(localStorage.getItem("mahanFavorites")||"[]");


/* =========================
   HELPERS
========================= */

function escapeHTML(value){
    return String(value??"")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function money(value){
    return Number(value||0).toLocaleString("fa-IR")+" تومان";
}

function getFinalPrice(product){
    const price=Number(product.price||0);
    const discount=Number(product.discount||0);

    if(discount<=0) return price;

    return Math.round(price-(price*discount/100));
}

function getImages(product){
    return [
        product.image,
        product.image2,
        product.image3
    ].filter(Boolean);
}

function getStockText(stock){
    stock=Number(stock||0);

    if(stock>10){
        return `<span style="color:#19d66b">🟢${stock} عدد در انبار موجود میباشد</span>`;
    }

    if(stock>0){
        return `<span style="color:#ffd43b">🟡${stock} عدد در انبار موجود میباشد</span>`;
    }

    return `<span style="color:#ff3030">🔴 در انبار موجود نداریم</span>`;
}

function showToast(text){
    const toast=document.getElementById("toast");

    toast.textContent=text;
    toast.classList.add("show");

    clearTimeout(window.toastTimer);

    window.toastTimer=setTimeout(()=>{
        toast.classList.remove("show");
    },2500);
}

function saveCart(){
    localStorage.setItem("mahanCart",JSON.stringify(cart));
    updateCounts();
}

function saveFavorites(){
    localStorage.setItem("mahanFavorites",JSON.stringify(favorites));
    updateCounts();
}

function updateCounts(){
    document.getElementById("favoriteCount").textContent=favorites.length;

    document.getElementById("cartCount").textContent=
        cart.reduce((sum,item)=>sum+Number(item.qty||0),0);
}

function isFavorite(id){
    return favorites.some(x=>String(x)===String(id));
}

function toggleFavorite(id){
    id=String(id);

    if(isFavorite(id)){
        favorites=favorites.filter(x=>String(x)!==id);
        showToast("از علاقه‌مندی‌ها حذف شد");
    }else{
        favorites.push(id);
        showToast("به علاقه‌مندی‌ها اضافه شد");
    }

    saveFavorites();

    render(getRoute());
}


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

    try{

        const response=await fetch(
            "https://curly-cherry-da35.amydypiam064.workers.dev/products",
            {
                cache:"no-store"
            }
        );

        if(!response.ok){
            throw new Error("خطا در دریافت محصولات");
        }

        const data=await response.json();

        const docs=Array.isArray(data)
            ? data
            : (data.documents||[]);

        products=docs.map(doc=>{

            const f=doc.fields||doc;

            function value(key){

                const v=f[key];

                if(v===undefined || v===null){
                    return "";
                }

                if(typeof v==="object"){

                    if("stringValue" in v) return v.stringValue;

                    if("integerValue" in v) return Number(v.integerValue);

                    if("doubleValue" in v) return Number(v.doubleValue);

                    if("booleanValue" in v) return v.booleanValue;

                    if("timestampValue" in v) return v.timestampValue;
                }

                return v;
            }

            return {
                id:String(value("code")||value("id")||""),
                cat:value("category"),
                brand:value("brand"),
                goldCat:value("goldCat"),
                name:value("name"),
                search:value("search"),
                price:Number(value("price")||0),
                image:value("image"),
                image2:value("image2"),
                image3:value("image3"),
                icon:value("icon"),
                desc:value("description")||value("desc"),
                specs:value("specs"),
                stock:Number(value("stock")||0),
                discount:Number(value("discount")||0),
                createdAt:value("createdAt")
            };
        });

        products.sort((a,b)=>Number(a.id||0)-Number(b.id||0));

        render(getRoute());

        showFirstVisitLaw();

    }catch(error){

        console.error(error);

        products=[];

        document.getElementById("app").innerHTML=`
            <div class="container">
                <div class="empty">
                    دریافت محصولات با مشکل مواجه شد.
                    <br><br>
                    <button
                        onclick="loadProducts()"
                        style="
                            background:#19d66b;
                            border:0;
                            padding:10px 18px;
                            border-radius:10px;
                            font-weight:bold;
                        "
                    >
                        تلاش مجدد
                    </button>
                </div>
            </div>
        `;
    }
}


/* =========================
   SORT
========================= */

function sortProducts(list){

    const arr=[...list];

    if(currentSort==="newest"){

        arr.sort((a,b)=>{
            const ad=Date.parse(a.createdAt)||Number(a.id)||0;
            const bd=Date.parse(b.createdAt)||Number(b.id)||0;

            return bd-ad;
        });

    }

    if(currentSort==="cheap"){

        arr.sort((a,b)=>{
            return getFinalPrice(a)-getFinalPrice(b);
        });

    }

    if(currentSort==="expensive"){

        arr.sort((a,b)=>{
            return getFinalPrice(b)-getFinalPrice(a);
        });

    }

    if(currentSort==="discount"){

        arr.sort((a,b)=>{
            return Number(b.discount||0)-Number(a.discount||0);
        });

    }

    return arr;
}

function getRoute(){

    let path=location.hash.replace(/^#/,"");

    if(!path){
        path="/";
    }

    return decodeURI(path);
}

function go(path){

    if(location.hash==="#"+path){
        render(path);
        window.scrollTo({
            top:0,
            behavior:"smooth"
        });
        return;
    }

    location.hash=path;

    render(path);

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

window.addEventListener("hashchange",()=>{
    render(getRoute());

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
});

const cardImageIndex={};

function changeCardImage(id,direction){

    const product=products.find(
        p=>String(p.id)===String(id)
    );

    if(!product) return;

    const images=getImages(product);

    if(images.length<=1) return;

    if(cardImageIndex[id]===undefined){
        cardImageIndex[id]=0;
    }

    cardImageIndex[id]+=direction;

    if(cardImageIndex[id]<0){
        cardImageIndex[id]=images.length-1;
    }

    if(cardImageIndex[id]>=images.length){
        cardImageIndex[id]=0;
    }

    const img=document.getElementById("img-"+id);
    const num=document.getElementById("num-"+id);

    if(img){
        img.src=images[cardImageIndex[id]];
    }

    if(num){
        num.textContent=
            `${cardImageIndex[id]+1} / ${images.length}`;
    }
}

let detailQuantity=1;

function changeQuantity(change){

    const route=getRoute();

    const id=route.split("/")[2];

    const product=products.find(
        p=>String(p.id)===String(id)
    );

    if(!product) return;

    detailQuantity+=change;

    if(detailQuantity<1){
        detailQuantity=1;
    }

    if(detailQuantity>Number(product.stock||0)){
        detailQuantity=Number(product.stock||0);
    }

    if(detailQuantity<1){
        detailQuantity=1;
    }

    const el=document.getElementById("detailQty");

    if(el){
        el.textContent=detailQuantity;
    }
}

function addDetailToCart(id){

    const product=products.find(
        p=>String(p.id)===String(id)
    );

    if(!product) return;

    const stock=Number(product.stock||0);

    if(stock<=0){
        showToast("این محصول موجود نیست");
        return;
    }

    addToCart(id,detailQuantity);
}


/* =========================
   CART
========================= */

function addToCart(id,qty=1){

    const product=products.find(
        p=>String(p.id)===String(id)
    );

    if(!product) return;

    const stock=Number(product.stock||0);

    if(stock<=0){
        showToast("این محصول موجود نیست");
        return;
    }

    const existing=cart.find(
        item=>String(item.id)===String(id)
    );

    const currentQty=existing
        ? Number(existing.qty||0)
        : 0;

    if(currentQty+Number(qty)>stock){
        showToast("تعداد انتخابی بیشتر از موجودی است");
        return;
    }

    if(existing){
        existing.qty=currentQty+Number(qty);
    }else{
        cart.push({
            id:String(id),
            qty:Number(qty)
        });
    }

    saveCart();

    showToast("محصول به سبد خرید اضافه شد");
}

function removeFromCart(id){

    cart=cart.filter(
        item=>String(item.id)!==String(id)
    );

    saveCart();

    render("/cart");
}

function changeCartQty(id,change){

    const item=cart.find(
        x=>String(x.id)===String(id)
    );

    const product=products.find(
        x=>String(x.id)===String(id)
    );

    if(!item || !product) return;

    item.qty+=change;

    if(item.qty<1){
        item.qty=1;
    }

    if(item.qty>Number(product.stock||0)){
        item.qty=Number(product.stock||0);
    }

    saveCart();

    render("/cart");
}

function renderCart(){

    const validCart=cart.filter(item=>
        products.some(p=>String(p.id)===String(item.id))
    );

    cart=validCart;

    if(!cart.length){

        return `
            <div class="container page">

                <h1 class="page-title">
                    🛒 سبد <span>خرید</span>
                </h1>

                <div class="empty">
                    سبد خرید شما خالی است.
                </div>

            </div>
        `;
    }

    let total=0;

    const items=cart.map(item=>{

        const product=products.find(
            p=>String(p.id)===String(item.id)
        );

        if(!product) return "";

        const qty=Number(item.qty||1);

        const price=getFinalPrice(product);

        total+=price*qty;

        const image=
            getImages(product)[0]||
            fallbackImages[product.cat]||
            "";

        return `
            <div class="cart-item">

                <img src="${image}" alt="">

                <div class="cart-item-info">

                    <strong>
                        ${escapeHTML(product.name)}
                    </strong>

                    <div style="color:#19d66b">
                        ${money(price)}
                    </div>

                    <div class="quantity" style="margin:5px 0">

                        <button
                            onclick="changeCartQty('${escapeHTML(product.id)}',-1)"
                        >
                            −
                        </button>

                        <span>${qty}</span>

                        <button
                            onclick="changeCartQty('${escapeHTML(product.id)}',1)"
                        >
                            +
                        </button>

                    </div>

                </div>

                <button
                    class="remove-btn"
                    onclick="removeFromCart('${escapeHTML(product.id)}')"
                >
                    حذف
                </button>

            </div>
        `;
    }).join("");

    saveCart();

    return `
        <div class="container page">

            <h1 class="page-title">
                🛒 سبد <span>خرید</span>
            </h1>

            <div class="cart-list">
                ${items}
            </div>

            <div class="cart-total">

                <div style="color:#aaa">
                    مبلغ کل
                </div>

                <div style="
                    color:#19d66b;
                    font-size:24px;
                    font-weight:900;
                ">
                    ${money(total)}
                </div>

                <button
                    onclick="go('/support')"
                    style="
                        margin-top:12px;
                        width:100%;
                        padding:12px;
                        border:0;
                        border-radius:12px;
                        background:#19d66b;
                        color:#001b0b;
                        font-weight:900;
                    "
                >
                    ادامه و ارتباط با پشتیبانی
                </button>

            </div>

        </div>
    `;
}

========================= */

function renderCategory(cat){

    const category=categories[cat];

    if(!category){

        return `
            <div class="container page">
                <div class="empty">
                    دسته‌بندی پیدا نشد.
                </div>
            </div>
        `;
    }

    const list=products.filter(
        p=>String(p.cat)===String(cat)
    );

    return renderProducts(
        list,
        `${category.icon} ${category.name}`
    );
}

/* =========================
   RENDER
========================= */

function render(path){

    const app=document.getElementById("app");

    if(path==="/"){
        app.innerHTML=renderHome();
        updateCounts();
        return;
    }

    if(path==="/categories"){
        app.innerHTML=renderCategories();
        updateCounts();
        return;
    }

    if(path==="/discount"){
        app.innerHTML=renderDiscount();
        updateCounts();
        return;
    }

    if(path==="/favorites"){
        app.innerHTML=renderFavorites();
        updateCounts();
        return;
    }

    if(path==="/cart"){
        app.innerHTML=renderCart();
        updateCounts();
        return;
    }

    if(path==="/laws"){
        app.innerHTML=renderLaws();
        updateCounts();
        return;
    }

    if(path==="/support"){
        app.innerHTML=renderSupport();
        updateCounts();
        return;
    }

    if(path.startsWith("/category/")){

        const cat=path.split("/")[2];

        app.innerHTML=renderCategory(cat);
        updateCounts();
        return;
    }

    if(path.startsWith("/product/")){

        const id=path.split("/")[2];

        detailQuantity=1;

        app.innerHTML=renderProductDetail(id);
        updateCounts();
        return;
    }

    if(path.startsWith("/search/")){

        const query=decodeURIComponent(
            path.substring("/search/".length)
        );

        app.innerHTML=renderSearch(query);
        updateCounts();
        return;
    }

    app.innerHTML=renderHome();
    updateCounts();
}


/* =========================
   FIRST VISIT LAW
========================= */

function showFirstVisitLaw(){

    const seen=localStorage.getItem("mahanLawSeen");

    if(!seen){

        setTimeout(()=>{

            document
                .getElementById("lawModal")
                .classList.remove("hidden");

        },700);
    }
}

function acceptLaw(){

    localStorage.setItem("mahanLawSeen","1");

    document
        .getElementById("lawModal")
        .classList.add("hidden");

    go("/laws");
}

function rejectLaw(){

    localStorage.setItem("mahanLawSeen","1");

    document
        .getElementById("lawModal")
        .classList.add("hidden");
}


/* =========================
   SEARCH EVENTS
========================= */

const searchInput=document.getElementById("searchInput");

searchInput.addEventListener("keydown",function(e){

    if(e.key==="Enter"){

        const value=this.value.trim();

        if(!value){
            go("/");
            return;
        }

        go("/search/"+encodeURIComponent(value));
    }

});

   START
