<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070707">
<title>ماهان سنتر ایران</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

:root{
--green:#19d66b;
--green2:#0fb957;
--yellow:#ffc400;
--red:#e50914;
--red2:#ff1d2d;
--bg:#070707;
--card:#111111;
--card2:#181818;
--border:#292929;
--text:#fff;
--muted:#999;
}

html{
scroll-behavior:smooth;
}

body{
font-family:Tahoma,Arial,sans-serif;
background:
radial-gradient(circle at top right,rgba(25,214,107,.035),transparent 30%),
var(--bg);
color:var(--text);
line-height:1.7;
min-height:100vh;
}

button,input{
font-family:inherit;
}

button{
cursor:pointer;
}

a{
color:inherit;
text-decoration:none;
}

.container{
width:92%;
max-width:1250px;
margin:auto;
}

/* =========================
HEADER
========================= */

header{
position:sticky;
top:0;
z-index:1000;
background:rgba(7,7,7,.94);
backdrop-filter:blur(18px);
border-bottom:1px solid var(--border);
}

.header-main{
min-height:100px;
display:flex;
align-items:center;
gap:22px;
}

.logo{
display:flex;
align-items:center;
gap:14px;
min-width:max-content;
}

.logo img{
width:72px;
height:72px;
object-fit:cover;
border-radius:50%;
border:3px solid var(--green);
box-shadow:
0 0 0 3px rgba(25,214,107,.08),
0 0 20px rgba(25,214,107,.18);
}

.logo-name{
font-size:24px;
font-weight:bold;
}

.logo-name .mahan-word{
color:var(--green);
}

.logo-name .center-word{
color:#fff;
}

.logo-name .iran-word{
color:var(--red);
font-weight:bold;
}

.search-box{
flex:1;
max-width:600px;
height:50px;
display:flex;
background:#161616;
border:1px solid #333;
border-radius:15px;
overflow:hidden;
}

.search-box input{
flex:1;
min-width:0;
border:0;
outline:0;
background:none;
color:white;
padding:0 17px;
font-size:14px;
}

.search-box button{
width:60px;
border:0;
background:var(--green);
color:#06120a;
font-size:23px;
font-weight:bold;
}

.header-actions{
display:flex;
gap:9px;
}

.header-btn{
height:48px;
min-width:50px;
padding:0 13px;
border-radius:14px;
border:1px solid #333;
background:#151515;
color:white;
position:relative;
font-size:20px;
transition:.2s;
}

.header-btn:hover{
border-color:var(--green);
transform:translateY(-2px);
}

.cart-count{
position:absolute;
top:-7px;
left:-6px;
width:21px;
height:21px;
border-radius:50%;
background:var(--red);
color:white;
font-size:11px;
display:flex;
align-items:center;
justify-content:center;
}

/* =========================
NAV
========================= */

.navbar{
border-top:1px solid #171717;
}

.nav{
min-height:60px;
display:flex;
align-items:center;
gap:8px;
overflow-x:auto;
padding:6px 0;
}

.nav::-webkit-scrollbar{
display:none;
}

.nav a{
white-space:nowrap;
padding:9px 18px;
border-radius:15px;
color:#bbb;
font-size:13px;
border:1px solid transparent;
transition:.25s;
background:
linear-gradient(135deg,#151515,#0e0e0e);
}

.nav a:nth-child(1){
border-radius:20px 8px 20px 8px;
}

.nav a:nth-child(2){
border-radius:8px 20px 8px 20px;
}

.nav a:nth-child(3){
border-radius:20px 8px 20px 8px;
}

.nav a:nth-child(4){
border-radius:8px 20px 8px 20px;
}

.nav a:nth-child(5){
border-radius:20px 8px 20px 8px;
}

.nav a:hover,
.nav a.active{
color:#06120a;
background:var(--green);
border-color:var(--green);
transform:translateY(-2px);
}

/* =========================
APP
========================= */

#app{
min-height:70vh;
}

.page{
padding:30px 0 50px;
animation:pageIn .22s ease;
}

@keyframes pageIn{
from{
opacity:0;
transform:translateY(7px);
}
to{
opacity:1;
transform:none;
}
}

/* =========================
HOME
========================= */

.home-intro{
min-height:calc(100vh - 180px);
display:flex;
align-items:center;
justify-content:center;
text-align:center;
transform:translateY(-85px);
}

.home-box{
width:100%;
max-width:850px;
padding:60px 40px;
border:1px solid #252525;
border-radius:35px;
background:
radial-gradient(
circle at 50% 0%,
rgba(25,214,107,.12),
transparent 45%
),
linear-gradient(145deg,#151515,#090909);
box-shadow:0 25px 80px rgba(0,0,0,.4);
}

.home-logo-small{
width:100px;
height:100px;
border-radius:50%;
object-fit:cover;
border:3px solid var(--green);
margin-bottom:20px;
box-shadow:0 0 30px rgba(25,214,107,.18);
}

.home-box h1{
font-size:clamp(28px,5vw,50px);
margin-bottom:18px;
}

.brand-name .mahan-word{
color:var(--green);
}

.brand-name .center-word{
color:#fff;
}

.brand-name .iran-word{
color:var(--red);
}

.home-description{
max-width:720px;
margin:auto;
color:#aaa;
font-size:15px;
line-height:2.2;
}

/* =========================
STATS
========================= */

.stats{
margin-top:30px;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
}

.stat{
background:#101010;
border:1px solid #292929;
border-radius:18px;
padding:16px;
}

.stat strong{
display:block;
font-size:22px;
}

.stat span{
font-size:11px;
}

.stat:nth-child(1) strong{
color:var(--green);
}

.stat:nth-child(1) span{
color:var(--green);
}

.stat:nth-child(2) strong{
color:#fff;
}

.stat:nth-child(2) span{
color:#fff;
}

.stat:nth-child(3) strong{
color:var(--red);
}

.stat:nth-child(3) span{
color:var(--red);
}

/* =========================
SECTION
========================= */

.section{
margin-top:35px;
}

.section-head{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:18px;
}

.section-head h2{
font-size:22px;
}

.section-head span{
color:#888;
font-size:12px;
}

/* =========================
CATEGORIES
========================= */

.categories{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
}

.category-wrap{
position:relative;
}

.category{
min-height:180px;
position:relative;
overflow:hidden;
background:#111;
border:1px solid #292929;
border-radius:24px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:flex-end;
padding:20px;
transition:.25s;
}

.category:hover{
transform:translateY(-5px);
border-color:var(--green);
box-shadow:0 15px 35px rgba(0,0,0,.35);
}

.category-image{
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:cover;
opacity:.55;
transition:.3s;
}

.category:hover .category-image{
transform:scale(1.05);
opacity:.68;
}

.category-overlay{
position:absolute;
inset:0;
background:
linear-gradient(
to top,
rgba(0,0,0,.92),
rgba(0,0,0,.15)
);
}

.category-content{
position:relative;
z-index:2;
text-align:center;
}

.category-icon{
font-size:38px;
margin-bottom:3px;
}

.category-name{
font-size:16px;
font-weight:bold;
}

.category-sub{
color:#aaa;
font-size:10px;
}

.category-submenu{
display:none;
position:absolute;
top:calc(100% + 8px);
right:0;
left:0;
z-index:50;
background:#101010;
border:1px solid #333;
border-radius:16px;
padding:8px;
box-shadow:0 18px 40px rgba(0,0,0,.6);
}

.category-wrap.open .category-submenu{
display:block;
animation:submenuIn .18s ease;
}

@keyframes submenuIn{
from{
opacity:0;
transform:translateY(-5px);
}
to{
opacity:1;
transform:none;
}
}

.subcategory-btn{
display:block;
width:100%;
border:1px solid transparent;
background:#171717;
color:#ccc;
padding:9px 12px;
border-radius:10px;
margin-bottom:5px;
text-align:right;
font-size:11px;
transition:.2s;
}

.subcategory-btn:last-child{
margin-bottom:0;
}

.subcategory-btn:hover,
.subcategory-btn.active{
background:var(--green);
color:#06120a;
}

/* =========================
PRODUCTS
========================= */

.products{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:16px;
}

.product-card{
position:relative;
overflow:hidden;
background:var(--card);
border:1px solid var(--border);
border-radius:20px;
transition:.25s;
}

.product-card:hover{
transform:translateY(-5px);
border-color:#555;
}

.product-image{
height:220px;
background:#1a1a1a;
position:relative;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}

.product-image img{
width:100%;
height:100%;
object-fit:contain;
padding:12px;
}

.image-arrow{
position:absolute;
top:50%;
transform:translateY(-50%);
width:34px;
height:34px;
border-radius:50%;
border:1px solid #555;
background:rgba(0,0,0,.72);
color:white;
z-index:5;
display:flex;
align-items:center;
justify-content:center;
}

.image-arrow.right{
right:8px;
}

.image-arrow.left{
left:8px;
}

.image-number{
position:absolute;
bottom:8px;
right:50%;
transform:translateX(50%);
background:rgba(0,0,0,.7);
border:1px solid #444;
border-radius:20px;
padding:2px 9px;
font-size:9px;
color:#ddd;
}

.product-info{
padding:15px;
}

.product-title{
font-size:15px;
margin-bottom:5px;
}

.product-desc{
color:#888;
font-size:11px;
min-height:35px;
}

.product-price{
font-size:16px;
font-weight:bold;
margin-top:10px;
}

.product-price small{
color:#888;
font-size:10px;
font-weight:normal;
}

.discount-label{
display:inline-block;
background:var(--red);
color:white;
border-radius:7px;
padding:2px 7px;
font-size:9px;
margin-right:5px;
}

.stock{
margin-top:9px;
font-size:11px;
font-weight:bold;
}

.stock.green{
color:#19d66b;
}

.stock.yellow{
color:#ffc400;
}

.stock.red{
color:#ff3843;
}

.product-actions{
display:flex;
gap:8px;
margin-top:13px;
padding:0 15px 15px;
}

.product-actions button{
flex:1;
padding:9px;
border-radius:11px;
border:1px solid #333;
background:#1b1b1b;
color:white;
}

.product-actions .buy{
background:var(--green);
color:#06120a;
border-color:var(--green);
font-weight:bold;
}

.favorite{
position:absolute;
top:10px;
left:10px;
width:40px;
height:40px;
border-radius:50%;
border:1px solid #444;
background:rgba(0,0,0,.75);
color:white;
font-size:19px;
z-index:8;
}

.favorite.active{
color:#ff3440;
}

/* =========================
FILTER / SORT
========================= */

.filters{
display:flex;
gap:9px;
margin-bottom:20px;
overflow-x:auto;
}

.filters::-webkit-scrollbar{
display:none;
}

.filter{
border:1px solid #333;
background:#151515;
color:#bbb;
border-radius:12px;
padding:9px 15px;
white-space:nowrap;
}

.filter.active,
.filter:hover{
background:var(--green);
border-color:var(--green);
color:#06120a;
}

.sort-box{
position:relative;
display:inline-block;
margin-bottom:20px;
}

.sort-main{
min-width:170px;
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
border:1px solid #333;
background:linear-gradient(135deg,#181818,#101010);
color:#fff;
border-radius:13px;
padding:11px 15px;
font-size:12px;
transition:.2s;
}

.sort-main:hover{
border-color:var(--green);
}

.sort-arrow{
font-size:12px;
transition:.2s;
}

.sort-box.open .sort-arrow{
transform:rotate(180deg);
}

.sort-menu{
display:none;
position:absolute;
right:0;
top:calc(100% + 7px);
min-width:190px;
z-index:100;
padding:7px;
background:#111;
border:1px solid #333;
border-radius:15px;
box-shadow:0 20px 50px rgba(0,0,0,.65);
}

.sort-box.open .sort-menu{
display:block;
animation:submenuIn .18s ease;
}

.sort-option{
width:100%;
display:block;
text-align:right;
border:0;
background:#171717;
color:#bbb;
padding:10px 12px;
border-radius:10px;
margin-bottom:4px;
font-size:11px;
}

.sort-option:last-child{
margin-bottom:0;
}

.sort-option:hover,
.sort-option.active{
background:var(--green);
color:#06120a;
}

/* =========================
PRODUCT DETAIL
========================= */

.product-detail{
display:grid;
grid-template-columns:1fr 1fr;
gap:30px;
background:#101010;
border:1px solid var(--border);
border-radius:26px;
padding:25px;
}

.detail-gallery{
min-height:500px;
position:relative;
border-radius:20px;
background:#191919;
overflow:hidden;
}

.detail-gallery-main{
width:100%;
height:100%;
min-height:500px;
display:flex;
align-items:center;
justify-content:center;
}

.detail-gallery-main img{
width:100%;
height:100%;
max-height:500px;
object-fit:contain;
padding:20px;
}

.detail-arrow{
position:absolute;
top:50%;
transform:translateY(-50%);
width:44px;
height:44px;
border-radius:50%;
background:rgba(0,0,0,.72);
color:white;
border:1px solid #555;
z-index:5;
font-size:20px;
}

.detail-arrow.right{
right:12px;
}

.detail-arrow.left{
left:12px;
}

.detail-dots{
position:absolute;
bottom:14px;
right:50%;
transform:translateX(50%);
display:flex;
gap:5px;
}

.detail-dot{
width:8px;
height:8px;
border-radius:50%;
background:#555;
}

.detail-dot.active{
background:var(--green);
}

.detail-info{
padding:20px 5px;
}

.detail-info h1{
font-size:32px;
margin-bottom:10px;
}

.detail-desc{
color:#999;
margin-bottom:25px;
}

.detail-price{
font-size:26px;
font-weight:bold;
margin-bottom:8px;
}

.detail-discount{
color:#19d66b;
font-size:13px;
margin-bottom:20px;
}

.detail-stock{
padding:12px 15px;
border-radius:13px;
background:#151515;
border:1px solid #292929;
margin-bottom:20px;
font-size:13px;
font-weight:bold;
}

.product-specs{
margin:20px 0;
border:1px solid var(--border);
border-radius:15px;
overflow:hidden;
}

.product-specs-title{
padding:13px 15px;
background:#171717;
font-weight:bold;
}

.product-specs-text{
padding:15px;
color:#aaa;
font-size:13px;
line-height:2;
}

.quantity{
display:flex;
align-items:center;
gap:15px;
margin-bottom:20px;
}

.quantity button{
width:40px;
height:40px;
border:1px solid #333;
background:#191919;
color:white;
border-radius:9px;
font-size:18px;
}

.quantity strong{
min-width:25px;
text-align:center;
}

/* =========================
BUTTONS
========================= */

.primary-btn{
display:inline-flex;
align-items:center;
justify-content:center;
border:0;
background:var(--green);
color:#06120a;
padding:12px 24px;
border-radius:13px;
font-weight:bold;
transition:.2s;
}

.primary-btn:hover{
background:#25ee78;
transform:translateY(-2px);
}

.secondary-btn{
display:inline-flex;
align-items:center;
justify-content:center;
border:1px solid #333;
background:#171717;
color:white;
padding:11px 20px;
border-radius:12px;
}

/* =========================
OFFER
========================= */

.offer{
margin-top:35px;
padding:28px;
border:1px solid #194d31;
border-radius:20px;
background:
linear-gradient(100deg,#071b10,#151515);
display:flex;
align-items:center;
justify-content:space-between;
gap:20px;
}

.offer h2{
margin-bottom:5px;
}

.offer p{
color:#999;
font-size:13px;
}

/* =========================
PAGE TITLE
========================= */

.page-title{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:25px;
}

.page-title h1{
font-size:29px;
}

.page-title p{
color:#888;
font-size:12px;
}

/* =========================
CART
========================= */

.cart-page{
max-width:900px;
margin:auto;
}

.cart-item{
display:flex;
align-items:center;
gap:15px;
padding:15px;
margin-bottom:10px;
border:1px solid var(--border);
background:var(--card);
border-radius:15px;
}

.cart-icon{
width:75px;
height:75px;
border-radius:12px;
background:#202020;
display:flex;
align-items:center;
justify-content:center;
font-size:35px;
overflow:hidden;
}

.cart-icon img{
width:100%;
height:100%;
object-fit:contain;
padding:8px;
}

.cart-item-info{
flex:1;
}

.cart-item-info h3{
font-size:14px;
}

.cart-item-info p{
color:#888;
font-size:11px;
}

.qty{
display:flex;
align-items:center;
gap:7px;
}

.qty button{
width:31px;
height:31px;
border-radius:8px;
border:1px solid #333;
background:#1c1c1c;
color:white;
}

.remove{
border:0;
background:none;
color:#888;
font-size:18px;
}

.cart-summary{
margin-top:20px;
padding:22px;
background:#121212;
border:1px solid var(--border);
border-radius:17px;
}

.summary-row{
display:flex;
justify-content:space-between;
margin-bottom:10px;
}

.summary-row.total{
padding-top:13px;
border-top:1px solid #292929;
font-size:19px;
font-weight:bold;
}

/* =========================
SUPPORT
========================= */

.support-page{
max-width:800px;
margin:auto;
}

.support-header{
text-align:center;
padding:35px 20px;
margin-bottom:20px;
border:1px solid #252525;
border-radius:28px;
background:
radial-gradient(circle at top,rgba(25,214,107,.12),transparent 55%),
#101010;
}

.support-avatar{
width:80px;
height:80px;
margin:auto auto 15px;
border-radius:50%;
background:var(--yellow);
display:flex;
align-items:center;
justify-content:center;
font-size:40px;
}

.support-header h1{
font-size:29px;
}

.support-header p{
color:#888;
font-size:12px;
}

.contact-card{
display:flex;
align-items:center;
gap:15px;
padding:18px;
margin-bottom:13px;
background:#111;
border:1px solid #292929;
border-radius:20px;
}

.contact-icon{
width:52px;
height:52px;
border-radius:15px;
background:#191919;
display:flex;
align-items:center;
justify-content:center;
font-size:24px;
}

.contact-info{
flex:1;
}

.contact-info small{
color:#777;
display:block;
font-size:10px;
}

.contact-info strong{
font-size:15px;
}

.contact-actions{
display:flex;
gap:7px;
}

.contact-actions button{
border:1px solid #333;
background:#191919;
color:white;
border-radius:11px;
padding:9px 12px;
}

.contact-actions .contact-main{
background:var(--green);
border-color:var(--green);
color:#06120a;
}

/* =========================
LAWS
========================= */

.laws-box{
min-height:450px;
background:#101010;
border:1px solid #292929;
border-radius:25px;
padding:30px;
}

.laws-content{
color:#aaa;
font-size:14px;
line-height:2.2;
white-space:pre-line;
}

.laws-empty{
min-height:390px;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:#555;
font-size:13px;
}

/* =========================
WELCOME LAW MODAL
========================= */

.modal-backdrop{
position:fixed;
inset:0;
background:rgba(0,0,0,.78);
backdrop-filter:blur(8px);
z-index:5000;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.law-modal{
width:100%;
max-width:500px;
background:#111;
border:1px solid #333;
border-radius:27px;
padding:30px;
box-shadow:0 30px 100px #000;
animation:modalIn .25s ease;
text-align:center;
}

@keyframes modalIn{

};

};

APPLY SETTINGS

function applySiteSettings(){

const s =
window.settings || DEFAULT_SETTINGS;

const storeName =
s.storeName ||
"ماهان سنتر ایران";

document.title =
storeName;


/* لوگو */

brandNameHTML(storeName);

document.getElementById(
"footerStoreName"

footer.innerHTML =
brandNameHTML(storeName);

/* =========================
BRAND NAME
========================= */

function brandNameHTML(name){

const text =
String(name || "ماهان سنتر ایران");

if(
text.trim()==="ماهان سنتر ایران"
){

return `
<span class="mahan-word">ماهان</span>
<span class="center-word"> سنتر</span>
<span class="iran-word"> ایران</span>
`;

}

return escapeHTML(text)
.replace(
"ماهان",
'<span class="mahan-word">ماهان</span>'
)
.replace(
"سنتر",
'<span class="center-word">سنتر</span>'
)
.replace(
"ایران",
'<span class="iran-word">ایران</span>'
);

}


/* =========================
IMAGE PATH
========================= */

function resolveImage(path){

if(!path)
return "";

path =
String(path).trim();

if(!path)
return "";

if(
/^https?:\/\//i.test(path)
){

return path;

}

return path.replace(/^\/+/,"");

}


/* =========================
NORMALIZE PRODUCT
========================= */

function normalizeProduct(docSnap){

const data =
docSnap.data() || {};

const images =
Array.isArray(data.images)
?
data.images.filter(Boolean)
:
[
data.image1,
data.image2,
data.image3
].filter(Boolean);

const code =
data.code ??
data.id ??
docSnap.id;

const numericId =
Number(code);

const publicId =
Number.isFinite(numericId) &&
String(code).trim() !== ""
?
numericId
:
docSnap.id;

const category =
data.category ??
data.cat ??
"";

const name =
data.name ??
"محصول بدون نام";

const description =
data.description ??
data.desc ??
"";

return {

id:
publicId,

docId:
docSnap.id,

code:
String(code),

name:
name,

category:
category,

cat:
category,

brand:
data.brand || "",

goldCat:
data.goldCat || "",

subcategory:
data.subcategory ||
data.subCategory ||
data.subcat ||
data.type ||
data.productType ||
"",

search:
data.search ||
`${name} ${data.brand || ""} ${category}`,

price:
Number(data.price || 0),

stock:
Number(data.stock ?? 0),

status:
data.status ||
(
Number(data.stock || 0)>0
?
"available"
:
"unavailable"
),

image:
resolveImage(
data.image ||
data.image1 ||
images[0] ||
""
),

image2:
resolveImage(
data.image2 ||
images[1] ||
""
),

image3:
resolveImage(
data.image3 ||
images[2] ||
""
),

images:
images
.map(resolveImage)
.filter(Boolean)
.slice(0,3),

icon:
data.icon ||
"🛍️",

desc:
description,

description:
description,

specs:
data.specs || "",

discount:
Number(data.discount || 0),

createdAt:
data.createdAt || null

};

}


/* =========================
LOAD PRODUCTS
========================= */

async function loadProducts(){

try{

const snap =
await getDocs(
collection(db,"products")
);

const list =
snap.docs.map(
normalizeProduct
);

list.sort(
(a,b)=>{

const aNum =
Number(a.code);

const bNum =
Number(b.code);

if(
Number.isFinite(aNum) &&
Number.isFinite(bNum)
){

return bNum-aNum;

}

return String(b.name)
.localeCompare(
String(a.name)
);

}
);

window.products =
list;

window.dispatchEvent(
new Event(
"firebaseProductsLoaded"
)
);

}catch(error){

console.error(
"Products error:",
error
);

window.products=[];

window.dispatchEvent(
new CustomEvent(
"firebaseProductsError",
{
detail:error
}
)
);

}

}


/* =========================
INITIAL LOAD

await loadSettings();

await loadProducts();


/* =========================
AUTO SYNC

setInterval(

){

render(
getRoute()
);

}

}catch(error){

error
);

}

},
60000
);

/* =========================

function getCategories(){

){

function getSubcategories(cat){

const categoryProducts =
products.filter(
p =>
String(p.category || p.cat) === String(cat)

const result=[];

categoryProducts.forEach(p=>{

const catId =
String(cat);

let value="";

if(catId==="mobile"){

value =
p.brand ||
p.subcategory ||
"";

}

else if(catId==="gold"){

value =
p.goldCat ||
p.subcategory ||
"";

}

else{

value =
p.subcategory ||
p.subCategory ||
p.type ||
"";

}

if(value){

value =
String(value).trim();

if(
value &&
!result.some(
x =>
x.toLowerCase() === value.toLowerCase()
)
){

result.push(value);

}

}

});

const fixed = {

mobile:[
"آیفون",
"سامسونگ",
"شیائومی",
"نوکیا"
],

gold:[
"گردنبند",
"پابند",
"النگو",
"انگشتر",
"ست"
]

};

if(
fixed[cat]
){

fixed[cat].forEach(x=>{

if(
!result.some(
y =>
y.toLowerCase()===x.toLowerCase()
)
){

result.push(x);

}

});

}

return result;

}

function productMatchesSubcategory(

const values=[];

if(categoryId==="mobile"){

values.push(
p.brand,
p.subcategory,
p.subCategory
);

}

else if(categoryId==="gold"){

values.push(
p.goldCat,
p.subcategory,
p.subCategory
);

}

else{

p.subCategory,
p.type,

);

}

const wanted =
String(sub)
.toLowerCase()
.trim();

return values.some(
value =>

.toLowerCase()
.trim() === wanted

}

/* =========================
SORT
========================= */

function sortProducts(list){

var arr=[...list];

if(currentSort==="newest"){

arr.sort(
(a,b)=>{

const aCreated =
getCreatedTime(a);

const bCreated =
getCreatedTime(b);

if(
aCreated &&
bCreated &&
aCreated !== bCreated
){

return bCreated-aCreated;

}

return
Number(b.code || b.id) -
Number(a.code || a.id);

}
);

}

else if(currentSort==="oldest"){

arr.sort(
(a,b)=>{

const aCreated =
getCreatedTime(a);

const bCreated =
getCreatedTime(b);

if(
aCreated &&
bCreated &&
aCreated !== bCreated
){

return aCreated-bCreated;

}

return
Number(a.code || a.id) -
Number(b.code || b.id);

}
);

}

else if(currentSort==="cheap"){

arr.sort(
(a,b)=>
getFinalPrice(a) -
getFinalPrice(b)
);

}

else if(currentSort==="expensive"){

arr.sort(
(a,b)=>
getFinalPrice(b) -
getFinalPrice(a)
);

}

else if(currentSort==="discount"){

arr.sort(
(a,b)=>
Number(b.discount||0) -
Number(a.discount||0)
);

}

return arr;

}


function getCreatedTime(p){

if(!p || !p.createdAt)
return 0;

const value =
p.createdAt;

if(
typeof value==="number"
){

return value;

}

if(
typeof value==="object" &&
typeof value.toMillis==="function"
){

return value.toMillis();

}

const parsed =
Date.parse(value);

return Number.isNaN(parsed)
?
0
:
parsed;

}


function getFinalPrice(p){

var price =
Number(p.price || 0);

var discount =
Number(p.discount || 0);

return discount > 0
?
Math.round(
price -
(price * discount / 100)
)
:
price;

}

function changeDetailImage(id,amount){

var p =
products.find(
x =>
String(x.id)===String(id)
);

if(!p)
return;

var images =
getProductImages(p);

if(images.length<=1)
return;

if(
detailImageIndexes[id]===undefined
){

detailImageIndexes[id]=0;

}

detailImageIndexes[id]+=amount;

if(
detailImageIndexes[id]<0
){

detailImageIndexes[id]=
images.length-1;

}

if(
detailImageIndexes[id]>=images.length
){

detailImageIndexes[id]=0;

}

var img =
document.getElementById(
"detailMainImage"
);

if(img){

img.src =
images[
detailImageIndexes[id]
];

}

document
.querySelectorAll(".detail-dot")
.forEach(
(dot,index)=>{

dot.classList.toggle(
"active",
index ===
detailImageIndexes[id]
);

}
);

}


function changeTempQty(amount){

tempQty+=amount;

if(tempQty<1)
tempQty=1;

if(tempQty>99)
tempQty=99;

var el =
document.getElementById(
"tempQty"
);

if(el)
el.textContent=tempQty;

}


/* =========================

function addToCart(id,qty){

qty =
Number(qty || 1);

var p =
products.find(
x =>
String(x.id)===String(id)
);

if(!p)
return;

if(
Number(p.stock || 0)<=0
){

showToast(
"این محصول موجود نیست"
);

return;

}

var item =
cart.find(
x =>
String(x.id)===String(id)
);

var currentQty =
item
?
Number(item.qty || 0)
:
0;

if(
currentQty + qty >
Number(p.stock || 0)
){

showToast(
"تعداد انتخابی بیشتر از موجودی است"
);

return;

}

if(item){

item.qty+=qty;

}else{

cart.push({
id:p.id,
qty:qty
});

}

saveData();

showToast(
"محصول به سبد خرید اضافه شد"
);

}


function updateCartCount(){

var count =
cart.reduce(
(sum,item)=>
sum +
Number(item.qty || 0),
0
);

var el =
document.getElementById(
"cartCount"
);

if(el)
el.textContent=count;

}


function cartQty(id,amount){

var item =
cart.find(
x =>
String(x.id)===String(id)
);

if(!item)
return;

var p =
products.find(
x =>
String(x.id)===String(id)
);

item.qty+=amount;

if(p){

if(
item.qty >
Number(p.stock || 0)
){

item.qty =
Number(p.stock || 0);

}

}

if(item.qty<1){

cart =
cart.filter(
x =>
String(x.id)!==
String(id)
);

}

saveData();

renderCart();

}


function removeFromCart(id){

cart =
cart.filter(
x =>
String(x.id)!==
String(id)
);

saveData();

renderCart();

showToast(
"محصول از سبد حذف شد"
);

}

function copyText(text){

if(
navigator.clipboard &&
navigator.clipboard.writeText
){

navigator.clipboard.writeText(
text
).then(()=>{

showToast(
"کپی شد ✓"
);

}).catch(()=>{

fallbackCopy(text);

});

}else{

fallbackCopy(text);

}

}


function fallbackCopy(text){

var area =
document.createElement(
"textarea"
);

area.value=text;

document.body.appendChild(
area
);

area.select();

document.execCommand(
"copy"
);

area.remove();

showToast(
"کپی شد ✓"
);

}

function showToast(message){

var toast =
document.getElementById(
"toast"
);

if(!toast)
return;

toast.textContent =
message;

toast.classList.add(
"show"
);

clearTimeout(

);

window.toastTimer =
setTimeout(
()=>{

toast.classList.remove(
"show"
);

},
2500
);

}


/* =========================
ESCAPE HTML
========================= */

function escapeHTML(text){

return String(
text ?? ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* برای قرار دادن متن داخل onclick */
function escapeJS(text){

return String(
text ?? ""
)

.replace(
/\\/g,
"\\\\"
)

.replace(
/'/g,
"\\'"
)

.replace(
/"/g,
'\\"'
)

.replace(
/\n/g,
"\\n"
)

.replace(
/\r/g,
"\\r"
);

}
