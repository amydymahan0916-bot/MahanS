<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>ماهان سنتر ایران</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --green:#19e66b;
    --green2:#0bbf55;
    --yellow:#ffd21c;
    --red:#ff4545;
    --bg:#050505;
    --bg2:#0b0b0b;
    --card:#101010;
    --border:rgba(255,255,255,.09);
    --text:#fff;
    --muted:#a7a7a7;
}

html{
    scroll-behavior:auto;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:
        radial-gradient(circle at 15% 10%,rgba(25,230,107,.08),transparent 25%),
        radial-gradient(circle at 85% 20%,rgba(255,210,28,.05),transparent 25%),
        var(--bg);
    color:var(--text);
    min-height:100vh;
}

button,
input,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

a{
    color:inherit;
    text-decoration:none;
}

/* ================= HEADER ================= */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(5,5,5,.94);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(255,255,255,.07);
    padding:12px 18px 10px;
}

.header-main{
    max-width:1250px;
    margin:auto;
    display:flex;
    align-items:center;
    gap:14px;
}

.logo-box{
    flex-shrink:0;
}

.logo img{
    width:68px;
    height:68px;
    object-fit:cover;
    border-radius:50%;
    border:2px solid var(--green);
    box-shadow:
        0 0 0 3px rgba(25,230,107,.08),
        0 0 18px rgba(25,230,107,.18);
}

.search-box{
    flex:1;
    position:relative;
}

.search-box input{
    width:100%;
    height:48px;
    background:#101010;
    border:1px solid rgba(255,255,255,.1);
    color:#fff;
    border-radius:15px;
    padding:0 18px;
    outline:none;
    transition:.25s;
}

.search-box input:focus{
    border-color:var(--green);
    box-shadow:0 0 20px rgba(25,230,107,.1);
}

.search-box input::placeholder{
    color:#777;
}

.header-actions{
    display:flex;
    gap:9px;
}

.action-btn{
    position:relative;
    width:48px;
    height:48px;
    border-radius:15px;
    border:1px solid rgba(255,255,255,.1);
    background:linear-gradient(145deg,#181818,#0c0c0c);
    color:#fff;
    font-size:21px;
    transition:.25s;
}

.action-btn:hover{
    transform:translateY(-2px);
    border-color:var(--green);
    box-shadow:0 8px 25px rgba(25,230,107,.12);
}

.badge{
    position:absolute;
    top:-5px;
    left:-5px;
    min-width:19px;
    height:19px;
    padding:0 5px;
    border-radius:20px;
    background:var(--green);
    color:#000;
    font-size:10px;
    font-weight:bold;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* ================= NAV ================= */

.nav-shell{
    max-width:1250px;
    margin:10px auto 0;
    padding:4px;
    border-radius:18px;
    background:
        linear-gradient(135deg,
        rgba(25,230,107,.13),
        rgba(255,210,28,.08),
        rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.08);
}

.nav{
    display:flex;
    gap:7px;
    overflow-x:auto;
    scrollbar-width:none;
    padding:3px;
}

.nav::-webkit-scrollbar{
    display:none;
}

.nav a{
    flex:0 0 auto;
    padding:10px 17px;
    border-radius:13px;
    color:#bbb;
    font-size:13px;
    transition:.25s;
    white-space:nowrap;
}

.nav a:hover,
.nav a.active{
    color:#000;
    background:var(--green);
    font-weight:bold;
    box-shadow:0 5px 18px rgba(25,230,107,.15);
}

/* ================= MAIN ================= */

main{
    max-width:1250px;
    margin:auto;
    padding:18px;
}

.page{
    animation:pageIn .3s ease;
}

@keyframes pageIn{
    from{
        opacity:0;
        transform:translateY(8px);
    }
    to{
        opacity:1;
        transform:none;
    }
}

/* ================= HOME ================= */

.home-page{
    min-height:calc(100vh - 175px);
    display:flex;
    align-items:center;
    justify-content:center;
}

.home-intro{
    width:100%;
    text-align:center;
    padding:22px;
    border-radius:28px;
    border:1px solid rgba(25,230,107,.14);
    background:
        radial-gradient(circle at 50% 0%,rgba(25,230,107,.08),transparent 45%),
        linear-gradient(145deg,#101010,#080808);
    box-shadow:
        0 25px 70px rgba(0,0,0,.35),
        inset 0 0 50px rgba(25,230,107,.025);
}

.home-intro h1{
    font-size:clamp(28px,5vw,52px);
    margin-bottom:13px;
    background:linear-gradient(90deg,#fff,var(--green),#fff);
    -webkit-background-clip:text;
    color:transparent;
    font-weight:900;
}

.home-intro .welcome{
    color:var(--yellow);
    font-size:14px;
    margin-bottom:13px;
    font-weight:bold;
}

.home-text{
    color:#c8c8c8;
    line-height:2;
    font-size:14px;
    max-width:850px;
    margin:auto;
}

.home-stats{
    margin:20px auto 0;
    max-width:900px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.stat-card{
    padding:15px 10px;
    border-radius:17px;
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.08);
}

.stat-icon{
    font-size:22px;
    margin-bottom:6px;
}

.stat-value{
    font-size:22px;
    color:var(--green);
    font-weight:900;
}

.stat-title{
    color:#999;
    font-size:11px;
    margin-top:4px;
}

/* ================= TITLES ================= */

.section-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:18px;
}

.section-title h2{
    font-size:22px;
}

.section-title span{
    color:var(--muted);
    font-size:12px;
}

/* ================= CATEGORIES ================= */

.category-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
}

.category-card{
    position:relative;
    overflow:hidden;
    min-height:170px;
    border-radius:22px;
    border:1px solid rgba(255,255,255,.08);
    background:#101010;
    transition:.3s;
    cursor:pointer;
}

.category-card:hover{
    transform:translateY(-5px);
    border-color:var(--green);
    box-shadow:0 15px 35px rgba(25,230,107,.1);
}

.category-card img{
    width:100%;
    height:170px;
    object-fit:cover;
    display:block;
    transition:.4s;
}

.category-card:hover img{
    transform:scale(1.05);
}

.category-overlay{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    padding:17px;
    background:linear-gradient(transparent 25%,rgba(0,0,0,.9));
}

.category-icon{
    font-size:26px;
    margin-bottom:5px;
}

.category-name{
    font-size:16px;
    font-weight:bold;
}

/* ================= TOOLBAR ================= */

.toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:17px;
    flex-wrap:wrap;
}

.sort-select{
    background:#111;
    color:#fff;
    border:1px solid rgba(255,255,255,.1);
    border-radius:12px;
    padding:10px 13px;
    outline:none;
}

.result-count{
    color:#999;
    font-size:12px;
}

/* ================= PRODUCTS ================= */

.products-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.product-card{
    position:relative;
    overflow:hidden;
    border-radius:20px;
    background:
        linear-gradient(145deg,#131313,#0b0b0b);
    border:1px solid rgba(255,255,255,.08);
    transition:.3s;
}

.product-card:hover{
    transform:translateY(-5px);
    border-color:rgba(25,230,107,.4);
    box-shadow:0 15px 35px rgba(0,0,0,.4);
}

.product-image{
    position:relative;
    height:225px;
    background:#080808;
    overflow:hidden;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.image-arrow{
    position:absolute;
    right:9px;
    top:50%;
    transform:translateY(-50%);
    width:34px;
    height:34px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(0,0,0,.65);
    color:#fff;
    z-index:3;
}

.image-arrow:hover{
    background:var(--green);
    color:#000;
}

.image-counter{
    position:absolute;
    bottom:9px;
    left:9px;
    background:rgba(0,0,0,.7);
    border-radius:20px;
    padding:4px 8px;
    font-size:10px;
}

.discount{
    position:absolute;
    top:10px;
    right:10px;
    z-index:4;
    background:var(--red);
    color:#fff;
    border-radius:9px;
    padding:5px 8px;
    font-size:10px;
    font-weight:bold;
}

.product-fav{
    position:absolute;
    left:10px;
    top:10px;
    z-index:5;
    width:35px;
    height:35px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(0,0,0,.65);
    color:#fff;
    font-size:17px;
}

.product-fav.active{
    color:#ff4040;
}

.product-info{
    padding:13px;
}

.product-name{
    font-size:14px;
    font-weight:bold;
    min-height:40px;
    line-height:1.8;
}

.product-meta{
    display:flex;
    gap:5px;
    flex-wrap:wrap;
    margin:7px 0;
}

.tag{
    padding:4px 7px;
    background:rgba(255,255,255,.05);
    color:#aaa;
    border-radius:7px;
    font-size:9px;
}

.price{
    font-size:17px;
    color:var(--yellow);
    font-weight:900;
}

.old-price{
    color:#666;
    text-decoration:line-through;
    font-size:11px;
    margin-right:6px;
}

.stock{
    margin-top:8px;
    font-size:10px;
}

.stock.green{
    color:#23df70;
}

.stock.yellow{
    color:var(--yellow);
}

.stock.red{
    color:#ff4545;
}

.product-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    margin-top:11px;
}

.btn{
    border:0;
    border-radius:11px;
    padding:10px 7px;
    font-size:11px;
    font-weight:bold;
    transition:.2s;
}

.btn:hover{
    transform:translateY(-2px);
}

.btn-green{
    background:var(--green);
    color:#000;
}

.btn-dark{
    background:#1b1b1b;
    color:#fff;
    border:1px solid rgba(255,255,255,.08);
}

/* ================= DETAIL ================= */

.detail{
    max-width:1050px;
    margin:auto;
}

.back-btn{
    margin-bottom:15px;
    background:#111;
    border:1px solid rgba(255,255,255,.1);
    color:#fff;
    border-radius:12px;
    padding:10px 15px;
}

.detail-box{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
    background:#0d0d0d;
    border:1px solid rgba(255,255,255,.08);
    border-radius:25px;
    padding:18px;
}

.detail-images{
    min-width:0;
}

.detail-main-image{
    position:relative;
    height:430px;
    border-radius:18px;
    overflow:hidden;
    background:#050505;
}

.detail-main-image img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.detail-thumbs{
    display:flex;
    gap:8px;
    margin-top:10px;
    overflow-x:auto;
}

.detail-thumb{
    flex:0 0 75px;
    height:65px;
    border-radius:10px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.1);
    cursor:pointer;
}

.detail-thumb.active{
    border-color:var(--green);
}

.detail-thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.detail-content h1{
    font-size:25px;
    line-height:1.7;
    margin-bottom:10px;
}

.detail-description{
    color:#aaa;
    line-height:2;
    font-size:13px;
    margin:15px 0;
}

.specs{
    margin-top:15px;
}

.spec-row{
    padding:10px 0;
    border-bottom:1px solid rgba(255,255,255,.06);
    color:#aaa;
    font-size:12px;
}

/* ================= EMPTY ================= */

.empty{
    text-align:center;
    padding:65px 20px;
    color:#777;
}

.empty-icon{
    font-size:45px;
    margin-bottom:12px;
}

.empty h3{
    color:#ddd;
    margin-bottom:8px;
}

/* ================= SUPPORT ================= */

.support-box{
    max-width:650px;
    margin:25px auto;
    display:grid;
    gap:12px;
}

.support-card{
    padding:20px;
    border-radius:20px;
    background:#101010;
    border:1px solid rgba(255,255,255,.08);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.support-info{
    display:flex;
    align-items:center;
    gap:13px;
}

.support-icon{
    width:45px;
    height:45px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:14px;
    background:rgba(25,230,107,.1);
    font-size:22px;
}

.support-label{
    color:#999;
    font-size:11px;
    margin-bottom:4px;
}

.support-value{
    font-size:14px;
    direction:ltr;
}

/* ================= RULES ================= */

.rules-box{
    max-width:900px;
    margin:auto;
    min-height:300px;
    border-radius:22px;
    background:#101010;
    border:1px solid rgba(255,255,255,.08);
    padding:25px;
}

.rules-box h2{
    color:var(--yellow);
    margin-bottom:15px;
}

/* ================= CART ================= */

.cart-item{
    display:flex;
    align-items:center;
    gap:13px;
    background:#101010;
    border:1px solid rgba(255,255,255,.08);
    border-radius:17px;
    padding:12px;
    margin-bottom:10px;
}

.cart-item img{
    width:75px;
    height:75px;
    object-fit:cover;
    border-radius:12px;
}

.cart-item-info{
    flex:1;
}

.cart-item-name{
    font-size:13px;
    font-weight:bold;
    margin-bottom:6px;
}

.cart-total{
    margin-top:18px;
    padding:18px;
    border-radius:17px;
    background:#101010;
    border:1px solid rgba(25,230,107,.15);
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.total-price{
    color:var(--yellow);
    font-size:20px;
    font-weight:bold;
}

/* ================= TOAST ================= */

.toast{
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:5000;
    padding:13px 18px;
    background:#151515;
    border:1px solid var(--green);
    border-radius:13px;
    color:#fff;
    box-shadow:0 15px 40px rgba(0,0,0,.5);
    transform:translateY(120px);
    opacity:0;
    pointer-events:none;
    transition:.3s;
    font-size:12px;
}

.toast.show{
    transform:none;
    opacity:1;
}

/* ================= SUPPORT FLOAT ================= */

.support-float{
    position:fixed;
    left:18px;
    bottom:18px;
    z-index:1200;
    width:56px;
    height:56px;
    border-radius:50%;
    border:2px solid #000;
    background:var(--yellow);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    box-shadow:0 8px 30px rgba(255,210,28,.25);
    transition:.25s;
}

.support-float:hover{
    transform:scale(1.08);
}

/* ================= FOOTER ================= */

footer{
    border-top:1px solid rgba(255,255,255,.07);
    margin-top:30px;
    padding:25px 18px;
    background:#080808;
}

.footer-inner{
    max-width:1250px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    gap:15px;
    flex-wrap:wrap;
}

.footer-title{
    font-weight:bold;
    margin-bottom:8px;
}

.footer-text{
    color:#777;
    font-size:11px;
    line-height:2;
}

/* ================= RESPONSIVE ================= */

@media(max-width:1000px){
    .products-grid{
        grid-template-columns:repeat(3,1fr);
    }

    .detail-box{
        grid-template-columns:1fr;
    }
}

@media(max-width:700px){
    header{
        padding:9px 10px;
    }

    .header-main{
        flex-wrap:wrap;
    }

    .logo img{
        width:55px;
        height:55px;
    }

    .search-box{
        order:3;
        flex-basis:100%;
    }

    .search-box input{
        height:43px;
    }

    .action-btn{
        width:43px;
        height:43px;
    }

    main{
        padding:12px;
    }

    .home-page{
        min-height:calc(100vh - 180px);
    }

    .home-intro{
        padding:18px 12px;
        border-radius:22px;
    }

    .home-intro h1{
        font-size:28px;
    }

    .home-text{
        font-size:11px;
        line-height:1.9;
    }

    .home-stats{
        gap:7px;
        margin-top:13px;
    }

    .stat-card{
        padding:10px 5px;
    }

    .stat-value{
        font-size:17px;
    }

    .stat-title{
        font-size:9px;
    }

    .category-grid{
        grid-template-columns:repeat(3,1fr);
        gap:8px;
    }

    .category-card{
        min-height:105px;
        border-radius:14px;
    }

    .category-card img{
        height:105px;
    }

    .category-overlay{
        padding:8px 3px;
    }

    .category-icon{
        font-size:18px;
    }

    .category-name{
        font-size:10px;
    }

    .products-grid{
        grid-template-columns:repeat(2,1fr);
        gap:9px;
    }

    .product-image{
        height:170px;
    }

    .product-info{
        padding:9px;
    }

    .product-name{
        font-size:11px;
        min-height:35px;
    }

    .price{
        font-size:13px;
    }

    .product-actions{
        grid-template-columns:1fr;
    }

    .detail-main-image{
        height:300px;
    }

    .detail-content h1{
        font-size:20px;
    }

    .support-card{
        padding:14px;
    }

    footer{
        display:none;
    }
}

@media(max-width:390px){
    .products-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .product-image{
        height:145px;
    }

    .category-name{
        font-size:9px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-main">

        <a href="#/" class="logo-box" onclick="event.preventDefault();go('/')">
            <div class="logo">
                <img src="logo.jpg" alt="ماهان سنتر ایران">
            </div>
        </a>

        <div class="search-box">
            <input
                id="globalSearch"
                type="search"
                placeholder="جستجوی محصول..."
                autocomplete="off"
                onkeydown="if(event.key==='Enter')searchProducts()"
            >
        </div>

        <div class="header-actions">

            <button
                class="action-btn"
                onclick="go('/favorites')"
                title="علاقه‌مندی‌ها"
            >
                ❤️
                <span class="badge" id="favBadge">0</span>
            </button>

            <button
                class="action-btn"
                onclick="go('/cart')"
                title="سبد خرید"
            >
                🛒
                <span class="badge" id="cartBadge">0</span>
            </button>

        </div>
    </div>

    <div class="nav-shell">
        <nav class="nav">

            <a href="#/" onclick="event.preventDefault();go('/')">
                🏠 خانه
            </a>

            <a href="#/categories" onclick="event.preventDefault();go('/categories')">
                🗂 دسته‌بندی‌ها
            </a>

            <a href="#/discount" onclick="event.preventDefault();go('/discount')">
                🔥 تخفیف‌ها
            </a>

            <a href="#/rules" onclick="event.preventDefault();go('/rules')">
                📜 قوانین
            </a>

        </nav>
    </div>
</header>

<main id="app"></main>

<button class="support-float" onclick="go('/support')" title="پشتیبانی">
    👨🏻‍💻
</button>

<div id="toast" class="toast"></div>

<footer>
    <div class="footer-inner">

        <div>
            <div class="footer-title">ماهان سنتر ایران</div>
            <div class="footer-text">
                فروشگاه آنلاین ماهان سنتر ایران
            </div>
        </div>

        <div>
            <div class="footer-title">دسترسی سریع</div>
            <div class="footer-text">

/* =========================================================
   ابزارها
========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function formatPrice(value){

    const number = Number(
        String(value ?? "")
            .replace(/[^\d.]/g,"")
    );

    if(!Number.isFinite(number) || number <= 0){
        return "تماس بگیرید";
    }

    return number.toLocaleString("fa-IR") + " تومان";

}


function normalizeNumber(value){

    if(value === null || value === undefined){
        return 0;
    }

    const n = Number(
        String(value)
            .replace(/[٬,]/g,"")
            .replace(/[^\d.-]/g,"")
    );

    return Number.isFinite(n) ? n : 0;

}


function parseImages(value){

    if(!value){
        return [];
    }

    if(Array.isArray(value)){
        return value.filter(Boolean).slice(0,3);
    }

    if(typeof value === "string"){

        const text = value.trim();

        if(!text){
            return [];
        }

        try{

            const parsed = JSON.parse(text);

            if(Array.isArray(parsed)){
                return parsed.filter(Boolean).slice(0,3);
            }

        }catch(e){}

        return text
            .split(/[,،|;\n]+/)
            .map(x => x.trim())
            .filter(Boolean)
            .slice(0,3);

    }

    return [];

}


function getProductImages(product){

    let images = [];

    images.push(
        ...parseImages(product.images)
    );

    if(product.image){
        images.push(product.image);
    }

    images = [...new Set(
        images.filter(Boolean)
    )];

    return images.length
        ? images.slice(0,3)
        : ["logo.jpg"];

}


function productId(product){

    return String(
        product.id ??
        product.code ??
        product._id ??
        product.name
    );

}


function getCategoryName(category){

    const key = String(category || "")
        .toLowerCase()
        .trim();

    if(categories[key]){
        return categories[key].name;
    }

    const map = {
        phone:"گوشی",
        phones:"گوشی",
        mobile:"گوشی",
        gold:"طلا",
        clothes:"پوشاک",
        clothing:"پوشاک",
        accessories:"لوازم جانبی",
        shoes:"کفش",
        watch:"ساعت"
    };

    return map[key] || category || "عمومی";

}


/* =========================================================
   دریافت محصولات
========================================================= */

async function loadProducts(){

    try{

        const response = await fetch(
            API_URL,
            {
                method:"GET",
                cache:"no-store"
            }
        );

        if(!response.ok){
            throw new Error("خطا در دریافت محصولات");
        }

        const data = await response.json();

        let list = [];

        if(Array.isArray(data)){
            list = data;
        }
        else if(Array.isArray(data.products)){
            list = data.products;
        }
        else if(Array.isArray(data.data)){
            list = data.data;
        }
        else if(data.products && typeof data.products === "object"){
            list = Object.values(data.products);
        }

        products = list.map((p,index)=>({

            ...p,

            id:p.id ?? p.code ?? index + 1,

            name:p.name ??
                 p.title ??
                 "محصول بدون نام",

            category:p.category ??
                     p.cat ??
                     "",

            brand:p.brand ?? "",

            goldCat:p.goldCat ?? "",

            price:p.price ??
                  p.amount ??
                  0,

            image:p.image ??
                  p.photo ??
                  "logo.jpg",

            images:p.images ??
                   p.photos ??
                   [],

            description:p.description ??
                        p.desc ??
                        "",

            specs:p.specs ??
                  {},

            stock:p.stock ??
                  p.inventory ??
                  p.quantity ??
                  0,

            discount:p.discount ??
                     p.off ??
                     0,

            createdAt:p.createdAt ??
                      p.created_at ??
                      "",

            updatedAt:p.updatedAt ??
                      p.updated_at ??
                      ""

        }));

    }catch(error){

        console.error(error);

        products = [];

        showToast("دریافت محصولات با مشکل مواجه شد");

    }

    render();

}


/* =========================================================
   مرتب‌سازی
========================================================= */

function sortProducts(list,mode){

    const copy = [...list];

    if(mode === "cheap"){

        return copy.sort(
            (a,b)=>
            normalizeNumber(a.price) -
            normalizeNumber(b.price)
        );

    }

    if(mode === "expensive"){

        return copy.sort(
            (a,b)=>
            normalizeNumber(b.price) -
            normalizeNumber(a.price)
        );

    }

    if(mode === "discount"){

        return copy.sort(
            (a,b)=>
            normalizeNumber(b.discount) -
            normalizeNumber(a.discount)
        );

    }

    return copy.sort((a,b)=>{

        const da =
            new Date(a.updatedAt || a.createdAt || 0).getTime();

        const db =
            new Date(b.updatedAt || b.createdAt || 0).getTime();

        if(db !== da){
            return db - da;
        }

        return Number(b.id || 0) - Number(a.id || 0);

    });

}

function addToCart(id){

    const product =
        products.find(p => String(productId(p)) === String(id));

    if(!product){
        return;
    }

    let cart = getCart();

    const existing =
        cart.find(
            item => String(item.id) === String(id)
        );

    if(existing){

        existing.quantity =
            Number(existing.quantity || 1) + 1;

    }else{

        cart.push({
            id:id,
            quantity:1
        });

    }

    setCart(cart);

    updateBadges();

    showToast("محصول به سبد خرید اضافه شد");

}


function removeFromCart(id){

    let cart = getCart()
        .filter(item =>
            String(item.id) !== String(id)
        );

    setCart(cart);

    updateBadges();

    render();

}


function changeCartQuantity(id,change){

    let cart = getCart();

    const item =
        cart.find(
            x => String(x.id) === String(id)
        );

    if(!item){
        return;
    }

    item.quantity =
        Number(item.quantity || 1) + change;

    if(item.quantity <= 0){

        cart = cart.filter(
            x => String(x.id) !== String(id)
        );

    }

    setCart(cart);

    updateBadges();

    render();

}


/* =========================================================
   Badge

function updateBadges(){

    const fav =
        getFavorites().length;

    const cart =
        getCart().reduce(
            (sum,item)=>
            sum + Number(item.quantity || 1),
            0
        );

    const favBadge =
        document.getElementById("favBadge");

    const cartBadge =
        document.getElementById("cartBadge");

    if(favBadge){
        favBadge.textContent =
            fav > 99 ? "99+" : fav;
    }

    if(cartBadge){
        cartBadge.textContent =
            cart > 99 ? "99+" : cart;
    }

}

}

/* =========================================================

========================================================= */

function sortBar(value){

    return `

        <div class="toolbar">

            <div class="result-count">
                ${products.length.toLocaleString("fa-IR")}
                محصول
            </div>

            <select
                class="sort-select"
                onchange="changeSort(this.value)"
            >

                <option value="new" ${value==="new"?"selected":""}>
                    جدیدترین
                </option>

                <option value="cheap" ${value==="cheap"?"selected":""}>
                    ارزان‌ترین
                </option>

                <option value="expensive" ${value==="expensive"?"selected":""}>
                    گران‌ترین
                </option>

                <option value="discount" ${value==="discount"?"selected":""}>
                    بیشترین تخفیف
                </option>

            </select>

        </div>

    `;

}


function changeSort(value){

    const hash =
        location.hash
            .replace(/^#/,"");

    if(hash.startsWith("/category/")){

        const key =
            decodeURIComponent(
                hash.split("/")[2] || ""
            );

        go(
            "/category/" +
            encodeURIComponent(key) +
            "?sort=" +
            encodeURIComponent(value)
        );

        return;

    }

    if(hash.startsWith("/search/")){

        const q =
            decodeURIComponent(
                hash.split("/")[2] || ""
            );

        go(
            "/search/" +
            encodeURIComponent(q) +
            "?sort=" +
            encodeURIComponent(value)
        );

        return;

    }

    if(hash === "/discount"){

        go(
            "/discount?sort=" +
            encodeURIComponent(value)
        );

    }

}


/* =========================================================
   خواندن Sort از URL
========================================================= */

function getSort(){

    const hash =
        location.hash
            .replace(/^#/,"");

    const match =
        hash.match(/[?&]sort=([^&]+)/);

    return match
        ? decodeURIComponent(match[1])
        : "new";

}


/* =========================================================
   Product Card
========================================================= */

function productCard(product){

    const id =
        productId(product);

    const images =
        getProductImages(product);

    currentProductImages[id] =
        images;

    if(
        imageIndexes[id] === undefined
    ){
        imageIndexes[id] = 0;
    }

    const index =
        imageIndexes[id] % images.length;

    const favorite =
        isFavorite(id);

    const discount =
        normalizeNumber(product.discount);

    const price =
        normalizeNumber(product.price);

    let oldPriceHTML = "";

    if(discount > 0 && price > 0){

        const oldPrice =
            Math.round(
                price /
                (1 - discount / 100)
            );

        oldPriceHTML = `
            <span class="old-price">
                ${formatPrice(oldPrice)}
            </span>
        `;

    }

    return `

        <article class="product-card">

            <div class="product-image">

                <img
                    src="${escapeHTML(images[index])}"
                    alt="${escapeHTML(product.name)}"
                    onerror="this.src='logo.jpg'"
                >

                ${
                    discount > 0
                    ? `
                        <div class="discount">
                            ${discount.toLocaleString("fa-IR")}٪ تخفیف
                        </div>
                    `
                    : ""
                }

                <button
                    class="product-fav ${favorite?"active":""}"
                    onclick="event.stopPropagation();toggleFavorite('${escapeHTML(id)}')"
                >
                    ${favorite ? "❤️" : "♡"}
                </button>

                ${
                    images.length > 1
                    ? `
                        <button
                            class="image-arrow"
                            onclick="event.stopPropagation();nextProductImage('${escapeHTML(id)}')"
                        >
                            ›
                        </button>

                        <div class="image-counter">
                            ${index + 1}/${images.length}
                        </div>
                    `
                    : ""
                }

            </div>

            <div class="product-info">

                <div
                    class="product-name"
                    onclick="go('/product/${encodeURIComponent(id)}')"
                    style="cursor:pointer"
                >
                    ${escapeHTML(product.name)}
                </div>

                <div class="product-meta">

                    ${
                        product.brand
                        ? `
                            <span class="tag">
                                ${escapeHTML(product.brand)}
                            </span>
                        `
                        : ""
                    }

                    <span class="tag">
                        ${escapeHTML(
                            getCategoryName(product.category)
                        )}
                    </span>

                </div>

                <div>
                    <span class="price">
                        ${formatPrice(price)}
                    </span>
                    ${oldPriceHTML}
                </div>

                ${stockHTML(product.stock)}

                <div class="product-actions">

                    <button
                        class="btn btn-dark"
                        onclick="go('/product/${encodeURIComponent(id)}')"
                    >
                        جزئیات
                    </button>

                    <button
                        class="btn btn-green"
                        onclick="addToCart('${escapeHTML(id)}')"
                    >
                        🛒 افزودن
                    </button>

                </div>

            </div>

        </article>

    `;

}


function nextProductImage(id){

    const images =
        currentProductImages[id];

    if(!images || images.length < 2){
        return;
    }

    imageIndexes[id] =
        (imageIndexes[id] + 1) %
        images.length;

    render();

}

function renderCategory(key){

    const list =
        products.filter(p => {

            const c =
                String(p.category || "")
                    .toLowerCase()
                    .trim();

            const aliases = {

                mobile:[
                    "mobile",
                    "phone",
                    "phones",
                    "گوشی",
                    "موبایل"
                ],

                gold:[
                    "gold",
                    "طلا"

                ],

                ],

                shoes:[
                    "shoes",
                    "کفش"
                ],

                watch:[
                    "watch",

                ]

            };

            return (
                c === key ||
                (aliases[key] || []).includes(c)

function renderDiscount(){

function renderSearch(query){

    const q =
        query.toLowerCase().trim();

    const list =
        products.filter(p => {

            const text = [

                p.name,
                p.brand,
                p.category,
                p.goldCat,
                p.description,
                p.search

            ]
            .join(" ")
            .toLowerCase();

            return text.includes(q);

        });

    return renderProducts(
        list,
        `🔎 نتیجه جستجو برای «${escapeHTML(query)}»`,
        getSort()
    );

}

/* =========================================================
   سبد خرید
========================================================= */

function renderCart(){

    const cart =
        getCart();

    if(!cart.length){

        return `

            <section class="page">

                <div class="section-title">
                    <h2>🛒 سبد خرید</h2>
                </div>

                <div class="empty">

                    <div class="empty-icon">
                        🛒
                    </div>

                    <h3>
                        سبد خرید خالی است
                    </h3>

                    <p>
                        هنوز محصولی به سبد خرید اضافه نکرده‌اید.
                    </p>

                </div>

            </section>

        `;

    }

    let total = 0;

    const items =
        cart.map(item => {

            const product =
                products.find(
                    p =>
                    String(productId(p)) ===
                    String(item.id)
                );

            if(!product){
                return "";
            }

            const quantity =
                Number(item.quantity || 1);

            total +=
                normalizeNumber(product.price) *
                quantity;

            const images =
                getProductImages(product);

            return `

                <div class="cart-item">

                    <img
                        src="${escapeHTML(images[0])}"
                        alt="${escapeHTML(product.name)}"
                        onerror="this.src='logo.jpg'"
                    >

                    <div class="cart-item-info">

                        <div class="cart-item-name">
                            ${escapeHTML(product.name)}
                        </div>

                        <div class="price">
                            ${formatPrice(product.price)}
                        </div>

                        <div style="margin-top:8px;display:flex;align-items:center;gap:6px">

                            <button
                                class="btn btn-dark"
                                onclick="changeCartQuantity('${escapeHTML(productId(product))}',-1)"
                            >
                                −
                            </button>

                            <span>
                                ${quantity.toLocaleString("fa-IR")}
                            </span>

                            <button
                                class="btn btn-dark"
                                onclick="changeCartQuantity('${escapeHTML(productId(product))}',1)"
                            >
                                +
                            </button>

                        </div>

                    </div>

                    <button
                        class="btn btn-dark"
                        onclick="removeFromCart('${escapeHTML(productId(product))}')"
                    >
                        حذف
                    </button>

                </div>

            `;

        })
        .join("");

    return `

        <section class="page">

            <div class="section-title">
                <h2>🛒 سبد خرید</h2>
            </div>

            ${items}

            <div class="cart-total">

                <strong>
                    مبلغ کل
                </strong>

                <span class="total-price">
                    ${formatPrice(total)}
                </span>

            </div>

        </section>

    `;

}


/* =========================================================
   جزئیات محصول
========================================================= */

function renderProduct(id){

    const product =
        products.find(
            p =>
            String(productId(p)) ===
            String(id)
        );

    if(!product){

        return `

            <section class="page">
                <div class="empty">
                    <div class="empty-icon">❌</div>
                    <h3>محصول پیدا نشد</h3>
                </div>
            </section>

        `;

    }

    const images =
        getProductImages(product);

    if(
        imageIndexes[id] === undefined
    ){
        imageIndexes[id] = 0;
    }

    const active =
        imageIndexes[id] % images.length;

    const discount =
        normalizeNumber(product.discount);

    let specsHTML = "";

    if(product.specs){

        if(typeof product.specs === "object"){

            specsHTML =
                Object.entries(product.specs)
                    .map(([key,value])=>`

                        <div class="spec-row">
                            <strong>
                                ${escapeHTML(key)}
                            </strong>
                            :
                            ${escapeHTML(value)}
                        </div>

                    `)
                    .join("");

        }else{

            specsHTML = `

                <div class="spec-row">
                    ${escapeHTML(product.specs)}
                </div>

            `;

        }

    }

    return `

        <section class="page detail">

            <button
                class="back-btn"
                onclick="history.back()"
            >
                ← بازگشت
            </button>

            <div class="detail-box">

                <div class="detail-images">

                    <div class="detail-main-image">

                        <img
                            src="${escapeHTML(images[active])}"
                            alt="${escapeHTML(product.name)}"
                            onerror="this.src='logo.jpg'"
                        >

                        ${
                            images.length > 1
                            ? `
                                <button
                                    class="image-arrow"
                                    onclick="nextProductImage('${escapeHTML(id)}')"
                                >
                                    ›
                                </button>
                            `
                            : ""
                        }

                    </div>

                    ${
                        images.length > 1
                        ? `
                            <div class="detail-thumbs">

                                ${images.map((img,index)=>`

                                    <div
                                        class="detail-thumb ${index===active?"active":""}"
                                        onclick="imageIndexes['${escapeHTML(id)}']=${index};render()"
                                    >

                                        <img
                                            src="${escapeHTML(img)}"
                                            alt=""
                                            onerror="this.src='logo.jpg'"
                                        >

                                    </div>

                                `).join("")}

                            </div>
                        `
                        : ""
                    }

                </div>

                <div class="detail-content">

                    <h1>
                        ${escapeHTML(product.name)}
                    </h1>

                    <div class="product-meta">

                        ${
                            product.brand
                            ? `
                                <span class="tag">
                                    برند:
                                    ${escapeHTML(product.brand)}
                                </span>
                            `
                            : ""
                        }

                        <span class="tag">
                            ${escapeHTML(
                                getCategoryName(product.category)
                            )}
                        </span>

                    </div>

                    <div style="margin-top:14px">

                        <span class="price">
                            ${formatPrice(product.price)}
                        </span>

                        ${
                            discount > 0
                            ? `
                                <span class="discount" style="position:static;display:inline-block;margin-right:8px">
                                    ${discount.toLocaleString("fa-IR")}٪ تخفیف
                                </span>
                            `
                            : ""
                        }

                    </div>

                    ${stockHTML(product.stock)}

                    ${
                        product.description
                        ? `
                            <div class="detail-description">
                                ${escapeHTML(product.description)}
                            </div>
                        `
                        : ""
                    }

                    ${
                        specsHTML
                        ? `
                            <div class="specs">
                                <h3 style="margin-bottom:8px">
                                    مشخصات
                                </h3>

                                ${specsHTML}
                            </div>
                        `
                        : ""
                    }

                    <div
                        style="
                        display:grid;
                        grid-template-columns:1fr 1fr;
                        gap:9px;
                        margin-top:20px
                        "
                    >

                        <button
                            class="btn btn-green"
                            onclick="addToCart('${escapeHTML(id)}')"
                        >
                            🛒 افزودن به سبد
                        </button>

                        <button
                            class="btn btn-dark"
                            onclick="toggleFavorite('${escapeHTML(id)}')"
                        >
                            ${isFavorite(id) ? "❤️ حذف علاقه‌مندی" : "♡ علاقه‌مندی"}
                        </button>

                    </div>

                </div>

            </div>

        </section>

    `;

}

/* =========================================================
   Router اصلی
========================================================= */

function render(){

    const hash =
        location.hash
            .replace(/^#/,"") || "/";

    const clean =
        hash.split("?")[0];

    let html = "";

    if(clean === "/"){

        html =
            renderHome();

    }

    else if(clean === "/categories"){

        html =
            renderCategories();

    }

    else if(clean === "/discount"){

        html =
            renderDiscount();

    }

    else if(clean === "/favorites"){

        html =
            renderFavorites();

    }

    else if(clean === "/cart"){

        html =
            renderCart();

    }

    else if(clean === "/support"){

        html =
            renderSupport();

    }

    else if(clean === "/rules"){

        html =
            renderRules();

    }

    else if(clean.startsWith("/category/")){

        const key =
            decodeURIComponent(
                clean.split("/")[2] || ""
            );

        html =
            renderCategory(key);

    }

    else if(clean.startsWith("/product/")){

        const id =
            decodeURIComponent(
                clean.split("/")[2] || ""
            );

        html =
            renderProduct(id);

    }

    else if(clean.startsWith("/search/")){

        const q =
            decodeURIComponent(
                clean.split("/")[2] || ""
            );

        html =
            renderSearch(q);

    }

    else{

        html =
            renderHome();

    }

    document.getElementById("app").innerHTML =
        html;

    updateBadges();

    updateNav();

    const search =
        document.getElementById("globalSearch");

    if(search){

        if(clean.startsWith("/search/")){

            search.value =
                decodeURIComponent(
                    clean.split("/")[2] || ""
                );

        }else{

            search.value = "";

        }

    }

    window.scrollTo(0,0);

}


/* =========================================================
   فعال کردن Nav
========================================================= */

function updateNav(){

    const current =
        location.hash
            .replace(/^#/,"")
            .split("?")[0];

    document
        .querySelectorAll(".nav a")
        .forEach(a=>{

            const href =
                a.getAttribute("href") || "";

            const path =
                href.replace(/^#/,"");

            let active = false;

            if(path === "/" && current === "/"){
                active = true;
            }

            if(
                path === "/categories" &&
                (
                    current === "/categories" ||
                    current.startsWith("/category/")
                )
            ){
                active = true;
            }

            if(
                path === "/discount" &&
                current === "/discount"
            ){
                active = true;
            }

            if(
                path === "/rules" &&
                current === "/rules"
            ){
                active = true;
            }

            a.classList.toggle(
                "active",
                active
            );

        });

}
