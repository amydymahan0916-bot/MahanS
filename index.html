<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>ماهان سنتر ایران</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --red:#e50914;
    --red2:#ff2535;
    --green:#00e676;
    --yellow:#ffd600;
    --bg:#070707;
    --card:#111;
    --card2:#181818;
    --border:#292929;
    --text:#fff;
    --muted:#999;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.7;
}

button,input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

a{
    color:inherit;
    text-decoration:none;
}

.container{
    width:92%;
    max-width:1250px;
    margin:auto;
}

/* ================= HEADER ================= */

header{
    position:fixed;
    top:0;
    right:0;
    left:0;
    height:150px;
    z-index:1000;
    background:rgba(7,7,7,.96);
    backdrop-filter:blur(18px);
    border-bottom:1px solid #222;
}

.header-main{
    height:100px;
    display:flex;
    align-items:center;
    gap:20px;
}

.logo{
    display:flex;
    align-items:center;
    gap:13px;
    min-width:max-content;
}

.logo img{
    width:67px;
    height:67px;
    object-fit:cover;
    border-radius:50%;
    border:3px solid var(--green);
    box-shadow:
        0 0 0 3px #111,
        0 0 15px rgba(0,230,118,.35);
}

.logo-name{
    font-size:23px;
    font-weight:bold;
}

.logo-name span{
    color:var(--red);
}

.search-box{
    flex:1;
    max-width:600px;
    height:48px;
    display:flex;
    background:#151515;
    border:1px solid #333;
    border-radius:14px;
    overflow:hidden;
}

.search-box input{
    flex:1;
    min-width:0;
    border:0;
    outline:0;
    background:none;
    color:white;
    padding:0 16px;
    font-size:13px;
}

.search-box button{
    width:58px;
    border:0;
    background:var(--red);
    color:#fff;
    font-size:22px;
}

.header-actions{
    display:flex;
    gap:8px;
}

.header-btn{
    width:50px;
    height:50px;
    border-radius:15px;
    border:1px solid #333;
    background:linear-gradient(145deg,#1b1b1b,#0e0e0e);
    color:white;
    position:relative;
    font-size:21px;
    transition:.2s;
}

.header-btn:hover{
    transform:translateY(-2px);
    border-color:var(--red);
    box-shadow:0 7px 20px rgba(229,9,20,.18);
}

.cart-count{
    position:absolute;
    top:-6px;
    left:-6px;
    min-width:21px;
    height:21px;
    padding:0 5px;
    border-radius:50px;
    background:var(--red);
    color:white;
    font-size:10px;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* ================= NAV ================= */

.navbar{
    height:50px;
    border-top:1px solid #181818;
}

.nav{
    height:50px;
    display:flex;
    align-items:center;
    gap:7px;
    overflow-x:auto;
    scrollbar-width:none;
    padding-bottom:3px;
}

.nav::-webkit-scrollbar{
    display:none;
}

.nav a{
    flex:0 0 auto;
    white-space:nowrap;
    padding:6px 17px;
    border-radius:10px;
    color:#aaa;
    font-size:12px;
    border:1px solid transparent;
    transition:.2s;
}

.nav a:hover,
.nav a.active{
    color:white;
    background:var(--red);
    border-color:var(--red);
}

/* ================= APP ================= */

#app{
    position:fixed;
    top:150px;
    right:0;
    left:0;
    bottom:0;
    overflow:hidden;
}

.page{
    width:100%;
    height:100%;
    padding:24px 0;
    overflow:hidden;
    animation:pageIn .2s ease;
}

@keyframes pageIn{
    from{
        opacity:0;
        transform:translateY(7px);
    }
    to{
        opacity:1;
        transform:none;
    }
}

/* ================= HOME ================= */

.home-wrap{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
}

.home-card{
    width:100%;
    min-height:calc(100vh - 205px);
    max-height:calc(100vh - 180px);
    border:1px solid #303030;
    border-radius:28px;
    background:
        radial-gradient(
            circle at 15% 50%,
            rgba(229,9,20,.18),
            transparent 35%
        ),
        radial-gradient(
            circle at 85% 20%,
            rgba(0,230,118,.08),
            transparent 30%
        ),
        linear-gradient(135deg,#151515,#080808);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:35px;
    position:relative;
    overflow:hidden;
}

.home-content{
    max-width:850px;
}

.welcome-badge{
    display:inline-block;
    padding:6px 18px;
    border-radius:50px;
    background:#e50914;
    font-size:11px;
    margin-bottom:17px;
    box-shadow:0 8px 25px rgba(229,9,20,.22);
}

.home-content h1{
    font-size:clamp(30px,5vw,58px);
    margin-bottom:18px;
    line-height:1.35;
}

.home-content h1 span{
    color:var(--red);
}

.intro-text{
    color:#aaa;
    font-size:14px;
    line-height:2.15;
    max-width:760px;
    margin:auto;
}

.home-stats{
    margin-top:30px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.stat-box{
    padding:16px;
    border:1px solid #292929;
    border-radius:16px;
    background:rgba(255,255,255,.025);
}

.stat-box strong{
    display:block;
    font-size:22px;
    color:white;
}

.stat-box span{
    color:#888;
    font-size:11px;
}

/* ================= CATEGORY MENU ================= */

.categories{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.category{
    height:145px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    position:relative;
    overflow:hidden;
    transition:.2s;
}

.category:hover{
    transform:translateY(-4px);
    border-color:var(--red);
}

.category-image{
    width:100%;
    height:100%;
    position:absolute;
    inset:0;
    opacity:.22;
    background-size:cover;
    background-position:center;
}

.category-overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(
        to top,
        rgba(0,0,0,.95),
        rgba(0,0,0,.25)
    );
}

.category-content{
    position:relative;
    z-index:2;
    text-align:center;
}

.category-icon{
    font-size:38px;
}

.category-name{
    font-size:14px;
    font-weight:bold;
}

/* ================= PAGE TITLE ================= */

.page-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:17px;
}

.page-title h1{
    font-size:27px;
}

.page-title p{
    color:#888;
    font-size:11px;
}

/* ================= SORT ================= */

.sort-box{
    display:flex;
    gap:7px;
    margin-bottom:15px;
    overflow-x:auto;
    scrollbar-width:none;
}

.sort-box::-webkit-scrollbar{
    display:none;
}

.sort-btn{
    flex:0 0 auto;
    border:1px solid #333;
    background:#151515;
    color:#aaa;
    border-radius:10px;
    padding:7px 13px;
    font-size:11px;
}

.sort-btn.active,
.sort-btn:hover{
    background:var(--red);
    color:white;
    border-color:var(--red);
}

/* ================= PRODUCTS ================= */

.products{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:13px;
    max-height:calc(100vh - 295px);
    overflow:hidden;
}

.product-card{
    position:relative;
    overflow:hidden;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:17px;
    transition:.2s;
}

.product-card:hover{
    transform:translateY(-4px);
    border-color:#555;
}

.product-image{
    height:175px;
    background:#1b1b1b;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:contain;
    padding:10px;
}

.image-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:29px;
    height:29px;
    border:0;
    border-radius:50%;
    background:rgba(0,0,0,.75);
    color:white;
    z-index:4;
}

.image-arrow.prev{
    right:7px;
}

.image-arrow.next{
    left:7px;
}

.image-counter{
    position:absolute;
    bottom:7px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,.7);
    border-radius:30px;
    padding:1px 8px;
    font-size:9px;
    color:#ccc;
}

.favorite{
    position:absolute;
    top:9px;
    left:9px;
    width:35px;
    height:35px;
    border-radius:50%;
    border:1px solid #333;
    background:rgba(0,0,0,.75);
    color:white;
    font-size:17px;
    z-index:5;
}

.favorite.active{
    color:#ff3344;
}

.product-info{
    padding:12px;
}

.product-title{
    font-size:14px;
    margin-bottom:3px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.product-desc{
    color:#777;
    font-size:10px;
    height:34px;
    overflow:hidden;
}

.product-price{
    margin-top:7px;
    font-weight:bold;
    font-size:15px;
}

.product-price small{
    color:#888;
    font-size:9px;
    font-weight:normal;
}

.discount-badge{
    display:inline-block;
    margin-right:5px;
    padding:2px 6px;
    border-radius:5px;
    background:#8b0000;
    color:#fff;
    font-size:9px;
}

.product-actions{
    display:flex;
    gap:7px;
    padding:0 12px 12px;
}

.product-actions button{
    flex:1;
    padding:7px;
    border-radius:9px;
    border:1px solid #333;
    background:#191919;
    color:white;
    font-size:10px;
}

.product-actions .buy{
    background:var(--red);
    border-color:var(--red);
}

/* ================= PRODUCT DETAIL ================= */

.detail-page{
    height:100%;
    display:flex;
    align-items:center;
}

.product-detail{
    width:100%;
    max-height:calc(100vh - 205px);
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
    background:#101010;
    border:1px solid var(--border);
    border-radius:24px;
    padding:20px;
    overflow:hidden;
}

.detail-image{
    min-height:400px;
    background:#191919;
    border-radius:18px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.detail-image img{
    width:100%;
    height:100%;
    object-fit:contain;
    padding:25px;
}

.detail-info{
    padding:12px 5px;
    overflow:hidden;
}

.detail-info h1{
    font-size:29px;
    margin-bottom:8px;
}

.detail-desc{
    color:#999;
    font-size:12px;
    max-height:75px;
    overflow:hidden;
    margin-bottom:12px;
}

.price-old{
    color:#777;
    text-decoration:line-through;
    font-size:12px;
}

.detail-price{
    font-size:25px;
    font-weight:bold;
    margin-bottom:10px;
}

.detail-price small{
    font-size:11px;
    color:#888;
}

.discount-info{
    color:#ff5662;
    font-size:12px;
    margin-bottom:12px;
}

.stock{
    padding:9px 12px;
    border-radius:10px;
    background:#181818;
    border:1px solid #292929;
    font-size:12px;
    margin-bottom:13px;
}

.product-specs{
    border:1px solid var(--border);
    border-radius:13px;
    overflow:hidden;
    margin-bottom:14px;
}

.product-specs-title{
    padding:9px 12px;
    background:#181818;
    font-size:12px;
    font-weight:bold;
}

.product-specs-text{
    padding:11px;
    color:#aaa;
    font-size:11px;
    line-height:1.9;
    max-height:95px;
    overflow:hidden;
}

.quantity{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:13px;
}

.quantity button{
    width:35px;
    height:35px;
    border:1px solid #333;
    background:#191919;
    color:white;
    border-radius:8px;
}

.quantity strong{
    min-width:25px;
    text-align:center;
}

.primary-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border:0;
    background:var(--red);
    color:white;
    padding:10px 19px;
    border-radius:10px;
    font-weight:bold;
    font-size:12px;
}

.secondary-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border:1px solid #333;
    background:#171717;
    color:white;
    padding:9px 17px;
    border-radius:10px;
    font-size:11px;
}

/* ================= CART ================= */

.cart-page{
    max-width:900px;
    margin:auto;
    height:100%;
    overflow:hidden;
}

.cart-list{
    max-height:calc(100vh - 360px);
    overflow:hidden;
}

.cart-item{
    display:flex;
    align-items:center;
    gap:13px;
    padding:11px;
    margin-bottom:8px;
    border:1px solid var(--border);
    background:var(--card);
    border-radius:14px;
}

.cart-icon{
    width:65px;
    height:65px;
    border-radius:11px;
    background:#202020;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    flex-shrink:0;
}

.cart-icon img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.cart-item-info{
    flex:1;
}

.cart-item-info h3{
    font-size:13px;
}

.cart-item-info p{
    color:#888;
    font-size:10px;
}

.qty{
    display:flex;
    align-items:center;
    gap:6px;
}

.qty button{
    width:29px;
    height:29px;
    border-radius:7px;
    border:1px solid #333;
    background:#1c1c1c;
    color:white;
}

.remove{
    border:0;
    background:none;
    color:#888;
    font-size:18px;
}

.cart-summary{
    margin-top:10px;
    padding:15px;
    background:#121212;
    border:1px solid var(--border);
    border-radius:15px;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    margin-bottom:7px;
    font-size:12px;
}

.summary-row.total{
    padding-top:10px;
    border-top:1px solid #292929;
    font-size:17px;
    font-weight:bold;
}

/* ================= SUPPORT ================= */

.support-page{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
}

.support-card{
    width:100%;
    max-width:720px;
    background:
        radial-gradient(
            circle at 90% 10%,
            rgba(0,230,118,.12),
            transparent 35%
        ),
        linear-gradient(135deg,#171717,#0d0d0d);
    border:1px solid #303030;
    border-radius:27px;
    padding:30px;
}

.support-head{
    text-align:center;
    margin-bottom:23px;
}

.support-icon{
    width:75px;
    height:75px;
    margin:auto;
    border-radius:50%;
    background:var(--yellow);
    color:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:38px;
    box-shadow:0 10px 30px rgba(255,214,0,.18);
}

.support-head h1{
    margin-top:12px;
    font-size:28px;
}

.support-head p{
    color:#888;
    font-size:11px;
}

.contact-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:13px;
    border:1px solid #2d2d2d;
    background:#111;
    border-radius:14px;
    margin-bottom:10px;
}

.contact-info{
    flex:1;
}

.contact-label{
    color:#777;
    font-size:10px;
}

.contact-value{
    font-size:14px;
    direction:ltr;
    text-align:right;
}

.contact-buttons{
    display:flex;
    gap:6px;
}

.contact-buttons button,
.contact-buttons a{
    padding:8px 11px;
    border-radius:9px;
    border:1px solid #333;
    background:#1c1c1c;
    color:white;
    font-size:10px;
}

.contact-buttons .contact-main{
    background:var(--red);
    border-color:var(--red);
}

/* ================= LAWS ================= */

.law-page{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
}

.law-card{
    width:100%;
    max-width:850px;
    max-height:calc(100vh - 210px);
    padding:30px;
    border-radius:25px;
    background:#111;
    border:1px solid #2c2c2c;
    overflow:hidden;
}

.law-card h1{
    margin-bottom:18px;
}

.law-content{
    color:#aaa;
    font-size:13px;
    line-height:2.2;
    white-space:pre-line;
    max-height:330px;
    overflow:hidden;
}

/* ================= EMPTY ================= */

.no-result{
    text-align:center;
    padding:70px 10px;
    color:#888;
}

.no-result div{
    font-size:50px;
    margin-bottom:8px;
}

/* ================= SUPPORT FLOAT ================= */

.support-float{
    position:fixed;
    left:20px;
    bottom:20px;
    width:62px;
    height:62px;
    border-radius:50%;
    border:3px solid #151515;
    background:var(--yellow);
    color:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:31px;
    z-index:2000;
    box-shadow:
        0 8px 25px rgba(0,0,0,.5),
        0 0 20px rgba(255,214,0,.18);
    transition:.2s;
}

.support-float:hover{
    transform:scale(1.08);
}

/* ================= TOAST ================= */

.toast{
    position:fixed;
    bottom:25px;
    right:25px;
    z-index:3000;
    background:#171717;
    border:1px solid #333;
    border-right:4px solid var(--red);
    border-radius:13px;
    padding:12px 16px;
    box-shadow:0 15px 40px #000;
    transform:translateY(100px);
    opacity:0;
    transition:.3s;
    pointer-events:none;
    font-size:11px;
}

.toast.show{
    transform:translateY(0);
    opacity:1;
}

/* ================= LOADING ================= */

.loading{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:#aaa;
}

.loading div{
    font-size:45px;
    margin-bottom:10px;
}

/* ================= MOBILE ================= */

@media(max-width:950px){

    .header-main{
        gap:10px;
    }

    .logo-name{
        font-size:18px;
    }

    .logo img{
        width:58px;
        height:58px;
    }

    .search-box{
        order:3;
        flex-basis:100%;
        max-width:none;
    }

    header{
        height:155px;
    }

    #app{
        top:155px;
    }

    .products{
        grid-template-columns:repeat(2,1fr);
    }

    .categories{
        grid-template-columns:repeat(3,1fr);
    }

    .product-detail{
        grid-template-columns:1fr 1fr;
    }

    .detail-image{
        min-height:350px;
    }
}

@media(max-width:600px){

    .container{
        width:94%;
    }

    .header-main{
        height:105px;
    }

    header{
        height:155px;
    }

    #app{
        top:155px;
    }

    .logo-name{
        font-size:16px;
    }

    .logo img{
        width:52px;
        height:52px;
    }

    .header-btn{
        width:43px;
        height:43px;
        font-size:18px;
    }

    .categories{
        grid-template-columns:repeat(3,1fr);
        gap:7px;
    }

    .category{
        height:120px;
    }

    .category-icon{
        font-size:28px;
    }

    .category-name{
        font-size:10px;
    }

    .products{
        gap:8px;
    }

    .product-image{
        height:140px;
    }

    .product-info{
        padding:9px;
    }

    .product-title{
        font-size:12px;
    }

    .product-price{
        font-size:12px;
    }

    .product-actions{
        flex-direction:column;
    }

    .product-actions button{
        padding:7px;
    }

    .home-card{
        min-height:calc(100vh - 185px);
        padding:25px 18px;
    }

<script>

async function loadProducts(){

    try{

        const response = await fetch(
            "https://curly-cherry-da35.amydypiam064.workers.dev/products",
            {
                cache:"no-store"
            }
        );

        if(!response.ok){
            throw new Error(
                "خطای Worker: " + response.status
            );
        }

        const result = await response.json();

        const firebaseProducts =
            (result.documents || []).map(doc => {

                const f = doc.fields || {};

                const value =
                (name,fallback="") => {

                    if(!f[name]){
                        return fallback;
                    }

                    return (
                        f[name].stringValue ??
                        f[name].integerValue ??
                        f[name].doubleValue ??
                        f[name].booleanValue ??
                        fallback
                    );

                };

                const docId =
                    doc.name?.split("/").pop() || "";

                let images = [];

                /*
                 پشتیبانی از images
                 برای حداکثر 3 عکس
                */

                if(f.images){

                    if(f.images.arrayValue){

                        images =
                        (f.images.arrayValue.values || [])
                        .map(x =>
                            x.stringValue
                        )
                        .filter(Boolean);

                    }

                    else if(f.images.stringValue){

                        try{

                            const parsed =
                                JSON.parse(
                                    f.images.stringValue
                                );

                            if(Array.isArray(parsed)){
                                images = parsed;
                            }

                        }catch(e){}

                    }

                }

                const mainImage =
                    value("image","");

                if(
                    mainImage &&
                    !images.includes(mainImage)
                ){
                    images.unshift(mainImage);
                }

                images =
                    images
                    .filter(Boolean)
                    .slice(0,3);

                return {

                    id:
                    Number(
                        value("code",docId)
                    ) || 0,

                    cat:
                    value(
                        "category",
                        value("cat","digital")
                    ),

                    brand:
                    value("brand",""),

                    goldCat:
                    value("goldCat",""),

                    name:
                    value(
                        "name",
                        "محصول بدون نام"
                    ),

                    search:
                    value(
                        "search",
                        value("name","")
                    ),

                    price:
                    Number(
                        value("price",0)
                    ) || 0,

                    image:
                    mainImage,

                    images:images,

                    icon:
                    value(
                        "icon",
                        "🛍️"
                    ),

                    desc:
                    value(
                        "description",
                        value("desc","")
                    ),

                    specs:
                    value(
                        "specs",
                        ""
                    ),

                    stock:
                    Number(
                        value("stock",0)
                    ) || 0,

                    discount:
                    Number(
                        value("discount",0)
                    ) || 0,

                    createdAt:
                    value("createdAt","")

                };

            });

        firebaseProducts.sort(
            (a,b) => a.id-b.id
        );

        window.products =
            firebaseProducts;

        console.log(
            "تعداد محصولات:",
            firebaseProducts.length
        );

        window.dispatchEvent(
            new Event(
                "firebaseProductsLoaded"
            )
        );

    }catch(error){

        console.error(
            "Products error:",
            error
        );

        window.products = [];

        window.dispatchEvent(
            new CustomEvent(
                "firebaseProductsError",
                {
                    detail:error
                }
            )
        );

    }

}

loadProducts();

</script>

/* ========================================================= */
/* SORT */
/* ========================================================= */

function sortProducts(list){

    var arr=[...list];

    if(currentSort==="cheap"){

        arr.sort(
            (a,b) =>
                finalPrice(a)-finalPrice(b)
        );

    }

    else if(currentSort==="expensive"){

        arr.sort(
            (a,b) =>
                finalPrice(b)-finalPrice(a)
        );

    }

    else if(currentSort==="discount"){

        arr.sort(
            (a,b) =>
                Number(b.discount||0) -
                Number(a.discount||0)
        );

    }

    else if(currentSort==="new"){

        arr.sort(
            (a,b) =>
                Number(b.id||0) -
                Number(a.id||0)
        );

    }

    return arr;

}


function finalPrice(p){

    var price =
        Number(p.price||0);

    var discount =
        Number(p.discount||0);

    return discount>0
        ? Math.round(
            price -
            (price*discount/100)
        )
        : price;

}

        !arr.includes(p.image)

    return arr
        .filter(Boolean)
        .slice(0,3);

/* CHANGE CARD IMAGE */
/* ========================================================= */

function changeCardImage(id,amount){

    var box =
        document.querySelector(
            `.product-image[data-id="${id}"]`
        );

    if(!box)
        return;


    var images =
        JSON.parse(
            box.dataset.images || "[]"
        );


    if(images.length<2)
        return;


    var index =
        Number(
            box.dataset.index || 0
        );


    index += amount;


    if(index<0)
        index=images.length-1;


    if(index>=images.length)
        index=0;


    box.dataset.index =
        index;


    var img =
        document.getElementById(
            "img-"+id
        );


    if(img){

        img.style.display =
            "block";

        img.src =
            images[index];

    }


    var counter =
        document.getElementById(
            "counter-"+id
        );


    if(counter){

        counter.textContent =
            `${index+1}/${images.length}`;

    }

}

        </span>
        `;

    }

/* ========================================================= */
/* CART */
/* ========================================================= */

function addToCart(id,qty){

    qty =
        Number(qty||1);


    var p =
        products.find(
            x=>x.id===id
        );


    if(!p)
        return;


    if(Number(p.stock||0)<=0){

        showToast(
            "این محصول موجود نیست"
        );

        return;

    }


    var item =
        cart.find(
            x=>x.id===id
        );


    if(item){

        item.qty += qty;

    }

    else{

        cart.push({
            id:id,
            qty:qty
        });

    }


    saveData();


    showToast(
        "محصول به سبد خرید اضافه شد"
    );

}


function updateCartCount(){

    var count =
        cart.reduce(
            (sum,item)=>
                sum+
                Number(
                    item.qty||0
                ),
            0
        );


    var el =
        document.getElementById(
            "cartCount"
        );


    if(el)
        el.textContent =
            count;

}


function cartQty(id,amount){

    var item =
        cart.find(
            x=>x.id===id
        );


    if(!item)
        return;


    item.qty += amount;


    if(item.qty<1){

        cart =
            cart.filter(
                x=>x.id!==id
            );

    }


    saveData();

    renderCart();

}


function removeFromCart(id){

    cart =
        cart.filter(
            x=>x.id!==id
        );


    saveData();

    renderCart();


    showToast(
        "محصول از سبد حذف شد"
    );

}

/* ========================================================= */

function updateActiveNav(){

    var route =
        getRoute();


    document
    .querySelectorAll(
        ".nav a"
    )
    .forEach(a=>{

        var r =
            a.dataset.route;


        a.classList.toggle(
            "active",
            r===route ||
            (
                r==="/categories" &&
                route.startsWith(
                    "/category/"
                )
            )
        );

    });

}


/* ========================================================= */
/* HELPERS */
/* ========================================================= */

function emptyResult(
    icon,
    text
){

    return `

    <div class="no-result">

        <div>
            ${icon}
        </div>

        ${escapeHTML(text)}

    </div>

    `;

}


function showToast(message){

    var toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        window.toastTimer
    );


    window.toastTimer =
        setTimeout(
            ()=>{

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );

}


function escapeHTML(text){

    return String(
        text ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}
