const btn = document.getElementById("startBtn");
const status = document.getElementById("status");

btn.addEventListener("click", async () => {

  btn.disabled = true;

  status.textContent =
    "⏳ در حال اتصال به Firebase...\n";

  try {

    const batch = writeBatch(db);

    products.forEach(product => {

      const productRef = doc(
        db,
        "products",
        String(product.id)
      );

      batch.set(productRef, {

        code: product.id,

        name: product.name,

        category: product.cat,

        brand: product.brand || "",

        goldCat: product.goldCat || "",

        search: product.search || product.name,

        price: product.price,

        image: product.image || "",

        icon: product.icon || "🛍️",

        description: product.desc || "",

        specs: product.specs || "",

        stock: product.stock ?? 10,

        discount: product.discount ?? 0,

        active: true,

        createdAt: new Date()

      });

    });


    status.textContent +=
      "📦 ۳۴ محصول آماده ارسال...\n";

    await batch.commit();


    status.textContent +=
      "\n✅ با موفقیت انجام شد!\n\n" +
      "تعداد محصولات وارد شده: " +
      products.length +
      "\n\n" +
      "اکنون می‌توانی این صفحه را ببندی.";


    btn.textContent = "✅ ورود انجام شد";

  } catch(error) {

    console.error(error);

    status.textContent =
      "❌ خطا هنگام ورود محصولات:\n\n" +
      error.message +
      "\n\n" +
      "اگر خطای Permission denied دیدی، قوانین Firestore را بررسی کن.";

    btn.disabled = false;

  }

});

</script>
