<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پنل مدیریت | ماهان سنتر ایران</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Tahoma,Arial,sans-serif;
}

body{
  background:#080808;
  color:#fff;
  min-height:100vh;
}

header{
  background:linear-gradient(135deg,#160000,#a90000,#350000);
  padding:22px 15px;
  text-align:center;
  border-bottom:2px solid #e00000;
}

header h1{
  font-size:24px;
  margin-bottom:8px;
}

header p{
  color:#ddd;
  font-size:13px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px 15px 50px;
}

.card{
  background:#141414;
  border:1px solid #292929;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
}

.card h2{
  color:#ff3333;
  font-size:19px;
  margin-bottom:18px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.full{
  grid-column:1/-1;
}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
}

label{
  color:#ccc;
  font-size:13px;
}

input,
select,
textarea{
  width:100%;
  background:#0b0b0b;
  color:#fff;
  border:1px solid #333;
  border-radius:10px;
  padding:12px;
  outline:none;
  font-size:14px;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#e00000;
}

textarea{
  min-height:100px;
  resize:vertical;
}

.image-preview{
  margin-top:10px;
  width:140px;
  height:140px;
  border-radius:12px;
  border:1px solid #333;
  object-fit:cover;
  display:none;
}

.buttons{
  display:flex;
  gap:10px;
  margin-top:18px;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 18px;
  cursor:pointer;
  font-size:14px;
  font-weight:bold;
}

.primary{
  background:linear-gradient(135deg,#ff0000,#950000);
  color:white;
  flex:1;
}

.secondary{
  background:#292929;
  color:white;
}

.primary:hover,
.secondary:hover{
  opacity:.9;
}

.message{
  display:none;
  margin-top:15px;
  padding:13px;
  border-radius:10px;
  text-align:center;
  font-size:14px;
}

.success{
  display:block;
  background:#063b1b;
  border:1px solid #00a83b;
  color:#7cffae;
}

.error{
  display:block;
  background:#3b0606;
  border:1px solid #b40000;
  color:#ff8a8a;
}

.search-box{
  margin-bottom:18px;
}

.products{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.product{
  background:#0d0d0d;
  border:1px solid #292929;
  border-radius:14px;
  padding:14px;
}

.product-image{
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:10px;
  background:#171717;
  margin-bottom:12px;
}

.product h3{
  font-size:15px;
  margin-bottom:10px;
  line-height:1.7;
}

.product-info{
  color:#aaa;
  font-size:12px;
  line-height:2;
}

.product-price{
  color:#55ff88;
  font-weight:bold;
  font-size:14px;
  margin-top:5px;
}

.product-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.edit-btn{
  background:#17456b;
  color:white;
  flex:1;
}

.delete-btn{
  background:#750000;
  color:white;
  flex:1;
}

.empty{
  text-align:center;
  color:#888;
  padding:30px;
  grid-column:1/-1;
}

.status{
  text-align:center;
  padding:10px;
  border-radius:10px;
  margin-bottom:15px;
  background:#101010;
  color:#aaa;
  font-size:13px;
}

@media(max-width:800px){
  .products{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:600px){
  .grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .products{
    grid-template-columns:1fr;
  }

  .buttons{
    flex-direction:column;
  }

  header h1{
    font-size:20px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🛍️ پنل مدیریت ماهان سنتر ایران</h1>
  <p>افزودن، ویرایش و حذف محصولات</p>
</header>

<div class="container">

  <!-- فرم محصول -->

  <div class="card">

    <h2 id="formTitle">➕ افزودن محصول جدید</h2>

    <input type="hidden" id="documentId">

    <div class="grid">

      <div class="field">
        <label>کد محصول</label>
        <input id="code" type="number" placeholder="مثلاً 112">
      </div>

      <div class="field">
        <label>نام محصول</label>
        <input id="name" type="text" placeholder="نام محصول">
      </div>

      <div class="field">
        <label>دسته‌بندی</label>

        <select id="category">

          <option value="mobile">📱 موبایل</option>
          <option value="gold">💎 طلا</option>
          <option value="clothes">👕 پوشاک</option>
          <option value="accessories">👜 اکسسوری</option>
          <option value="digital">💻 کالای دیجیتال</option>
          <option value="shoes">👟 کفش</option>
          <option value="watches">⌚ ساعت</option>

        </select>
      </div>

      <div class="field">
        <label>دسته طلایی</label>

        <select id="goldCat">

          <option value="">بدون دسته طلا</option>
          <option value="necklace">📿 گردنبند</option>
          <option value="ring">💍 انگشتر</option>
          <option value="bangle">⭕ النگو</option>
          <option value="bracelet">📿 دستبند</option>
          <option value="earring">💎 گوشواره</option>

        </select>
      </div>

      <div class="field">
        <label>برند</label>
        <input id="brand" type="text" placeholder="مثلاً Samsung">
      </div>

      <div class="field">
        <label>قیمت (تومان)</label>
        <input id="price" type="number" placeholder="مثلاً 5000000">
      </div>

      <div class="field">
        <label>تخفیف (%)</label>
        <input id="discount" type="number" min="0" max="100" value="0">
      </div>

      <div class="field">
        <label>موجودی</label>
        <input id="stock" type="number" min="0" value="1">
      </div>

      <div class="field full">
        <label>مسیر عکس محصول</label>

        <input
          id="image"
          type="text"
          placeholder="مثلاً images/gold/heart-small.jpg"
          oninput="previewImage()"
        >

        <img id="imagePreview" class="image-preview">

      </div>

      <div class="field full">
        <label>عبارت جستجو</label>

        <input
          id="search"
          type="text"
          placeholder="نام محصول، مدل، برند و..."
        >

      </div>

      <div class="field full">

        <label>توضیحات محصول</label>

        <textarea
          id="description"
          placeholder="توضیحات محصول..."
        ></textarea>

      </div>

      <div class="field full">

        <label>مشخصات محصول</label>

        <textarea
          id="specs"
          placeholder="مثلاً حافظه: 256GB | رم: 8GB | رنگ: مشکی"
        ></textarea>

      </div>

    </div>

    <div class="buttons">

      <button
        class="primary"
        onclick="saveProduct()"
        id="saveButton"
      >
        ➕ افزودن محصول
      </button>

      <button
        class="secondary"
        onclick="cancelEdit()"
        id="cancelButton"
        style="display:none"
      >
        ❌ لغو ویرایش
      </button>

    </div>

    <div id="message" class="message"></div>

  </div>


  <!-- لیست محصولات -->

  <div class="card">

    <h2>📦 مدیریت محصولات</h2>

    <div class="search-box">

      <input
        id="adminSearch"
        type="text"
        placeholder="🔍 جستجوی نام، کد یا برند..."
        oninput="filterProducts()"
      >

    </div>

    <div id="status" class="status">
      در حال دریافت محصولات...
    </div>

    <div id="productsList" class="products"></div>

  </div>

</div>


<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  doc,
  updateDoc,
  deleteDoc
} from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


/* Firebase */

const firebaseConfig = {

  apiKey:
  "AIzaSyDlrv12gAydgbx1qPJXAIM0kzcSeJF5pNs",

  authDomain:
  "mahan-center.firebaseapp.com",

  projectId:
  "mahan-center",

  storageBucket:
  "mahan-center.firebasestorage.app",

  messagingSenderId:
  "720478821753",

  appId:
  "1:720478821753:web:7a431c1a3f9e3abd7923a8"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* محصولات */

let allProducts = [];


/* گرفتن محصولات */

async function loadProducts(){

  const list =
    document.getElementById("productsList");

  const status =
    document.getElementById("status");

  status.textContent =
    "در حال دریافت محصولات...";

  try{

    const snapshot =
      await getDocs(collection(db,"products"));

    allProducts = [];

    snapshot.forEach(item => {

      allProducts.push({

        id:item.id,

        ...item.data()

      });

    });


    allProducts.sort((a,b)=>
      Number(a.code || 0) -
      Number(b.code || 0)
    );


    status.textContent =
      `تعداد محصولات: ${allProducts.length}`;


    renderProducts(allProducts);

  }catch(error){

    status.textContent =
      "❌ خطا در دریافت محصولات";

    list.innerHTML =
      `<div class="empty">
        ${error.message}
      </div>`;

  }

}


/* نمایش محصولات */

function renderProducts(products){

  const list =
    document.getElementById("productsList");


  if(!products.length){

    list.innerHTML =
      `<div class="empty">
        محصولی پیدا نشد.
      </div>`;

    return;

  }


  let html = "";


  products.forEach(p => {

    const image =
      p.image || "";


    html += `

      <div class="product">

        ${
          image
          ?
          `<img
             src="${image}"
             class="product-image"
             onerror="this.style.display='none'"
           >`
          :
          `<div class="product-image"></div>`
        }

        <h3>
          ${p.icon || "🛍️"}
          ${escapeHtml(p.name || "بدون نام")}
        </h3>

        <div class="product-info">

          🆔 کد:
          ${p.code ?? "-"}

          <br>

          🏷️ دسته:
          ${escapeHtml(p.category || "-")}

          <br>

          📦 موجودی:
          ${p.stock ?? 0}

          <br>

          💸 تخفیف:
          ${p.discount ?? 0}%

        </div>

        <div class="product-price">

          💰
          ${Number(p.price || 0).toLocaleString("fa-IR")}
          تومان

        </div>

        <div class="product-actions">

          <button
            class="edit-btn"
            onclick="editProduct('${p.id}')"
          >
            ✏️ ویرایش
          </button>

          <button
            class="delete-btn"
            onclick="deleteProduct('${p.id}')"
          >
            🗑️ حذف
          </button>

        </div>

      </div>

    `;

  });


  list.innerHTML = html;

}


/* ذخیره محصول */

window.saveProduct = async function(){

  const documentId =
    document.getElementById("documentId").value;


  const code =
    Number(document.getElementById("code").value);

  const name =
    document.getElementById("name").value.trim();

  const category =
    document.getElementById("category").value;

  const goldCat =
    document.getElementById("goldCat").value;

  const brand =
    document.getElementById("brand").value.trim();

  const price =
    Number(document.getElementById("price").value);

  const discount =
    Number(document.getElementById("discount").value || 0);

  const stock =
    Number(document.getElementById("stock").value || 0);

  const image =
    document.getElementById("image").value.trim();

  const search =
    document.getElementById("search").value.trim() || name;

  const description =
    document.getElementById("description").value.trim();

  const specs =
    document.getElementById("specs").value.trim();


  if(!code || !name || !price){

    showMessage(
      "کد، نام و قیمت محصول الزامی است.",
      false
    );

    return;

  }


  const productData = {

    code:code,

    name:name,

    category:category,

    goldCat:goldCat,

    brand:brand,

    price:price,

    discount:discount,

    stock:stock,

    image:image,

    icon:"🛍️",

    search:search,

    description:description,

    specs:specs,

    active:true

  };


  try{

    if(documentId){

      await updateDoc(
        doc(db,"products",documentId),
        productData
      );

      showMessage(
        "✅ محصول با موفقیت ویرایش شد.",
        true
      );

    }else{

      await addDoc(
        collection(db,"products"),
        {

          ...productData,

          createdAt:new Date()

        }
      );

      showMessage(
        "✅ محصول با موفقیت اضافه شد.",
        true
      );

    }


    clearForm();

    await loadProducts();

  }catch(error){

    console.error(error);

    showMessage(
      "❌ خطا: " + error.message,
      false
    );

  }

};


/* ویرایش */

window.editProduct = function(id){

  const product =
    allProducts.find(p => p.id === id);

  if(!product) return;


  document.getElementById("documentId").value =
    product.id;

  document.getElementById("code").value =
    product.code ?? "";

  document.getElementById("name").value =
    product.name ?? "";

  document.getElementById("category").value =
    product.category ?? "digital";

  document.getElementById("goldCat").value =
    product.goldCat ?? "";

  document.getElementById("brand").value =
    product.brand ?? "";

  document.getElementById("price").value =
    product.price ?? "";

  document.getElementById("discount").value =
    product.discount ?? 0;

  document.getElementById("stock").value =
    product.stock ?? 0;

  document.getElementById("image").value =
    product.image ?? "";

  document.getElementById("search").value =
    product.search ?? "";

  document.getElementById("description").value =
    product.description ?? "";

  document.getElementById("specs").value =
    product.specs ?? "";


  document.getElementById("formTitle").textContent =
    "✏️ ویرایش محصول";

  document.getElementById("saveButton").textContent =
    "💾 ذخیره تغییرات";

  document.getElementById("cancelButton").style.display =
    "block";


  previewImage();


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

};


/* حذف */

window.deleteProduct = async function(id){

  const product =
    allProducts.find(p => p.id === id);


  if(!product) return;


  const ok =
    confirm(
      `آیا مطمئنی محصول «${product.name}» حذف شود؟`
    );


  if(!ok) return;


  try{

    await deleteDoc(
      doc(db,"products",id)
    );


    showMessage(
      "🗑️ محصول با موفقیت حذف شد.",
      true
    );


    await loadProducts();

  }catch(error){

    showMessage(
      "❌ خطا در حذف: " + error.message,
      false
    );

  }

};


/* لغو ویرایش */

window.cancelEdit = function(){

  clearForm();

};


/* پاک کردن فرم */

function clearForm(){

  document.getElementById("documentId").value = "";

  document.getElementById("code").value = "";

  document.getElementById("name").value = "";

  document.getElementById("category").value =
    "mobile";

  document.getElementById("goldCat").value = "";

  document.getElementById("brand").value = "";

  document.getElementById("price").value = "";

  document.getElementById("discount").value = "0";

  document.getElementById("stock").value = "1";

  document.getElementById("image").value = "";

  document.getElementById("search").value = "";

  document.getElementById("description").value = "";

  document.getElementById("specs").value = "";


  document.getElementById("formTitle").textContent =
    "➕ افزودن محصول جدید";

  document.getElementById("saveButton").textContent =
    "➕ افزودن محصول";

  document.getElementById("cancelButton").style.display =
    "none";


  document.getElementById("imagePreview").style.display =
    "none";

}


/* جستجو */

window.filterProducts = function(){

  const text =
    document.getElementById("adminSearch")
    .value
    .trim()
    .toLowerCase();


  if(!text){

    renderProducts(allProducts);

    return;

  }


  const filtered =
    allProducts.filter(p => {

      const content = [

        p.name,

        p.brand,

        p.search,

        p.code,

        p.category

      ]
      .join(" ")
      .toLowerCase();


      return content.includes(text);

    });


  renderProducts(filtered);

};


/* پیش نمایش عکس */

window.previewImage = function(){

  const url =
    document.getElementById("image").value.trim();

  const img =
    document.getElementById("imagePreview");


  if(!url){

    img.style.display = "none";

    return;

  }


  img.src = url;

  img.style.display = "block";

};


/* پیام */

function showMessage(text,success){

  const box =
    document.getElementById("message");

  box.textContent = text;

  box.className =
    "message " +
    (success ? "success" : "error");

  setTimeout(() => {

    box.style.display = "none";

  },5000);

}


/* جلوگیری از HTML */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* شروع */

loadProducts();

</script>

</body>
  </html>
