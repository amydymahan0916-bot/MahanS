/* =========================================================
   HELPERS
========================================================= */

function $(id) {
    return document.getElementById(id);
}


function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function formatPrice(value) {

    return Number(value || 0).toLocaleString("fa-IR");
}


function toast(message, type = "success") {

    const container = $("toastContainer");

    if (!container) {
        alert(message);
        return;
    }

    const item = document.createElement("div");

    item.className =
        "toast " +
        (type === "error"
            ? "error"
            : type === "warning"
                ? "warning"
                : "");

    item.textContent = message;

    container.appendChild(item);

    setTimeout(() => {
        item.remove();
    }, 6000);
}


/* =========================================================
   FIREBASE ERROR HANDLER
========================================================= */

function firebaseError(error) {

    console.error("Firebase Error:", error);

    if (!error) {
        return "خطای نامشخص";
    }

    const code = error.code || "";
    const message = error.message || "";

    const errors = {

        "permission-denied":
            "دسترسی Firebase رد شد. Firestore Rules را بررسی کن.",

        "unauthenticated":
            "حساب مدیریت وارد نشده است.",

        "auth/invalid-credential":
            "ایمیل یا رمز عبور اشتباه است.",

        "auth/invalid-email":
            "فرمت ایمیل اشتباه است.",

        "auth/user-not-found":
            "حساب مدیر پیدا نشد.",

        "auth/wrong-password":
            "رمز عبور اشتباه است.",

        "auth/network-request-failed":
            "اتصال اینترنت یا Firebase مشکل دارد.",

        "storage/unauthorized":
            "دسترسی Firebase Storage رد شد. Storage Rules را بررسی کن.",

        "storage/unauthenticated":
            "برای آپلود عکس باید وارد حساب مدیریت باشی.",

        "storage/network-request-failed":
            "اتصال هنگام آپلود عکس قطع شد.",

        "storage/quota-exceeded":
            "فضای Firebase Storage کافی نیست.",

        "storage/retry-limit-exceeded":
            "آپلود تصویر چند بار ناموفق بود.",

        "failed-precondition":
            "Firebase هنوز آماده نیست یا تنظیمات پروژه ناقص است.",

        "unavailable":
            "Firebase موقتاً در دسترس نیست.",

        "not-found":
            "اطلاعات موردنظر پیدا نشد."
    };

    if (errors[code]) {
        return errors[code];
    }

    return message || code || "خطای نامشخص Firebase";
}


/* =========================================================
   TIMEOUT
========================================================= */

function timeoutPromise(ms, message) {

    return new Promise((_, reject) => {

        setTimeout(() => {

            const error = new Error(message);

            error.code = "operation-timeout";

            reject(error);

        }, ms);

    });
}


async function safePromise(promise, ms, message) {

    return await Promise.race([
        promise,
        timeoutPromise(ms, message)
    ]);
}


/* =========================================================
   BUTTON LOADING
========================================================= */

function buttonLoading(button, loading, text) {

    if (!button) return;

    if (loading) {

        button.dataset.oldText = button.textContent;

        button.disabled = true;

        button.textContent = text || "در حال انجام...";

    } else {

        button.disabled = false;

        button.textContent =
            button.dataset.oldText ||
            button.textContent;
    }
}


/* =========================================================
   AUTH
========================================================= */

async function login() {

    const email = $("loginEmail")?.value.trim();
    const password = $("loginPassword")?.value;

    const errorBox = $("loginError");
    const button = $("loginBtn");

    if (!email || !password) {

        if (errorBox) {

            errorBox.style.display = "block";

            errorBox.textContent =
                "ایمیل و رمز عبور را وارد کن.";
        }

        return;
    }

    buttonLoading(
        button,
        true,
        "در حال ورود..."
    );

    if (errorBox) {
        errorBox.style.display = "none";
    }

    try {

        await safePromise(
            signInWithEmailAndPassword(
                auth,
                email,
                password
            ),
            30000,
            "ورود بیش از ۳۰ ثانیه طول کشید."
        );

    } catch (error) {

        console.error(error);

        if (errorBox) {

            errorBox.style.display = "block";

            errorBox.textContent =
                firebaseError(error);
        }

    } finally {

        buttonLoading(
            button,
            false
        );
    }
}


if ($("loginBtn")) {

    $("loginBtn").addEventListener(

        login

}


if ($("loginPassword")) {

}

                $("loginScreen").style.display = "flex";

            if ($("app")) {
                $("app").style.display = "none";
            }

        }

    }
);


/* =========================================================
   LOAD ALL
========================================================= */

async function loadAll() {

    if (isLoading) return;

    if (!auth.currentUser) {

        toast(
            "ابتدا وارد حساب مدیریت شو.",
            "warning"
        );

        return;
    }

    isLoading = true;

    try {

        await loadSiteData();

        await loadProducts();

        normalizeCategories();

        renderCategorySelect();

        renderProducts();

        renderCategories();

        fillSiteForms();

        updateDashboard();

        renderSystemStatus(true);

    } catch (error) {

        console.error(error);

        renderSystemStatus(false);

        toast(
            "خطا در دریافت اطلاعات: " +
            firebaseError(error),
            "error"
        );

    } finally {

        isLoading = false;

    }
}


/* =========================================================
   LOAD SITE DATA
========================================================= */

async function loadSiteData() {

    const snapshot =
        await safePromise(
            getDoc(
                doc(
                    db,
                    "settings",
                    "site"
                )
            ),
            30000,
            "خواندن تنظیمات بیش از ۳۰ ثانیه طول کشید."
        );

    if (snapshot.exists()) {

        siteData =
            snapshot.data() || {};

    } else {

        siteData = {};

    }

    categories =
        Array.isArray(siteData.categories)
            ? siteData.categories
            : [...defaultCategories];

    normalizeCategories();
}


/* =========================================================
   LOAD PRODUCTS
========================================================= */

async function loadProducts() {

    const snapshot =
        await safePromise(
            getDocs(
                collection(
                    db,
                    "products"
                )
            ),
            30000,
            "خواندن محصولات بیش از ۳۰ ثانیه طول کشید."
        );

    products =
        snapshot.docs.map(item => {

            const data =
                item.data() || {};

            return {

                docId: item.id,

                code:
                    Number(
                        data.code || 0
                    ),

                category:
                    data.category ||
                    data.cat ||
                    "",

                brand:
                    data.brand || "",

                goldCat:
                    data.goldCat || "",

                name:
                    data.name ||
                    "محصول بدون نام",

                search:
                    data.search ||
                    data.name ||
                    "",

                price:
                    Number(
                        data.price || 0
                    ),

                image:
                    data.image || "",

                image2:
                    data.image2 || "",

                image3:
                    data.image3 || "",

                icon:
                    data.icon ||
                    "🛍️",

                description:
                    data.description ||
                    data.desc ||
                    "",

                specs:
                    data.specs ||
                    "",

                stock:
                    Number(
                        data.stock || 0
                    ),

                discount:
                    Number(
                        data.discount || 0
                    ),

                minStock:
                    Number(
                        data.minStock ?? 3
                    ),

                status:
                    data.status ||
                    "available",

                createdAt:
                    data.createdAt ||
                    null

            };

        });

    products.sort(
        (a, b) =>
            Number(b.code || 0) -
            Number(a.code || 0)
    );
}


/* =========================================================
   CATEGORIES
========================================================= */

function normalizeCategories() {

    if (!Array.isArray(categories)) {
        categories = [];
    }

    categories =
        categories
            .filter(
                item =>
                    item &&
                    item.id &&
                    item.name
            )
            .map(item => ({
                id: String(item.id),
                name: String(item.name),
                icon:
                    String(
                        item.icon ||
                        "📦"
                    )
            }));

    if (!categories.length) {

        categories =
            [...defaultCategories];

    }
}


function renderCategorySelect() {

    const select =
        $("pCategory");

    const filter =
        $("productCategoryFilter");

    if (!select || !filter) return;

    const selected =
        select.value;

    select.innerHTML =
        `<option value="">
            انتخاب دسته‌بندی...
        </option>`;

    filter.innerHTML =
        `<option value="">
            همه دسته‌بندی‌ها
        </option>`;

    categories.forEach(category => {

        const option =
            document.createElement(
                "option"
            );

        option.value =
            category.id;

        option.textContent =
            category.name;

        select.appendChild(
            option
        );


        const filterOption =
            document.createElement(
                "option"
            );

        filterOption.value =
            category.id;

        filterOption.textContent =
            category.name;

        filter.appendChild(
            filterOption
        );

    });

    if (
        selected &&
        categories.some(
            x => x.id === selected
        )
    ) {

        select.value =
            selected;
    }
}

        "pName",
        "pCode",
        "pBrand",
        "pGoldCat",
        "pPrice",
        "pSearch",
        "pDescription",
        "pSpecs"
    ];

    fields.forEach(id => {

        if ($(id)) {

        }

    });

    if ($("pCategory"))
        $("pCategory").value = "";

    if ($("pIcon"))
        $("pIcon").value = "🛍️";

    if ($("pDiscount"))
        $("pDiscount").value = "0";

    if ($("pStock"))
        $("pStock").value = "0";

    if ($("pMinStock"))
        $("pMinStock").value = "3";

    if ($("pStatus"))
        $("pStatus").value =
            "available";

        $("pImages").value = "";

window.closeProductModal =
    function () {

        $("productModal")
            ?.classList.remove("show");

    };


/* =========================================================
   IMAGE SELECT
========================================================= */

if ($("pImages")) {

    $("pImages").addEventListener(
        "change",
        event => {

            const files =
                Array.from(
                    event.target.files || []
                )
                .filter(
                    file =>
                        file.type.startsWith(
                            "image/"
                        )
                );

            if (
                existingImages.length +
                newImageFiles.length +
                files.length > 3
            ) {

                toast(
                    "حداکثر ۳ تصویر مجاز است.",
                    "warning"
                );

                event.target.value = "";

                return;
            }

            newImageFiles.push(
                ...files
            );

            renderImagePreview();

            event.target.value = "";

        }
    );
}


function renderImagePreview() {

    const box =
        $("imagesPreview");

    if (!box) return;

    let html = "";

    existingImages.forEach(
        (url, index) => {

            html += `
            <div class="image-box">

                <img
                    src="${escapeHTML(url)}"
                    onerror="this.style.display='none'"
                >

                <button
                    type="button"
                    class="remove-image"
                    onclick="removeExistingImage(${index})"
                >
                    ×
                </button>

            </div>
            `;

        }
    );


    newImageFiles.forEach(
        (file, index) => {

            const url =
                URL.createObjectURL(
                    file
                );

            html += `
            <div class="image-box">

                <img src="${url}">

                <button
                    type="button"
                    class="remove-image"
                    onclick="removeNewImage(${index})"
                >
                    ×
                </button>

            </div>
            `;

        }
    );


    const count =
        existingImages.length +
        newImageFiles.length;


    for (
        let i = count;
        i < 3;
        i++
    ) {

        html += `
        <div class="image-box empty">

            <strong>＋</strong>

            <span>
                تصویر ${i + 1}
            </span>

        </div>
        `;

    }

    box.innerHTML = html;
}


window.removeExistingImage =
    function (index) {

        existingImages.splice(
            index,
            1
        );

        renderImagePreview();
    };


window.removeNewImage =
    function (index) {

        newImageFiles.splice(
            index,
            1
        );

        renderImagePreview();
    };


/* =========================================================
   STORAGE UPLOAD
========================================================= */

async function uploadProductImages(code) {

    if (!newImageFiles.length) {

        return existingImages
            .slice(0, 3);
    }


    if (!auth.currentUser) {

        throw new Error(
            "برای آپلود تصویر باید وارد حساب مدیریت باشی."
        );

    }


    const urls =
        [...existingImages];


    for (
        let i = 0;
        i < newImageFiles.length;
        i++
    ) {

        const file =
            newImageFiles[i];


        const extension =
            (
                file.name
                    .split(".")
                    .pop() ||
                "jpg"
            )
            .toLowerCase()
            .replace(
                /[^a-z0-9]/g,
                ""
            ) || "jpg";


        const fileName =
            "products/" +
            "product_" +
            code +
            "_" +
            Date.now() +
            "_" +
            i +
            "." +
            extension;


        const storageRef =
            ref(
                storage,
                fileName
            );


        const uploadSnapshot =
            await safePromise(

                uploadBytes(
                    storageRef,
                    file,
                    {
                        contentType:
                            file.type
                    }
                ),

                60000,

                "آپلود تصویر بیش از ۶۰ ثانیه طول کشید."

            );


        const downloadURL =
            await safePromise(

                getDownloadURL(
                    uploadSnapshot.ref
                ),

                30000,

                "دریافت لینک تصویر بیش از ۳۰ ثانیه طول کشید."

            );


        urls.push(
            downloadURL
        );

    }


    return urls.slice(0, 3);
}


/* =========================================================
   SAVE PRODUCT
========================================================= */

window.saveProduct =
    async function () {

        const button =
            $("saveProductBtn");


        const name =
            $("pName").value.trim();


        const code =
            Number(
                $("pCode").value || 0
            );


        const category =
            $("pCategory").value;


        const price =
            Number(
                $("pPrice").value || 0
            );


        const stock =
            Number(
                $("pStock").value || 0
            );


        if (!name) {

            toast(
                "نام محصول را وارد کن.",
                "warning"
            );

            return;
        }


        if (!code || code < 1) {

            toast(
                "کد محصول را وارد کن.",
                "warning"
            );

            return;
        }


        if (!category) {

            toast(
                "دسته‌بندی محصول را انتخاب کن.",
                "warning"
            );

            return;
        }


        if (
            !categories.some(
                categoryItem =>
                    categoryItem.id === category
            )
        ) {

            toast(
                "دسته‌بندی انتخاب‌شده معتبر نیست.",
                "error"
            );

            return;
        }


        if (price < 0) {

            toast(
                "قیمت نمی‌تواند منفی باشد.",
                "warning"
            );

            return;
        }


        if (stock < 0) {

            toast(
                "موجودی نمی‌تواند منفی باشد.",
                "warning"
            );

            return;
        }


        const duplicate =
            products.find(
                product =>
                    Number(product.code) ===
                    code &&
                    product.docId !==
                    editingProductId
            );


        if (duplicate) {

            toast(
                "این کد محصول قبلاً استفاده شده است.",
                "warning"
            );

            return;
        }


        if (!auth.currentUser) {

            toast(
                "جلسه ورود منقضی شده؛ دوباره وارد شو.",
                "error"
            );

            return;
        }


        buttonLoading(
            button,
            true,
            editingProductId
                ? "در حال ویرایش..."
                : "در حال ثبت..."
        );


        try {

            /*
             * فقط وقتی عکس جدید وجود داشته باشد
             * Storage را صدا می‌زنیم.
             */

            const images =
                await uploadProductImages(
                    code
                );


            const productData = {

                name,

                code,

                category,

                brand:
                    $("pBrand").value.trim(),

                goldCat:
                    $("pGoldCat").value.trim(),

                icon:
                    $("pIcon").value.trim() ||
                    "🛍️",

                price,

                discount:
                    Math.max(
                        0,
                        Math.min(
                            100,
                            Number(
                                $("pDiscount").value ||
                                0
                            )
                        )
                    ),

                stock,

                minStock:
                    Math.max(
                        0,
                        Number(
                            $("pMinStock").value ||
                            3
                        )
                    ),

                status:
                    $("pStatus").value,

                search:
                    $("pSearch").value.trim() ||
                    name,

                image:
                    images[0] || "",

                image2:
                    images[1] || "",

                image3:
                    images[2] || "",

                description:
                    $("pDescription").value.trim(),

                specs:
                    $("pSpecs").value.trim(),

                updatedAt:
                    serverTimestamp()

            };


            if (editingProductId) {

                await safePromise(

                    updateDoc(
                        doc(
                            db,
                            "products",
                            editingProductId
                        ),
                        productData
                    ),

                    30000,

                    "ویرایش محصول بیش از ۳۰ ثانیه طول کشید."

                );


                toast(
                    "محصول با موفقیت ویرایش شد."
                );

            } else {

                productData.createdAt =
                    serverTimestamp();


                await safePromise(

                    addDoc(
                        collection(
                            db,
                            "products"
                        ),
                        productData
                    ),

                    30000,

function slugify(value) {

    return String(value || "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g, "-")
        .replace(
            /[^a-z0-9_-]/g,
            ""
        );

}


/* =========================================================
   SAVE CATEGORY
========================================================= */

window.saveCategory =
    async function () {

        const button =
            $("saveCategoryBtn");


        const name =
            $("cName").value.trim();


        const id =
            slugify(
                $("cId").value
            );


        const icon =
            $("cIcon").value.trim() ||
            "📦";


        if (!name) {

            toast(
                "نام دسته‌بندی را وارد کن.",
                "warning"
            );

            return;
        }


        if (!id) {

            toast(
                "شناسه انگلیسی دسته‌بندی را وارد کن.",
                "warning"
            );

            return;
        }


        const duplicate =
            categories.find(
                item =>
                    item.id === id &&
                    item.id !==
                    editingCategoryId
            );


        if (duplicate) {

            toast(
                "این شناسه قبلاً وجود دارد.",
                "warning"
            );

            return;
        }


        if (!auth.currentUser) {

            toast(
                "وارد حساب مدیریت نیستی.",
                "error"
            );

            return;
        }


        buttonLoading(
            button,
            true,
            editingCategoryId
                ? "در حال ویرایش..."
                : "در حال ثبت..."
        );


        try {

            let updatedCategories;


            if (editingCategoryId) {

                updatedCategories =
                    categories.map(
                        category => {

                            if (
                                category.id ===
                                editingCategoryId
                            ) {

                                return {
                                    id,
                                    name,
                                    icon
                                };

                            }

                            return category;

                        }
                    );


                /*
                 * اگر شناسه تغییر کرده،
                 * دسته محصولات قبلی را
                 * به شناسه جدید منتقل می‌کنیم.
                 */

                if (
                    editingCategoryId !==
                    id
                ) {

                    const affectedProducts =
                        products.filter(
                            product =>
                                product.category ===
                                editingCategoryId
                        );


                    for (
                        const product
                        of affectedProducts
                    ) {

                        await safePromise(

                            updateDoc(
                                doc(
                                    db,
                                    "products",
                                    product.docId
                                ),
                                {
                                    category: id,
                                    updatedAt:
                                        serverTimestamp()
                                }
                            ),

                            30000,

                            "انتقال محصول بیش از ۳۰ ثانیه طول کشید."

                        );


                        product.category =
                            id;

                    }

                }


            } else {

                updatedCategories =
                    [
                        ...categories,
                        {
                            id,
                            name,
                            icon
                        }
                    ];

            }


            await safePromise(

                setDoc(
                    doc(
                        db,
                        "settings",
                        "site"
                    ),
                    {
                        categories:
                            updatedCategories,

                        updatedAt:
                            serverTimestamp()
                    },
                    {
                        merge: true
                    }
                ),

                30000,

                "ذخیره دسته‌بندی بیش از ۳۰ ثانیه طول کشید."

            );


            categories =
                updatedCategories;


            siteData.categories =
                updatedCategories;


            renderCategories();

            renderCategorySelect();

            renderProducts();

            updateDashboard();

            closeCategoryModal();


            toast(
                editingCategoryId
                    ? "دسته‌بندی با موفقیت ویرایش شد."
                    : "دسته‌بندی با موفقیت ساخته شد."
            );


        } catch (error) {

            console.error(
                "CATEGORY ERROR:",
                error
            );


            toast(
                "ساخت/ویرایش دسته‌بندی انجام نشد:\n" +
                firebaseError(error),
                "error"
            );


        } finally {

            buttonLoading(
                button,
                false
            );

        }

    };


/* =========================================================
   DELETE CATEGORY
========================================================= */

window.deleteCategory =
    async function (id) {

        const category =
            categories.find(
                item =>
                    item.id === id
            );


        if (!category) return;


        const productCount =
            products.filter(
                product =>
                    product.category === id
            ).length;


        let message =
            "آیا دسته «" +
            category.name +
            "» حذف شود؟";


        if (productCount) {

            message +=
                "\n\n" +
                productCount +
                " محصول داخل این دسته وجود دارد.";

        }


        if (!confirm(message)) {
            return;
        }


        try {

            const updated =
                categories.filter(
                    item =>
                        item.id !== id
                );


            await safePromise(

                setDoc(
                    doc(
                        db,
                        "settings",
                        "site"
                    ),
                    {
                        categories:
                            updated,

                        updatedAt:
                            serverTimestamp()
                    },
                    {
                        merge: true
                    }
                ),

                30000,

                "حذف دسته‌بندی بیش از ۳۰ ثانیه طول کشید."

            );


            categories =
                updated;


            siteData.categories =
                updated;


            renderCategories();

            renderCategorySelect();

            renderProducts();

            updateDashboard();


            toast(
                "دسته‌بندی حذف شد."
            );


        } catch (error) {

            toast(
                "حذف دسته‌بندی انجام نشد: " +
                firebaseError(error),
                "error"
            );

        }

    };


/* =========================================================

========================================================= */

window.renderProducts =
    function () {

        const grid =
            $("productsGrid");

        if (!grid) return;


        const search =
            (
                $("productSearch")
                    ?.value || ""
            )
            .trim()
            .toLowerCase();


        const category =
            $("productCategoryFilter")
                ?.value || "";


        let list =
            [...products];


        if (search) {

            list =
                list.filter(
                    product => {

                        const text =
                            [
                                product.name,
                                product.code,
                                product.brand,
                                product.search,
                                product.category
                            ]
                            .join(" ")
                            .toLowerCase();

                        return text.includes(
                            search
                        );

                    }
                );

        }


        if (category) {

            list =
                list.filter(
                    product =>
                        product.category ===
                        category
                );

        }


        if (!list.length) {

            grid.innerHTML = `
            <div
                class="empty"
                style="grid-column:1/-1"
            >
                <div class="empty-icon">
                    📦
                </div>

                <p>
                    محصولی پیدا نشد.
                </p>

            </div>
            `;

            return;
        }


        grid.innerHTML =
            list
                .map(
                    productCard
                )
                .join("");

    };


function productCard(product) {

    const category =
        categories.find(
            item =>
                item.id ===
                product.category
        );


    const image =
        product.image ||
        product.image2 ||
        product.image3 ||
        "";


    const lowStock =
        Number(product.stock || 0) <=
        Number(product.minStock ?? 3);


    return `

    <div class="product-admin-card">

        <div class="product-admin-image">

            ${
                image

                ?

                `
                <img
                    src="${escapeHTML(image)}"
                    loading="lazy"
                >
                `

                :

                `
                <div class="product-no-image">
                    ${escapeHTML(product.icon)}
                </div>
                `
            }

        </div>


        <div class="product-admin-body">

            <div class="product-admin-title">
                ${escapeHTML(product.name)}
            </div>


            <div class="product-admin-meta">

                <span>
                    #${escapeHTML(product.code)}
                </span>

                <span class="badge">
                    ${escapeHTML(
                        category?.name ||
                        product.category ||
                        "بدون دسته"
                    )}
                </span>

            </div>


            <div class="price-admin">

                ${formatPrice(product.price)}

                <small>
                    تومان
                </small>

            </div>


            <div class="stock-row">

                <input
                    class="stock-input"
                    id="stock-${escapeHTML(product.docId)}"
                    type="number"
                    min="0"
                    value="${Number(product.stock || 0)}"
                >

                <button
                    class="stock-save"
                    onclick="quickStockUpdate('${escapeHTML(product.docId)}')"
                >
                    ذخیره موجودی
                </button>

            </div>


            <div style="margin-bottom:12px">

                <span
                    class="badge ${
                        lowStock
                            ? "badge-red"
                            : "badge-green"
                    }"
                >

                    موجودی:
                    ${Number(product.stock || 0)}

                </span>

            </div>


            <div class="product-actions">

                <button
                    class="edit-btn"
                    onclick="openProductModal('${escapeHTML(product.docId)}')"
                >
                    ویرایش
                </button>

                <button
                    class="view-btn"
                    onclick="openProductDetails('${escapeHTML(product.docId)}')"
                >

                </button>

                <button
                    class="delete-btn"
                    onclick="deleteProduct('${escapeHTML(product.docId)}')"

            </div>

        </div>

    </div>

    `;

}

function updateDashboard() {

                .toLocaleString("fa-IR");


    if ($("dashCategories"))
        $("dashCategories")
            .textContent =
            categories.length
                .toLocaleString("fa-IR");


    const totalStock =
        products.reduce(
            (sum, product) =>
                sum +
                Number(
                    product.stock || 0
                ),
            0
        );


    const lowStock =
        products.filter(
            product =>
                Number(
                    product.stock || 0
                ) <=
                Number(
                    product.minStock ?? 3
                )
        ).length;


    if ($("dashStock"))
        $("dashStock")
            .textContent =
            totalStock
                .toLocaleString("fa-IR");


    if ($("dashLow"))
        $("dashLow")
            .textContent =
            lowStock
                .toLocaleString("fa-IR");


    renderDashboardProducts();

}

========================================================= */

window.openProductDetails =
    function (docId) {

        const product =
            products.find(
                item =>
                    item.docId === docId
            );


        if (!product) return;


        const category =
            categories.find(
                item =>
                    item.id ===
                    product.category
            );


        alert(

            "نام: " +
            product.name +

            "\n\nکد: " +
            product.code +

            "\n\nدسته‌بندی: " +
            (
                category?.name ||
                product.category
            ) +

            "\n\nقیمت: " +
            formatPrice(
                product.price
            ) +
            " تومان" +

            "\n\nموجودی: " +
            product.stock +

            "\n\nتخفیف: " +
            product.discount +
            "%"

        );

    };


/* =========================================================
   NAVIGATION
========================================================= */

function showPage(page) {

    document
        .querySelectorAll(".menu-item")
        .forEach(
            button => {

                button.classList.toggle(
                    "active",
                    button.dataset.page ===
                    page
                );

            }
        );


    document
        .querySelectorAll(".page")
        .forEach(
            item =>
                item.classList.remove(
                    "active"
                )
        );


    const target =
        $("page-" + page);


    if (target) {
        target.classList.add(
            "active"
        );
    }


    const titles = {

        dashboard:
            "داشبورد",

        products:
            "مدیریت محصولات",

        categories:
            "دسته‌بندی‌ها",

        content:
            "متن‌های سایت",

        stats:
            "آمار صفحه اصلی",

        settings:
            "تنظیمات"

    };


    if ($("topTitle")) {

        $("topTitle")
            .textContent =
            titles[page] ||
            "پنل مدیریت";

    }


    if (page === "products") {
        renderProducts();
    }

    if (page === "categories") {
        renderCategories();
    }

}


document
    .querySelectorAll(".menu-item")
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    showPage(
                        button.dataset.page
                    );

                    $("sidebar")
                        ?.classList
                        .remove("open");

                }
            );

        }
    );


if ($("mobileMenu")) {

    $("mobileMenu")
        .addEventListener(
            "click",
            () => {

                $("sidebar")
                    ?.classList
                    .toggle("open");

            }
        );

}


if ($("refreshBtn")) {

    $("refreshBtn")
        .addEventListener(
            "click",
            () => {

                loadAll();

            }
        );

}


/* =========================================================
   MODAL CLOSE
========================================================= */

if ($("productModal")) {

    $("productModal")

                ) {

                    closeProductModal();

        );

}


if ($("categoryModal")) {

                ) {

            }
        );

}
