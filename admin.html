<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مدیریت | ماهان سنتر ایران</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    background:#090909;
    color:#fff;
    min-height:100vh;
}

/* LOGIN */
#loginPage{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
        radial-gradient(circle at top,#211b08 0%,#090909 45%);
}

.login-box{
    width:100%;
    max-width:420px;
    background:#111;
    border:1px solid #3a2d0b;
    border-radius:22px;
    padding:35px 25px;
    box-shadow:0 20px 70px rgba(0,0,0,.7);
}

.logo{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    color:#d6ad35;
    margin-bottom:8px;
}

.login-sub{
    text-align:center;
    color:#999;
    font-size:13px;
    margin-bottom:30px;
}

.input-group{
    margin-bottom:18px;
}

.input-group label{
    display:block;
    color:#bbb;
    font-size:13px;
    margin-bottom:8px;
}

.input-group input{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid #333;
    background:#080808;
    color:#fff;
    outline:none;
    font-size:14px;
}

.input-group input:focus{
    border-color:#c9a52d;
}

.login-btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:12px;
    background:linear-gradient(135deg,#d8b43c,#9d7620);
    color:#080808;
    font-weight:bold;
    font-size:15px;
    cursor:pointer;
    margin-top:5px;
}

.login-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.error{
    display:none;
    background:#3b1111;
    color:#ff8b8b;
    border:1px solid #712222;
    padding:11px;
    border-radius:10px;
    margin-bottom:15px;
    font-size:12px;
    text-align:center;
}

/* APP */
#adminApp{
    display:none;
}

.sidebar{
    position:fixed;
    right:0;
    top:0;
    width:250px;
    height:100vh;
    background:#101010;
    border-left:1px solid #242424;
    padding:25px 15px;
    z-index:1000;
}

.brand{
    text-align:center;
    color:#d6ad35;
    font-size:21px;
    font-weight:bold;
    padding:10px;
    margin-bottom:25px;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.menu button{
    border:0;
    background:transparent;
    color:#aaa;
    padding:13px 15px;
    border-radius:12px;
    text-align:right;
    cursor:pointer;
    font-size:14px;
}

.menu button:hover,
.menu button.active{
    background:#211b0c;
    color:#d6ad35;
}

.logout{
    position:absolute;
    bottom:25px;
    right:15px;
    left:15px;
    padding:13px;
    border-radius:12px;
    border:1px solid #3a1919;
    background:#1a0d0d;
    color:#ff7777;
    cursor:pointer;
}

.main{
    margin-right:250px;
    padding:25px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.topbar h1{
    font-size:24px;
}

.admin-info{
    color:#999;
    font-size:12px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:25px;
}

.card{
    background:#111;
    border:1px solid #222;
    border-radius:17px;
    padding:20px;
}

.stat-title{
    color:#999;
    font-size:12px;
    margin-bottom:12px;
}

.stat-value{
    font-size:25px;
    font-weight:bold;
    color:#d6ad35;
}

.content-grid{
    display:grid;
    grid-template-columns:1.5fr 1fr;
    gap:18px;
}

.section-title{
    font-size:17px;
    margin-bottom:20px;
    color:#eee;
}

.chart{
    height:230px;
    display:flex;
    align-items:end;
    justify-content:space-around;
    gap:10px;
    padding-top:20px;
}

.bar-box{
    height:100%;
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:end;
    align-items:center;
    gap:8px;
}

.bar{
    width:65%;
    max-width:45px;
    background:linear-gradient(to top,#8c681d,#d8b43c);
    border-radius:8px 8px 3px 3px;
    min-height:8px;
}

.day{
    color:#888;
    font-size:11px;
}

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.action{
    padding:18px 10px;
    border:1px solid #292929;
    background:#0d0d0d;
    border-radius:13px;
    color:#ccc;
    cursor:pointer;
    text-align:center;
}

.action:hover{
    border-color:#8e701f;
    color:#d6ad35;
}

.orders{
    margin-top:18px;
}

.order{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 0;
    border-bottom:1px solid #222;
}

.order:last-child{
    border-bottom:0;
}

.order-name{
    font-size:13px;
}

.order-price{
    color:#d6ad35;
    font-size:12px;
}

.status{
    font-size:10px;
    padding:5px 8px;
    border-radius:20px;
    background:#172915;
    color:#8fe083;
}

.mobile-menu{
    display:none;
    border:1px solid #333;
    background:#111;
    color:#d6ad35;
    border-radius:10px;
    padding:9px 12px;
    cursor:pointer;
}

/* MOBILE */
@media(max-width:900px){
    .sidebar{
        transform:translateX(100%);
        transition:.3s;
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .main{
        margin-right:0;
        padding:18px;
    }

    .mobile-menu{
        display:block;
    }

    .grid{
        grid-template-columns:repeat(2,1fr);
    }

    .content-grid{
        grid-template-columns:1fr;
    }
}

@media(max-width:500px){
    .grid{
        grid-template-columns:1fr 1fr;
    }

    .stat-value{
        font-size:19px;
    }

    .topbar h1{
        font-size:19px;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">

    <div class="login-box">

        <div class="logo">ماهان سنتر ایران</div>

        <div class="login-sub">
            ورود به پنل مدیریت فروشگاه
        </div>

        <div id="loginError" class="error"></div>

        <div class="input-group">
            <label>ایمیل مدیر</label>
            <input
                type="email"
                id="email"
                placeholder="ایمیل خود را وارد کنید"
                autocomplete="email"
            >
        </div>

        <div class="input-group">
            <label>رمز عبور</label>
            <input
                type="password"
                id="password"
                placeholder="رمز عبور"
                autocomplete="current-password"
            >
        </div>

        <button id="loginBtn" class="login-btn">
            ورود به پنل
        </button>

    </div>

</div>


<!-- ADMIN APP -->
<div id="adminApp">

    <aside class="sidebar" id="sidebar">

        <div class="brand">
            ماهان سنتر ایران
        </div>

        <div class="menu">

            <button class="active">
                📊 داشبورد
            </button>

            <button>
                📦 محصولات
            </button>

            <button>
                🛒 سفارش‌ها
            </button>

            <button>
                👥 مشتریان
            </button>

            <button>
                🎁 کدهای تخفیف
            </button>

            <button>
                📈 گزارش فروش
            </button>

            <button>
                ⚙️ تنظیمات
            </button>

        </div>

        <button class="logout" id="logoutBtn">
            🚪 خروج از حساب
        </button>

    </aside>


    <main class="main">

        <div class="topbar">

            <div>
                <h1>داشبورد مدیریت</h1>
                <div class="admin-info" id="adminEmail"></div>
            </div>

            <button class="mobile-menu" id="mobileMenu">
                ☰
            </button>

        </div>


        <!-- STATS -->
        <div class="grid">

            <div class="card">
                <div class="stat-title">فروش امروز</div>
                <div class="stat-value">۰ تومان</div>
            </div>

            <div class="card">
                <div class="stat-title">سفارش‌ها</div>
                <div class="stat-value">۰</div>
            </div>

            <div class="card">
                <div class="stat-title">محصولات</div>
                <div class="stat-value">۰</div>
            </div>

            <div class="card">
                <div class="stat-title">مشتریان</div>
                <div class="stat-value">۰</div>
            </div>

        </div>


        <div class="content-grid">

            <!-- SALES -->
            <div class="card">

                <div class="section-title">
                    فروش هفتگی
                </div>

                <div class="chart">

                    <div class="bar-box">
                        <div class="bar" style="height:35%"></div>
                        <div class="day">شنبه</div>
                    </div>

                    <div class="bar-box">
                        <div class="bar" style="height:55%"></div>
                        <div class="day">یکشنبه</div>
                    </div>

                    <div class="bar-box">
                        <div class="bar" style="height:45%"></div>
                        <div class="day">دوشنبه</div>
                    </div>

                    <div class="bar-box">
                        <div class="bar" style="height:70%"></div>
                        <div class="day">سه‌شنبه</div>
                    </div>

                    <div class="bar-box">
                        <div class="bar" style="height:50%"></div>
                        <div class="day">چهارشنبه</div>
                    </div>

                    <div class="bar-box">
                        <div class="bar" style="height:85%"></div>
                        <div class="day">پنجشنبه</div>
                    </div>

                    <div class="bar-box">
                        <div class="bar" style="height:65%"></div>
                        <div class="day">جمعه</div>
                    </div>

                </div>

            </div>


            <!-- ACTIONS -->
            <div class="card">

                <div class="section-title">
                    دسترسی سریع
                </div>

                <div class="actions">

                    <div class="action">
                        ➕<br>
                        افزودن محصول
                    </div>

                    <div class="action">
                        🛒<br>
                        سفارش‌ها
                    </div>

                    <div class="action">
                        🎁<br>
                        کد تخفیف
                    </div>

                    <div class="action">
                        📊<br>
                        گزارش فروش
                    </div>

                </div>

            </div>

        </div>


        <!-- ORDERS -->
        <div class="card orders">

            <div class="section-title">
                آخرین سفارش‌ها
            </div>

            <div class="order">

                <div>
                    <div class="order-name">
                        هنوز سفارشی ثبت نشده
                    </div>
                </div>

                <div class="status">
                    خالی
                </div>

            </div>

        </div>

    </main>

</div>


<!-- FIREBASE -->
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


/* FIREBASE CONFIG */

const firebaseConfig = {
    apiKey: "AIzaSyDlrv12gAydgbx1qPJXAIm0kzcSeJF5pNs",
    authDomain: "mahan-center.firebaseapp.com",
    projectId: "mahan-center",
    storageBucket: "mahan-center.firebasestorage.app",
    messagingSenderId: "720478821753",
    appId: "1:720478821753:web:7a431c1a3f9e3abd7923a8"
};


/* INITIALIZE */

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);


/* ELEMENTS */

const loginPage = document.getElementById("loginPage");
const adminApp = document.getElementById("adminApp");
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginError = document.getElementById("loginError");
const adminEmail = document.getElementById("adminEmail");
const mobileMenu = document.getElementById("mobileMenu");
const sidebar = document.getElementById("sidebar");


/* LOGIN */

loginBtn.addEventListener("click", async () => {

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    loginError.style.display = "none";

    if (!email || !password) {

        loginError.textContent =
            "ایمیل و رمز عبور را وارد کنید.";

        loginError.style.display = "block";

        return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = "در حال ورود...";

    try {

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

    } catch (error) {

        console.error(error);

        let message =
            "ورود انجام نشد. ایمیل یا رمز عبور صحیح نیست.";

        if (error.code === "auth/invalid-credential") {
            message =
                "ایمیل یا رمز عبور اشتباه است.";
        }

        if (error.code === "auth/too-many-requests") {
            message =
                "تعداد تلاش‌ها زیاد شده. کمی بعد دوباره امتحان کنید.";
        }

        loginError.textContent = message;
        loginError.style.display = "block";

    } finally {

        loginBtn.disabled = false;
        loginBtn.textContent = "ورود به پنل";

    }

});


/* ENTER KEY */

passwordInput.addEventListener("keydown", (e) => {

    if (e.key === "Enter") {
        loginBtn.click();
    }

});


/* AUTH STATE */

onAuthStateChanged(auth, (user) => {

    if (user) {

        loginPage.style.display = "none";
        adminApp.style.display = "block";

        adminEmail.textContent =
            "مدیر وارد شده: " + (user.email || "");

    } else {

        loginPage.style.display = "flex";
        adminApp.style.display = "none";

    }

});


/* LOGOUT */

logoutBtn.addEventListener("click", async () => {

    await signOut(auth);

});


/* MOBILE SIDEBAR */

mobileMenu.addEventListener("click", () => {

    sidebar.classList.toggle("open");

});

</script>

</body>
                </html>
